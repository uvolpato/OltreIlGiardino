   ============================================================ */
function calcolaAvvisi(){
  const list=[], conflitti=new Set();
  const push=(w,o,leg)=>{const t0=legTasks(o,leg)[0]||o.tasks[0]; list.push({oid:o.id,task:t0.id,when:t0.inizio,keys:[o.id+"|"+leg],...w});};
  const idx=new Map();
  tutti().forEach(t=>{[...t.risorse,...t.mezzi].forEach(r=>{if(!idx.has(r)) idx.set(r,[]); idx.get(r).push(t);});});
  const seen=new Set();
  idx.forEach((ts,res)=>{
    ts.sort((a,b)=>a.inizio-b.inizio);
    for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length && ts[j].inizio<ts[i].fine;j++){
      const a=ts[i], b=ts[j]; if(a.oid===b.oid) continue;
      conflitti.add(a.id); conflitti.add(b.id);
      const k=[res,...[a.oid,b.oid].sort()].join("|"); if(seen.has(k)) continue; seen.add(k);
      const oa=ord(a.oid), ob=ord(b.oid);
      list.push({sev:"alta",cat:"Sovrapposizione",titolo:`${res} è su due incarichi contemporanei`,
        dettaglio:`${oa.cliente}: ${TIPI[a.tipo].s.toLowerCase()} ${rng(a)}  ·  ${ob.cliente}: ${TIPI[b.tipo].s.toLowerCase()} ${rng(b)}`,
        azione:"Trascina la barra su una risorsa libera (vista Per risorsa) o usa «Proponi» sulla tratta.",
        oid:b.oid,task:b.id,when:b.inizio,keys:[a.oid+"|"+a.leg,b.oid+"|"+b.leg]});
    }
  });
  state.ordini.forEach(o=>{
    const e=o.eff; let ztl=false;
    ["C","A","B","R"].forEach(leg=>{
      const ts=legTasks(o,leg); if(!ts.length) return;
      const n=ts[0].risorse.length, need=ts.reduce((m,t)=>Math.max(m,t.persone),0), [s,f]=span(ts);
      if(!n) push({sev:"media",cat:"Assegnazione",titolo:`${LEG[leg]} senza squadra`,dettaglio:`${o.cliente} · ${rng(ts[0])}`,azione:"Usa «Proponi risorse» sull'ordine o assegna dal dettaglio."},o,leg);
      else if(n<need) push({sev:"bassa",cat:"Assegnazione",titolo:`${LEG[leg]}: squadra ridotta (${n} di ${need})`,dettaglio:`${o.cliente} · ${num(e.volume)} m³ da movimentare`,azione:"Aggiungi un addetto o accetta tempi più lunghi."},o,leg);
      ts[0].risorse.forEach(r=>{const x=ADD[r]&&assenza(ADD[r],s,f); if(x){ ts.forEach(t=>conflitti.add(t.id));
        push({sev:"alta",cat:"Assenza",titolo:`${r} è assegnato ma in ${x.tipo.toLowerCase()}`,dettaglio:`${o.cliente} · ${LEG[leg].toLowerCase()} ${rng(ts[0])}`,azione:"Sostituisci l'addetto dal dettaglio dell'incarico."},o,leg);}});
      const nomi=ts[0].risorse; for(let i=0;i<nomi.length;i++) for(let j=i+1;j<nomi.length;j++){ const a=ADD[nomi[i]], b=ADD[nomi[j]]; if(a&&b&&(a.incompatibilita.includes(b.nome)||b.incompatibilita.includes(a.nome))){ ts.forEach(t=>conflitti.add(t.id)); push({sev:"alta",cat:"Squadra",titolo:`Incompatibilità in squadra`,dettaglio:`${o.cliente}: ${a.nome} e ${b.nome} non possono stare insieme`,azione:"Rimuovi uno dei due addetti dalla tratta."},o,leg); break;} }
      if(leg==="C"||leg==="R") return;
      const ms=legMezzi(o,leg).map(n=>MZ[n]);
      if(!ms.length){
        const alt=flotta(o,s,f,null).length?"Scegli il mezzo dal dettaglio della tratta.":"Tutti i mezzi interni sono impegnati o in manutenzione.";
        const eco=stimaTrasportatori(o,leg).sort((a,b)=>a.costo-b.costo)[0];
        push({sev:"media",cat:"Mezzo",titolo:`${LEG[leg]} senza mezzo — ${o.numero}`,dettaglio:`${o.cliente}. ${alt}`,azione:`Valuta ${eco?`${eco.nome} da €${num(eco.costo)}`:CORRIERE.nome+" (preavviso "+CORRIERE.lead+" h, circa €"+CORRIERE.costo+")"} o due viaggi.`},o,leg);
        return;
      }
      ms.filter(m=>fermo(m,s,f)).forEach(m=>push({sev:"alta",cat:"Mezzo",titolo:`${m.nome} è fermo: ${fermo(m,s,f).tipo.toLowerCase()}`,dettaglio:`${o.cliente} · ${LEG[leg].toLowerCase()}`,azione:"Sostituisci il mezzo."},o,leg));
      const cap=ms.reduce((a,m)=>a+m.vol,0);
      // capacità: nessun controllo sul volume finché manca l'anagrafica articoli (vedi STANDBY_VOL)
      const team=ts[0].risorse.map(r=>ADD[r]).filter(Boolean), nd=senzaAutista(team,ms);
      if(team.length && nd.length) push({sev:"alta",cat:"Patente",titolo:ms.length>1?`Manca un autista per ${nd.map(m=>m.nome).join(", ")}`:`Nessuno in squadra guida il ${nd[0].nome}`,dettaglio:`${ms.length>1?ms.length+" mezzi richiedono autisti distinti":"Serve la patente "+nd[0].patente}: ${team.map(a=>a.nome).join(", ")}`,azione:"Aggiungi un autista abilitato o cambia mezzo."},o,leg);
      const z=ZONA[o.zona], vs=z?ms.map(m=>[m,violaZTL(m,z)]).filter(x=>x[1]):[];
      if(vs.length&&ztl) return;
      if(vs.length&&(ztl=true)) push({sev:"media",cat:"ZTL",titolo:`${vs.map(x=>x[0].nome).join(", ")} non ammess${vs.length>1?"i":"o"} in ${z.nome}`,dettaglio:`${o.cliente}: ${vs.map(x=>x[1].join("; ")).join(" · ")}`,azione:`Serve il permesso «${z.permesso}» o un mezzo ammesso. Fonte: ${z.fonte}.`},o,leg);
      else if(z && leg==="A") push({sev:"bassa",cat:"Permesso",titolo:`Accesso in ${z.nome}: richiedi il permesso`,dettaglio:`${o.cliente} · fascia ${z.fascia}`,azione:`Permesso «${z.permesso}». Fonte: ${z.fonte}.`},o,leg);
    });
    o.tasks.filter(t=>t.tipo==="OFFICINA"||t.tipo==="FALEGNAMERIA").forEach(t=>{
      if(t.statoOfficina&&t.statoOfficina!=="completato" && t.scadenzaOfficina && new Date(t.scadenzaOfficina)<=sod(new Date()))
        push({sev:t.prioritaOfficina==="alta"?"alta":"media",cat:"Riparazione",titolo:`${TIPI[t.tipo].s} scaduta — ${o.numero}`,dettaglio:`${o.cliente}: ${t.label||t.descOfficina||""} (scadenza ${dm(new Date(t.scadenzaOfficina))})`,azione:"Aggiorna lo stato o posticipa la scadenza."},o,t.leg);
    });
    if(e.ignoti.length) push({sev:"bassa",cat:"Anagrafica",titolo:`Articoli da censire su ${o.numero}`,dettaglio:`${e.ignoti.join(", ")}: volume e peso sconosciuti, stima indicativa`,azione:"Completa l'anagrafica articoli."},o,"C");
  });
  turni(list);
  oreMax(list);
  const rank={alta:0,media:1,bassa:2};
  list.sort((a,b)=>rank[a.sev]-rank[b.sev]||a.when-b.when);
  /* ogni avviso da risolvere (patente, capacità, mezzo in manutenzione, assenza, sovrapposizione) fa pulsare i task della sua tratta */
  list.filter(w=>w.sev==="alta").forEach(w=>w.keys.forEach(k=>{const [oid,leg]=k.split("|"), o=ord(oid); if(o) legTasks(o,leg).forEach(t=>conflitti.add(t.id));}));
  return {list,conflitti};
}
// ponytail: festività fisse; Pasquetta e patrono vanno da un calendario vero
const FESTIVI=["01-01","01-06","04-25","05-01","06-02","08-15","11-01","12-08","12-25","12-26"];
const festivo=d=>d.getDay()===0||FESTIVI.includes(dkey(d).slice(5));
function turni(list){
  const add=(t,w)=>list.push({oid:t.oid,task:t.id,when:t.inizio,keys:[t.oid+"|"+t.leg],...w});
  const seen=new Set(), once=k=>!seen.has(k)&&seen.add(k);
  ADDETTI.forEach(a=>{
    const ts=tutti().filter(t=>lavoro(t)&&t.risorse.includes(a.nome)).sort((x,y)=>x.inizio-y.inizio);
    const ore={};
    ts.forEach(t=>{const k=dkey(t.inizio); ore[k]=(ore[k]||0)+(t.fine-t.inizio)/H;});
    ts.forEach((t,i)=>{
      const k=dkey(t.inizio);
      if(ore[k]>10 && once("g"+a.nome+k)) add(t,{sev:"media",cat:"Turni",titolo:`${a.nome}: giornata di ${num(ore[k])} h`,dettaglio:`${GG[t.inizio.getDay()]} ${dm(t.inizio)}, oltre le 10 h di lavoro`,azione:"Dividi il lavoro su più persone o su due giorni."});
      const n=ts[i+1];
      if(n && dkey(n.inizio)!==dkey(t.fine) && n.inizio>t.fine && (n.inizio-t.fine)/H<11 && once("r"+a.nome+dkey(n.inizio)))
        add(n,{sev:"media",cat:"Turni",titolo:`${a.nome}: riposo di ${dur((n.inizio-t.fine)/H)}`,dettaglio:`finisce ${GG[t.fine.getDay()]} alle ${hm(t.fine)} e riprende alle ${hm(n.inizio)}: meno di 11 h di riposo`,azione:"Cambia addetto su uno dei due incarichi."});
    });
  });
  tutti().filter(lavoro).forEach(t=>{
    const o=ord(t.oid);
    for(let d=addD(sod(t.inizio),-1); d<=t.fine; d=addD(d,1)){
      const ns=addH(d,22), ne=addH(d,30);
      if(t.inizio<ne && t.fine>ns && once("n"+t.oid+t.leg)){ add(t,{sev:"media",cat:"Orari",titolo:`Lavoro notturno — ${o.numero}`,dettaglio:`${o.cliente}: ${tsh(t).toLowerCase()} ${rng(t)} (fascia 22–6)`,azione:"Le offerte escludono i lavori notturni salvo accordi: verifica con il commerciale."}); break; }
    }
    if(festivo(t.inizio) && once("f"+t.oid+t.leg)) add(t,{sev:"bassa",cat:"Orari",titolo:`Lavoro in giorno festivo — ${o.numero}`,dettaglio:`${o.cliente}: ${GG[t.inizio.getDay()]} ${dm(t.inizio)}`,azione:"Le offerte escludono i festivi salvo accordi: verifica con il commerciale."});
  });
  tutti().filter(t=>t.tipo==="PERNOTTAMENTO").forEach(t=>{const o=ord(t.oid);
    add(t,{sev:"bassa",cat:"Trasferta",titolo:`Pernottamento: ${t.risorse.length} persone — ${o.numero}`,dettaglio:`${o.location} · ${rng(t)}${t.nota?" · "+t.nota:""}`,azione:"Prenota l'alloggio e annotalo sul micro-task."});});
}

   VISTA: PIANIFICAZIONE (Gantt)

/* finestra scorrevole: parte da state.date (non dal lunedì o dal giorno 1), lunga un giorno, una settimana o un mese */
function range(){
  const s=sod(state.date);
  const e=state.zoom==="giorno"?addD(s,1):state.zoom==="settimana"?addD(s,7):addM(s,1);
  /* se lo zoom lascerebbe spazio vuoto a destra, la scala si allarga fino a riempire l'area visibile */
  const ore=(e-s)/H, fill=state.gw?(state.gw-LW())/ore:0, pxh=Math.max(state.pxh[state.zoom],fill);
  const x=d=>(d-s)/H*pxh;
  return {s,e,x,W:x(e),pxh,fill};
}
const LW=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw"))||256;
function bar(t,R,{top=14,h=26,from="",kind=""}={}){
  if(t.fine<=R.s||t.inizio>=R.e) return "";
  // geometria esatta: 1px di stacco fra task contigui, nessuna larghezza minima che invada il vicino
  const l0=Math.max(0,R.x(t.inizio)), w0=Math.min(R.W,R.x(t.fine))-l0;
  const l=l0+.5, w=Math.max(w0-1,1.5), o=ord(t.oid), T=TIPI[t.tipo];
  const txt=w>96?`${tsh(t)} ${hm(t.inizio)}`:w>52?tsh(t):"";
  const tip=[`${tl(t)} — ${o.cliente}${t.manual?" (modificato a mano)":""}`,rng(t),t.risorse.join(", ")||"Nessun addetto",t.mezzi.join(", ")].filter(Boolean).join("\n");
  return `<button class="bar${txt?"":" slim"}${T.occ?" occ":""}${t.manual?" manual":""}${state.av.conflitti.has(t.id)?" is-conflict":""}" style="left:${l}px;width:${w}px;top:${top}px;height:${h}px;--c:var(${T.c})" data-act="task" data-id="${t.id}"${from?` draggable="true" data-from="${esc(from)}" data-kind="${kind}"`:""} title="${esc(tip)}" aria-label="${esc(tip.replace(/\n/g,", "))}">${txt?esc(txt):w>=16?'<span class="more" aria-hidden="true"><i></i><i></i><i></i></span>':""}</button>`;
}
/* punto di partenza: oggi, ma se oggi cade a metà di un ordine si torna all'inizio del primo ordine in corso */
function ancora(d=TODAY){
  const g=sod(d), inCorso=state.ordini.map(o=>span(o.tasks)).filter(([a,b])=>a<g&&b>g);
  return inCorso.length?sod(new Date(Math.min(...inCorso.map(x=>x[0])))):g;
}
/* zoom: px per ora, a scatti; la scala delle ore si adatta così le etichette non si sovrappongono */
const ZOOM_STEPS=[1,1.5,2,3,4,6,8,12,16,24,32,48,64,96,128,192];
const ZOOM_FIT={giorno:64,settimana:4,mese:1.5}, ZOOM_MIN={giorno:32,settimana:2,mese:1};
function setZoom(dir,clientX){
  const z=state.zoom, R0=range(), cur=R0.pxh;
  if(dir<0&&cur<=R0.fill+.01) return toast("La griglia mostra già tutto il periodo: per vedere più giorni usa Settimana o Mese.");
  const next=dir>0?ZOOM_STEPS.find(p=>p>cur):[...ZOOM_STEPS].reverse().find(p=>p<cur);
  if(!next||next<ZOOM_MIN[z]) return;
  const g=document.querySelector(".gscroll"), lw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw"));
  const ax=g?(clientX??g.getBoundingClientRect().left+lw+(g.clientWidth-lw)/2)-g.getBoundingClientRect().left:0;
  const ore=g?(g.scrollLeft+ax-lw)/cur:0;  // ora sotto il cursore (o al centro)
  state.pxh[z]=next; render();
  const g2=document.querySelector(".gscroll"); if(g2) g2.scrollLeft=ore*next+lw-ax;
}
function scaleHtml(R, zoom=state.zoom){
  const ticks=[], lines=[], pxh=R.pxh;
  const step=[1,2,3,6,12].find(s=>s*pxh>=(zoom==="giorno"?44:30))||24;
  if(zoom==="giorno"){
    for(let i=0;i<24;i+=step){const d=addH(R.s,i), x=R.x(d); ticks.push(`<span class="tk" style="left:${x}px">${pad(d.getHours())}:00</span>`); if(i) lines.push(`<i style="left:${x}px"></i>`);}
    /* notte (fuori 6–20) in grigio */
    lines.unshift(`<i class="shade" style="left:0;width:${R.x(addH(R.s,6))}px"></i><i class="shade" style="left:${R.x(addH(R.s,20))}px;width:${R.W-R.x(addH(R.s,20))}px"></i>`);
  } else {
    for(let d=new Date(R.s),i=0; d<R.e; d=addD(d,1),i++){
      const x=R.x(d), w=R.x(addD(d,1))-x, today=dkey(d)===dkey(TODAY), we=d.getDay()%6===0;
      const m1=i>0&&d.getDate()===1, lab=w>=56?`${GG[d.getDay()]} ${d.getDate()}`:w>=18||d.getDay()===1?`${d.getDate()}`:"";
      ticks.push(`<span class="tk${today?" today":""}${m1?" m1":""}" style="left:${x}px;width:${w}px"><b>${lab}</b></span>`);
      if(step<24) for(let h=step;h<24;h+=step){const hx=R.x(addH(d,h)); ticks.push(`<span class="tk minor" style="left:${hx-6}px">${step<6?pad(h)+":00":h}</span>`); if(pxh>=12) lines.push(`<i class="hr" style="left:${hx}px"></i>`);}
      if(today||we) lines.push(`<i class="${today?"today":"shade"}" style="left:${x}px;width:${w}px"></i>`);
      if(i) lines.push(`<i style="left:${x}px"></i>`);
    }
  }
  const now=new Date(), nowL=now>R.s&&now<R.e?`<div class="g-now" style="left:${R.x(now)}px"></div>`:"";
  return {mesi:mesiHtml(R, zoom),ticks:ticks.join(""),overlay:lines.join("")+nowL};
}
/* barra dei mesi: un segmento colorato per mese, con il nome sticky (resta visibile scorrendo) */
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function mesiHtml(R, zoom=state.zoom){
  let out=""; const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  for(let m=new Date(R.s.getFullYear(),R.s.getMonth(),1); m<R.e; m=addM(m,1)){
    const a=R.x(new Date(Math.max(m,R.s))), b=R.x(new Date(Math.min(addM(m,1),R.e))), w=b-a, y=m.getFullYear(), nome=cap(MESI[m.getMonth()]);
    const full=zoom==="giorno"?dayLong(R.s):`${nome} ${y}`;
    const lab=w>=150?full:w>=90?nome:w>=48?`${nome.slice(0,3)} ${String(y).slice(2)}`:w>=28?nome.slice(0,3):w>=12?nome[0]:"";
    out+=`<div class="mbseg" style="width:${Math.max(1,w)}px;--h:${m.getMonth()*30}" title="${full}"><span class="mb-lab">${lab}</span></div>`;
  }
  return out;
}
function gRow(label,sub,track,{cls="",h=54,lead="",attrs="",cells=""}={}){
  return `<div class="g-row ${cls}" ${attrs}><div class="g-label">${lead}<div class="t"><div class="l1">${label}</div><div class="l2">${sub}</div></div></div><div class="g-track" style="min-height:${h}px">${cells}${track}</div></div>`;
}
/* ============ COMPONENTE RIUSABILE: timeline (Gantt) ============
   R = range {s,e,x,W,pxh} (mappatura tempo→px), zoom = "giorno"|"settimana"|"mese" (per la scala).
   body = HTML delle righe (.g-row) già costruite. Usato dalla Pianificazione e dal dialog addetto (renderAeTimeline). */
function timeline(R, {corner="", body="", zoom=state.zoom}={}){
  const sc=scaleHtml(R, zoom);
  return `<div class="gscroll"><div class="gantt" style="--w:${R.W}px">
    <div class="g-head"><div class="g-corner eyebrow">${corner}</div><div class="g-scale"><div class="g-mbar">${sc.mesi}</div>${sc.ticks}</div></div>
    <div class="g-overlay">${sc.overlay}</div>
    ${body}
  </div></div>`;
}
/* ordinamento delle offerte nel Gantt; a parità, per inizio */
const inizioOrd=o=>Math.min(...o.tasks.map(t=>+t.inizio)), RANK_STATO={Conflitti:0,"Da assegnare":1,"Da verificare":2,Pronto:3};
const ORDINA={
  inizio:["data di inizio",(a,b)=>inizioOrd(a)-inizioOrd(b)],
  consegna:["data di consegna",(a,b)=>new Date(a.consegna)-new Date(b.consegna)||inizioOrd(a)-inizioOrd(b)],
  stato:["criticità",(a,b)=>RANK_STATO[statoOrdine(a)[0]]-RANK_STATO[statoOrdine(b)[0]]||inizioOrd(a)-inizioOrd(b)],
  cliente:["cliente A–Z",(a,b)=>a.cliente.localeCompare(b.cliente,"it")||inizioOrd(a)-inizioOrd(b)],
  numero:["numero offerta",(a,b)=>a.numero.localeCompare(b.numero,"it",{numeric:true})],
  resp:["responsabile",(a,b)=>a.resp.localeCompare(b.resp,"it")||inizioOrd(a)-inizioOrd(b)]

const inConf=(t,R)=>state.av.conflitti.has(t.id)&&t.fine>R.s&&t.inizio<R.e;
/* celle della griglia toccate dai task in conflitto: un'ora nella scala Giorno (o il passo delle etichette), altrimenti un giorno */
function celle(ts,R, zoom=state.zoom){
  const conf=ts.filter(t=>inConf(t,R)); if(!conf.length) return "";
  const unita=zoom==="giorno"?([1,2,3,6,12].find(s=>s*R.pxh>=44)||1)*H:24*H, set=new Set();
  conf.forEach(t=>{ for(let c=Math.floor((Math.max(t.inizio,R.s)-R.s)/unita); c*unita<Math.min(t.fine,R.e)-R.s; c++) set.add(c); });
  return [...set].map(c=>{const a=R.x(new Date(+R.s+c*unita)), b=Math.min(R.W,R.x(new Date(+R.s+(c+1)*unita))); return `<i class="cellpulse" style="left:${a}px;width:${b-a}px"></i>`;}).join("");
}
function ganttOrdini(R){
  const vis=state.ordini.filter(o=>o.tasks.some(t=>t.fine>R.s&&t.inizio<R.e)).sort(ORDINA[state.sort][1]);
  if(!vis.length) return gRow('<span class="muted">Nessun ordine</span>',"in questo periodo",'<div class="g-empty">Nessun ordine in questo periodo: usa le frecce in alto per spostarti nel calendario.</div>',{h:90});

    let html=gRow(`<span class="row" style="gap:6px"><i class="dot ${sc}" title="${st}"></i><span class="grow" style="overflow:hidden;text-overflow:ellipsis">${esc(o.cliente)}</span></span>`,`${esc(o.numero)} · ${esc(o.location.split(" — ").pop())}`,
      o.tasks.map(t=>bar(t,R,{top:16,h:22})).join(""),{lead,cells:celle(o.tasks,R)});
    if(open) html+=[...o.tasks].sort((a,b)=>a.inizio-b.inizio).map(t=>gRow(esc(tl(t)),`${hm(t.inizio)}–${hm(t.fine)} · ${esc(t.risorse.length?t.risorse.map(n=>n.split(" ")[0]).join(", "):"da assegnare")}`,bar(t,R),{cls:"child",cells:celle([t],R)})).join("");
    return html;
  }).join("");
}
function lanes(ts){
  const ends=[];
  const out=ts.slice().sort((a,b)=>a.inizio-b.inizio).map(t=>{let i=ends.findIndex(e=>e<=t.inizio); if(i<0){i=ends.length; ends.push(0);} ends[i]=t.fine; return {t,i};});
  return {out,n:Math.max(1,ends.length)};
}
function clashes(ts,R){
  let h="";
  for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++){
    const a=ts[i], b=ts[j]; if(a.oid===b.oid||!(a.inizio<b.fine&&b.inizio<a.fine)) continue;
    const l=R.x(new Date(Math.max(a.inizio,b.inizio))), r=R.x(new Date(Math.min(a.fine,b.fine)));
    h+=`<div class="clash" style="left:${Math.max(0,l)}px;width:${Math.max(4,Math.min(R.W,r)-Math.max(0,l))}px"></div>`;
  }
  return h;
}
function ganttRisorse(R){
  const inR=t=>t.fine>R.s&&t.inizio<R.e, all=tutti().filter(inR);
  const riga=(key,label,sub,kind,ts,extra="")=>{
    const L=lanes(ts), h=L.n*32+22;
    return gRow(label,sub,extra+clashes(ts,R)+L.out.map(({t,i})=>bar(t,R,{top:14+i*32,h:26,from:key,kind})).join(""),{h,attrs:`data-drop="${esc(key)}" data-kind="${kind}"`,cells:celle(ts,R)});
  };
  const sec=t=>`<div class="g-section eyebrow">${t}</div>`;
  return sec("Addetti")+ADDETTI.map(a=>{
    let off="";
    for(const x of (a.assenze||[])){
      const i=a.assenze.indexOf(x);
      if(x.intera===false){
        if(!x.giorno) continue;
        const ds=new Date(x.giorno+"T"+(x.dalle||"00:00")), de=new Date(x.giorno+"T"+(x.alle||"23:59"));
        if(ds>=R.e||de<=R.s) continue;
        const l=Math.max(0,R.x(ds)), r=Math.min(R.W,R.x(de));
        off+=`<div class="off" style="left:${l}px;width:${Math.max(2,r-l)}px" data-act="rm-assenza" data-addetto="${esc(a.nome)}" data-i="${i}" title="Clicca per rimuovere ${esc(x.tipo)}">${esc(x.tipo)} ${esc(x.dalle||"")}–${esc(x.alle||"")}</div>`;
      }else{
        if(!x.da) continue;
        for(let d=sod(new Date(x.da+"T00:00:00")); d<addD(sod(new Date((x.a||x.da)+"T00:00:00")),1); d=addD(d,1)){
          if(d>=R.e||addD(d,1)<=R.s) continue;
          const l=Math.max(0,R.x(d)), r=Math.min(R.W,R.x(addD(d,1)));
          off+=`<div class="off" style="left:${l}px;width:${r-l}px" data-act="rm-assenza" data-addetto="${esc(a.nome)}" data-i="${i}" title="Clicca per rimuovere ${esc(x.tipo)}">${esc(x.tipo)}</div>`;
        }
      }
    }
    const ore=oreSettimana(a.nome,state.date);
    return riga(a.nome,esc(a.nome),`${esc(a.ruoli.join(" / "))} · ${a.patenti.length?"pat. "+a.patenti.join("/"):"senza patente"} · ${num(ore,0)} h sett.`,"addetto",all.filter(t=>t.risorse.includes(a.nome)),off);
  }).join("")+sec("Mezzi")+MEZZI.map(m=>{
    const off=(m.fermi||[]).map(x=>{ const sp=assSpan(x); if(!sp||sp[0]>=R.e||sp[1]<=R.s) return ""; const l=Math.max(0,R.x(sp[0])), r=Math.min(R.W,R.x(sp[1])); return `<div class="off" style="left:${l}px;width:${Math.max(2,r-l)}px" title="${esc(assDesc(x))}">${esc(x.tipo)}</div>`; }).join("");
    return riga(m.nome,esc(m.nome),`${m.vol} m³ · pat. ${m.patente} · Euro ${m.euro} · ${num(m.massa)} t`,"mezzo",all.filter(t=>t.mezzi.includes(m.nome)),off);
  }).join("");
}

/* report cartacei del giorno, uno per ordine:
   - Da preparare: i carichi (CARICO) del giorno DOPO quello scelto (si stampa la sera prima) → articoli da preparare e caricare
   - Rientri attesi: rientri e riconsegne (RIENTRO, RICONSEGNA) del giorno → articoli da controllare al rientro
   Le persone sono quelle schedulate su quel task. Le caselle e le colonne vuote si compilano a penna. */
function magReport(tipo,d){
  const k=dkey(tipo==="prep"?addD(d,1):d), tipi=tipo==="prep"?["CARICO"]:["RIENTRO","RICONSEGNA"];
  return tutti().filter(t=>tipi.includes(t.tipo)&&dkey(t.inizio)===k).sort((a,b)=>a.inizio-b.inizio).map(t=>{
    const o=ord(t.oid), andata=tipo==="prep"?legTasks(o,t.leg).find(x=>x.tipo!=="CARICO"&&TIPI[x.tipo].mezzo):null;
    return {t,o,mezzi:t.mezzi.length?t.mezzi:(andata?.mezzi||[]),partenza:andata?.inizio,righe:o.righe.map(([c,q])=>({c,q,a:ART[c]}))};
  });
}
function magScheda(r,tipo){
  const {t,o}=r, cella='<td class="pen"></td>', box='<td class="pen c">☐</td>';
  const cosa=tipo==="prep"?(o.servizio==="ritiro"?"Ritira il cliente":"Preparazione e carico"):(t.tipo==="RICONSEGNA"?"Riconsegna del cliente":"Rientro dall'evento");
  const info=[["Orario",`${hm(t.inizio)}–${hm(t.fine)}`+(r.partenza?` · partenza ${hm(r.partenza)}`:"")],["Persone",t.risorse.length?esc(t.risorse.join(", ")):'<span class="need">da assegnare</span>'],
    ["Mezzo",r.mezzi.length?esc(r.mezzi.join(" + ")):(o.servizio==="ritiro"?"del cliente":'<span class="need">da assegnare</span>')],["Location",esc(o.location)+(o.zona?` · ZTL ${esc(o.zona)}`:"")]];
  const testa=tipo==="prep"?"<th>Preparato</th><th>Caricato</th>":"<th>Rientrati</th><th>Danneggiati</th><th>Mancanti</th>";
  const righe=r.righe.map(x=>`<tr><td class="mono">${esc(x.c)}</td><td>${x.a?esc(x.a.desc):'<span class="need">non in anagrafica</span>'}</td><td class="num">${x.q}</td>${tipo==="prep"?box+box:cella+cella+cella}</tr>`).join("");
  return `<article class="card mag-sheet">
    <div class="mag-h"><div class="grow"><div class="eyebrow">${cosa} · ${esc(o.numero)}</div><h3>${esc(o.cliente)}${o.evento?` <span class="muted">· ${esc(o.evento)}</span>`:""}</h3></div><div class="mono">${hm(t.inizio)}</div></div>
    <dl class="mag-info">${info.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl>
    <table class="mag-t"><thead><tr><th>Codice</th><th>Articolo</th><th class="num">${tipo==="prep"?"Q.tà":"Attesi"}</th>${testa}</tr></thead><tbody>${righe}</tbody></table>
    ${o.nota?`<p class="small"><b>Note:</b> ${esc(o.nota)}</p>`:""}
    <div class="mag-firma"><span>Note: ______________________________________________</span><span>Firma: ____________________</span></div>
  </article>`;
}
function viewMagazzino(){
  const d=state.date, tab=state.mtab||"prep", prep=magReport("prep",d), rien=magReport("rien",d), list=tab==="prep"?prep:rien;
  const pezzi=l=>l.reduce((n,r)=>n+r.righe.reduce((m,x)=>m+x.q,0),0), senza=l=>l.filter(r=>!r.t.risorse.length).length;

  <div class="card no-print">${UI.schede("mtab",[["prep",`Da preparare per domani <span class="tab-n">${prep.length}</span>`],["rien",`Rientri attesi <span class="tab-n">${rien.length}</span>`]])}</div>
  <div class="print-only mag-title"><b>${tab==="prep"?`Preparazioni per ${esc(dayLong(addD(d,1)))}`:`Rientri attesi — ${esc(dayLong(d))}`}</b> · ${MAGAZZINO}</div>
  <div class="mag-list">${list.map(r=>magScheda(r,tab)).join("")||`<div class="card"><div class="empty">${tab==="prep"?"Nessuna preparazione per il giorno dopo":"Nessun rientro in questo giorno"}. Usa le frecce in alto per cambiare giorno.</div></div>`}</div>`;

function esportaMagazzinoCSV(){
  const d=state.date, k=dkey(d), tab=state.mtab||"prep", q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Data","Report","Ordine","Cliente","Ora","Persone","Mezzo","Codice","Articolo","Quantità"]];
  magReport(tab,d).forEach(r=>r.righe.forEach(x=>rows.push([dkey(r.t.inizio),tab==="prep"?"Preparazione":"Rientro",r.o.numero,r.o.cliente,hm(r.t.inizio),r.t.risorse.join(", "),r.mezzi.join(" + "),x.c,x.a?.desc||"",x.q])));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download=`Magazzino ${tab==="prep"?"preparazioni":"rientri"} ${k}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* ============ DIALOG A SCHEDE CON DISPONIBILITÀ (addetti: assenze · mezzi: fermi) ============
   _assTmp = periodi in modifica (la timeline legge questi, non quelli salvati); _ae.c = configurazione del tipo. */
let _assTmp=[], _ae={};
const ASS_TIPI=["Ferie","Permesso","Riposo","Malattia"];
const DISP={
  addetti:{lista:()=>ADDETTI,campo:"assenze",tipi:()=>ASS_TIPI,def:"Ferie",corner:"Addetto",nuovo:"Nuovo addetto",cosa:"assenza",cose:"Assenze",
    tabs:[["anag","Anagrafica"],["comp","Competenze"]],
    /* colleghi = chiunque altro */
    simili:()=>true, altriSub:"assente nel mese",
    conta:n=>n?`${n} ${n===1?"collega assente":"colleghi assenti"} nel mese`:"Nessun collega assente nel mese",
    nota:(sp,altri)=>altri.length?["Assenti anche: "+altri.join(", "),"t-warn"]:["",""]},
  mezzi:{lista:()=>MEZZI,campo:"fermi",tipi:()=>STATI_MEZZI,def:"Manutenzione",corner:"Mezzo",nuovo:"Nuovo mezzo",cosa:"fermo",cose:"Fermi",
    tabs:[["dati","Dati"],["scad",'Scadenze<span class="tab-n warn" id="aeScadN" hidden></span>']],
    /* colleghi = mezzi dello stesso tipo (i possibili sostituti) */
    simili:o=>o.tipo===($("c-tipo")?.value.trim()||_ae.item?.tipo), altriSub:"stesso tipo, fermo nel mese",
    conta:n=>n?`${n} ${n===1?"mezzo":"mezzi"} dello stesso tipo ${n===1?"fermo":"fermi"} nel mese`:"Nessun mezzo dello stesso tipo fermo nel mese",
    nota:sp=>{ const lib=MEZZI.filter(m=>m.nome!==_ae.nome&&DISP.mezzi.simili(m)&&!(m.fermi||[]).some(y=>incrocia(sp,assSpan(y)))).map(m=>m.nome);
      return lib.length?["Sostituti liberi dello stesso tipo: "+lib.join(", "),"muted"]:["Nessun sostituto libero dello stesso tipo","t-warn"]; }}
};
const mese1=d=>new Date(d.getFullYear(),d.getMonth(),1);
/* intervallo [inizio, fine) di un periodo; null se incompleto */
function assSpan(x){
  if(x.intera===false) return x.giorno&&x.dalle?[new Date(x.giorno+"T"+x.dalle),new Date(x.giorno+"T"+(x.alle||x.dalle))]:null;
  return x.da?[sod(new Date(x.da+"T00:00:00")),addD(sod(new Date((x.a||x.da)+"T00:00:00")),1)]:null;
}
const assDesc=x=>x.intera===false?`${x.tipo} ${x.giorno?dm(new Date(x.giorno+"T00:00")):""} ${x.dalle||""}–${x.alle||""}`:`${x.tipo} ${x.da?dm(new Date(x.da+"T00:00")):""}${x.a&&x.a!==x.da?"–"+dm(new Date(x.a+"T00:00")):""}`;
const incrocia=(a,b)=>a&&b&&a[0]<b[1]&&b[0]<a[1];
/* altri elementi (colleghi / mezzi simili) con periodi che si sovrappongono a sp */
const altriIn=sp=>_ae.c.lista().filter(o=>o.nome!==_ae.nome&&_ae.c.simili(o)&&(o[_ae.c.campo]||[]).some(y=>incrocia(sp,assSpan(y))));
/* errore bloccante della riga i ("" se ok) */
function assErrore(x,i){
  const sp=assSpan(x); if(!sp) return _ae.verifica?"Inserisci le date":"";
  if(sp[1]<=sp[0]) return x.intera===false?"L'orario di fine è prima dell'inizio":"La data di fine è prima dell'inizio";
  const j=_assTmp.findIndex((y,k)=>k!==i&&incrocia(sp,assSpan(y)));
  return j>=0?`Si sovrappone a: ${assDesc(_assTmp[j])}`:"";
}
function assMeta(x,i){
  const err=assErrore(x,i), sp=assSpan(x);
  const dur=!sp||err?"":x.intera===false?`${num((sp[1]-sp[0])/H,1)} h`:`${Math.round((sp[1]-sp[0])/(24*H))} gg`;
  if(err) return {err,dur,msg:err,cls:"t-err"};
  if(!sp) return {err,dur,msg:"Inserisci le date",cls:"muted"};
  const [msg,cls]=_ae.c.nota(sp,altriIn(sp).map(o=>o.nome)); return {err,dur,msg,cls};
}
function assRow(x,i){
  const intera=x.intera!==false, m=assMeta(x,i), tipi=_ae.c.tipi();
  const f=(k,t,lab,val=x[k])=>`<input type="${t}" data-ass="${k}" data-i="${i}" value="${esc(val||"")}" aria-label="${lab}">`;
  return `<div class="ass-row${m.err?" bad":""}" id="ass-${i}">
    <select data-ass="tipo" data-i="${i}" aria-label="Tipo">${[...new Set([...tipi,x.tipo])].map(t=>`<option${x.tipo===t?" selected":""}>${esc(t)}</option>`).join("")}</select>
    <select data-ass="modo" data-i="${i}" aria-label="Durata"><option value="intera"${intera?" selected":""}>Giorni interi</option><option value="parziale"${intera?"":" selected"}>Ore</option></select>
    ${intera?f("da","date","Dal")+'<span class="muted">→</span>'+f("a","date","Al",x.a||x.da):f("giorno","date","Giorno")+f("dalle","time","Dalle")+'<span class="muted">→</span>'+f("alle","time","Alle")}
    <span class="grow"></span><span class="ass-dur">${m.dur}</span>
    <button type="button" class="icon-btn" data-act="ass-del" data-i="${i}" aria-label="Togli ${esc(assDesc(x))}">${icon("x",13)}</button>
    <div class="ass-msg ${m.cls}" role="status">${esc(m.msg)}</div>
  </div>`;
}
/* passato = già concluso (finisce entro oggi): va in Archivio; quelli in corso restano "in programma" */
const assPassata=x=>{ const sp=assSpan(x); return !!sp&&sp[1]<=sod(TODAY); };
/* due liste: in programma (scheda Disponibilità) e archivio, in ordine di data; ridisegna anche la timeline */
function renderAssenze(){
  const el=$("assList"), ar=$("assArch"); if(!el) return;
  const fa=document.activeElement?.dataset?.ass?[document.activeElement.dataset.ass,document.activeElement.dataset.i]:null;
  const ord=_assTmp.map((x,i)=>i).sort((a,b)=>(assSpan(_assTmp[a])?.[0]??Infinity)-(assSpan(_assTmp[b])?.[0]??Infinity));
  const prox=ord.filter(i=>!assPassata(_assTmp[i])), pass=ord.filter(i=>assPassata(_assTmp[i])).reverse(), c=_ae.c.cose.toLowerCase();
  el.innerHTML=prox.map(i=>assRow(_assTmp[i],i)).join("")||`<div class="muted small">Nessun${_ae.c.cosa==="fermo"?" fermo":"'assenza"} in programma.</div>`;
  ar.innerHTML=pass.map(i=>assRow(_assTmp[i],i)).join("")||`<div class="muted small">Nessun${_ae.c.cosa==="fermo"?" fermo concluso":"'assenza passata"}.</div>`;

  const labels={ordine:"Ordine",tratta:"Tratta",task:"Questo task",avvisi:"Avvisi",piano:"Piano"};
  return `<section class="card det-panel det-${scope}"><div class="card-head"><span class="scope ${scope}">${labels[scope]||scope}</span><h2 class="grow">${titolo}${aiuto?` ${UI.hint(aiuto)}`:""}</h2>${azioni}</div><div class="card-body">${corpo}</div></section>`;
}

function editorOfficina(o){
  const task=o.tasks.filter(t=>t.tipo==="OFFICINA"||t.tipo==="FALEGNAMERIA");
  const lista=task.map(t=>`<div class="mt-row${t.manual?" manual":""}" style="--c:var(${TIPI[t.tipo].c})"><i></i>
    <span class="grow small">${esc(t.label||t.descOfficina||"Senza descrizione")} · ${UI.stato(t.prioritaOfficina||"media",t.prioritaOfficina==="alta"?"err":"warn")} · scadenza ${t.scadenzaOfficina?dm(new Date(t.scadenzaOfficina)):"—"} · ${t.statoOfficina||"da fare"}</span>
    <button class="icon-btn" data-act="mt-del" data-id="${t.id}" aria-label="Elimina">${icon("x",13)}</button></div>`).join("");
  return `${lista}
    <div class="fgrid" style="margin-top:10px">
      ${UI.selezione({id:"off-tipo",etichetta:"Tipo",opzioni:[["OFFICINA","Officina / riparazione"],["FALEGNAMERIA","Falegnameria"]],nascosta:false})}
      ${UI.campo({id:"off-desc",etichetta:"Descrizione"})}
      ${UI.selezione({id:"off-prio",etichetta:"Priorità",opzioni:[["bassa","Bassa"],["media","Media"],["alta","Alta"]],nascosta:false})}
      ${UI.campo({id:"off-scad",etichetta:"Scadenza",tipo:"date"})}
      ${UI.selezione({id:"off-stato",etichetta:"Stato",opzioni:[["da fare","Da fare"],["in corso","In corso"],["completato","Completato"]],nascosta:false})}
      <div><label class="fl">&nbsp;</label><button class="btn btn-sm" data-act="nuovo-task-officina" data-oid="${o.id}">Aggiungi</button></div>
    </div>`;
}
function aggiungiOfficina(o,tipo,desc,prio,scad,stato){
  const inizio=new Date(o.consegna), fine=addH(inizio,1);
  const t={id:`${o.id}-t${++TID}`,oid:o.id,tipo,leg:"A",inizio,fine,persone:1,why:"Task aggiunto a mano (officina/falegnameria)",
    risorse:[],mezzi:[],manual:true,label:tipo==="OFFICINA"?"Officina":"Falegnameria",descOfficina:desc||"",
    prioritaOfficina:prio||"media",scadenzaOfficina:scad||dkey(inizio),statoOfficina:stato||"da fare"};
  o.tasks.push(t); return t;
}

function editorTask(o){
  const tipi=Object.entries(TIPI).filter(([k])=>k!=="RICONSEGNA");
  return ["C","A","B","R"].map(leg=>{
    const ts=legTasks(o,leg); if(!ts.length&&leg!=="B") return "";
    const head=leg==="A"&&o.servizio!=="ritiro"?`<div class="mt-dopo"><label class="fl" for="dopo-${o.id}">Dopo il lavoro la squadra</label>
      <select id="dopo-${o.id}" data-ed="dopo" data-oid="${o.id}">${Object.entries(DOPO).map(([k,l])=>`<option value="${k}"${(o.dopo||o.dopoProposta?.v)===k?" selected":""}>${l}${o.dopoProposta?.v===k?" (proposta)":""}</option>`).join("")}</select>
      ${o.dopoProposta?`<p class="tiny muted">Proposta: ${DOPO[o.dopoProposta.v].toLowerCase()}, perché ${esc(o.dopoProposta.motivo)}.</p>`:""}</div>`:"";
    if(!ts.length) return "";
    return `<div class="mt-leg"><div class="row"><strong class="grow">${LEG[leg]}</strong><button class="btn btn-sm btn-ghost" data-act="reset-leg" data-id="${o.id}" data-leg="${leg}">Ripristina</button></div>${head}
      ${ts.map((t,i)=>`<div class="mt-row${t.manual?" manual":""}" style="--c:var(${TIPI[t.tipo].c})"><i class="${TIPI[t.tipo].occ?"occ":""}"></i>
        ${t.tipo==="ALTRO"?`<input aria-label="Nome attività" value="${esc(t.label||"")}" data-ed="label" data-tid="${t.id}">`:`<button class="mt-name" data-act="task" data-id="${t.id}">${esc(tl(t))}</button>`}
        <input aria-label="Inizio ${esc(tl(t))}" type="datetime-local" step="900" value="${dtl(t.inizio)}" data-ed="start" data-tid="${t.id}">
        <input aria-label="Durata in ore" type="number" min="0.25" step="0.25" value="${(t.fine-t.inizio)/H}" data-ed="dur" data-tid="${t.id}">
        <span class="mt-btns"><button class="icon-btn" data-act="mt-up" data-id="${t.id}" aria-label="Sposta prima"${i?"":" disabled"}>↑</button><button class="icon-btn" data-act="mt-down" data-id="${t.id}" aria-label="Sposta dopo"${i<ts.length-1?"":" disabled"}>↓</button><button class="icon-btn" data-act="mt-del" data-id="${t.id}" aria-label="Elimina">${icon("x",13)}</button></span></div>`).join("")}

  }).join("");
}

function toast(msg,kind=""){
  const n=document.createElement("div"); n.className="toast "+kind; n.textContent=msg; $("toasts").append(n);
  setTimeout(()=>{n.style.opacity="0"; setTimeout(()=>n.remove(),220);},3800);
}
function dopoModifica(msg){
  registra(msg);
  const prima=state.av.list.filter(w=>w.sev==="alta").length;
  render();
  const dopo=state.av.list.filter(w=>w.sev==="alta").length;
  toast(dopo>prima?`${msg}. Attenzione: ${dopo-prima} nuovi conflitti.`:dopo<prima?`${msg}. Risolti ${prima-dopo} conflitti.`:msg, dopo>prima?"warn":"");
}
function setPersone(t,fn){ legTasks(ord(t.oid),t.leg).forEach(x=>{x.risorse=fn(x.risorse); x.manual=true;}); }
function setMezzi(t,fn){ legMezzoTasks(ord(t.oid),t.leg==="C"?"A":t.leg).forEach(x=>{x.mezzi=fn(x.mezzi); x.manual=true;}); }
/* micro-task: i task di una tratta sono in sequenza; spostarne uno fa scorrere i successivi */
function modificaOrario(t,inizio,ore){
  const dopo=legTasks(ord(t.oid),t.leg).filter(x=>x!==t&&x.inizio>=t.inizio);
  const fine=addH(inizio,ore), d=fine-t.fine;
  t.inizio=inizio; t.fine=fine; t.manual=true;
  dopo.forEach(x=>{x.inizio=new Date(+x.inizio+d); x.fine=new Date(+x.fine+d); x.manual=true;});
}
function aggiungiTask(o,leg,tipo){
  const ts=legTasks(o,leg), last=ts.at(-1), inizio=last?last.fine:new Date(o.consegna);
  const ore=tipo==="PERNOTTAMENTO"?Math.max(1,(addH(sod(addD(inizio,1)),7.5)-inizio)/H):1;
  const t={id:`${o.id}-t${++TID}`,oid:o.id,tipo,leg,inizio,fine:addH(inizio,ore),persone:last?.persone||1,why:"Aggiunto a mano dall'operatore",
    risorse:[...(last?.risorse||[])],mezzi:TIPI[tipo].mezzo&&leg!=="C"&&leg!=="R"?[...legMezzi(o,leg)]:[],manual:true};
  if(tipo==="ALTRO") t.label="Attività personalizzata";
  o.tasks.push(t); return t;
}
function spostaTask(t,dir){
  const ts=legTasks(ord(t.oid),t.leg), i=ts.indexOf(t), j=i+dir; if(j<0||j>=ts.length) return;
  const [a,b]=i<j?[t,ts[j]]:[ts[j],t], da=a.fine-a.inizio, db=b.fine-b.inizio, s0=a.inizio;
  b.inizio=s0; b.fine=new Date(+s0+db); a.inizio=b.fine; a.fine=new Date(+a.inizio+da); a.manual=b.manual=true;
}
const manuali=(o,legs)=>o.tasks.filter(t=>t.manual&&legs.includes(t.leg)).length;
/* ripristino: rigenera le tratte dalla proposta (template + regole) e riassegna le risorse */
async function ripristina(o,legs,chiedi=true){
  const n=manuali(o,legs);
  if(chiedi&&n&&!await UI.conferma({titolo:"Ripartire dalla proposta?",testo:`${n} micro-task modificati a mano in questa parte del piano andranno persi.`,ok:"Ripristina",pericolo:true})) return false;
  const nuovi=generaTasks(o);
  o.tasks=o.tasks.filter(t=>!legs.includes(t.leg)).concat(nuovi.filter(t=>legs.includes(t.leg)));
  proponi(o,legs,true);
  return true;
}

const CAMPI=[["numero","Numero offerta"],["resp","Responsabile offerta"],["cliente","Cliente"],["evento","Evento"],["location","Location"],["km","Distanza dal magazzino (km)","number"],
  ["zona","Zona ZTL citata"],["servizio","Servizio"],["consegna","Consegna","datetime-local"],["fine","Ritiro","datetime-local"],["referente","Referente in loco"],["nota","Note operative","text",true]];
const OBBLIGATORI=["numero","cliente","location","consegna","fine"];
const valoreCampo=k=>{const b=ing.draft||ing.seed; return b?String(b[k]??""):String(DEMO.campi[k][0]??"");};
/* servizi: estratti + aggiunti a mano; persone e mezzi indicati = il massimo fra le righe */
const tuttiServizi=()=>[...DEMO.servizi,...ing.extraServizi];
const paxOfferta=()=>Math.max(0,...tuttiServizi().map(s=>s.pax||0))||null, mezziOfferta=()=>Math.max(0,...tuttiServizi().map(s=>s.mezzi||0))||null;
const TIPI_SERVIZIO=["Trasporto consegna","Trasporto ritiro","Allestimento","Disallestimento","Facchinaggio","Altro servizio"];
const daVerificare=()=>CAMPI.map(c=>c[0]).filter(k=>DEMO.campi[k][1]<85&&!ing.ok.has(k));

function ingestRender(){
  let body=UI.binario(STEPS,ing.step,"ing-goto"), foot="";
  $("ingest").classList.toggle("wide",ing.step>=2);
  $("ingBody").classList.toggle("split",ing.step===2);
  if(ing.step===0){
    body+=`<label class="drop" id="drop" for="pdf">${icon("file",28)}<strong>Trascina qui il PDF dell'offerta</strong><span class="small muted">oppure clicca per sceglierlo dal computer</span>
      <input id="pdf" type="file" accept="application/pdf" class="sr"></label>
      ${OFFERTE.length?`<div><div class="eyebrow" style="margin-bottom:8px">Offerte già estratte con LlamaExtract</div><div class="offlist">${OFFERTE.map(o=>`<button type="button" class="offitem" data-act="ing-offer" data-id="${o.id}">
        <span class="mono small">${esc(o.numero)}</span><strong>${esc(o.cliente)}</strong><span class="tiny muted">consegna ${o.consegna?dm(new Date(o.consegna)):"—"} · ${o.righe.length} articoli${state.ordini.some(x=>x.numero===o.numero)?" · già nel piano":""}</span></button>`).join("")}</div></div>`
      :`<p class="small muted">Nessuna estrazione trovata in assets/offerte: esegui Estrazione/estrai.py e converti.py.</p>`}`;
    foot=`<span class="grow small muted">Estrazione in region EU (LlamaCloud), nessun dato fuori dall'UE.</span><button class="btn" data-act="close-ingest">Annulla</button>`;
  } else if(ing.step===1){
    body+=`<p class="small">Lettura di <span class="mono">${esc(ing.file)}</span>…</p><div class="progress"><b id="pbar"></b></div><p class="small muted" id="pmsg">Intestazione e cliente</p>`;
    foot=`<button class="btn" disabled>Estrazione in corso…</button>`;
  } else if(ing.step===2){
    body+=stepDati();
    const n=daVerificare().length;
    foot=`<span class="grow small muted" id="ingHint">${n?`${n} campi da verificare: confermali con ✓ o correggili.`:"Tutti i campi sono verificati."}</span>
      <button class="btn" data-act="ing-back">Indietro</button><button class="btn btn-primary" data-act="ing-next">Avanti: piano →</button>`;
  } else if(ing.step===3){
    body+=`<div class="wiz-scroll"><p class="small muted">Il sistema ha generato i micro-task e proposto squadre e mezzi. Controlla, correggi, poi passa al riepilogo.</p><div class="plan" id="ingPrev"></div></div>`;
    foot=`<button class="btn" data-act="ing-goto" data-v="2">← Dati offerta</button><span class="grow"></span><button class="btn btn-primary" data-act="ing-next">Avanti: riepilogo →</button>`;
  } else {
    body+=`<div class="wiz-scroll">${riepilogoHtml()}</div>`;
    foot=`<button class="btn" data-act="ing-goto" data-v="3">← Piano</button><span class="grow"></span><button class="btn btn-primary" data-act="ing-confirm">Crea ordine e pianifica</button>`;
  }
  $("ingBody").innerHTML=body; $("ingFoot").innerHTML=foot;
  if(ing.step===1) ingestProgress();
  if(ing.step===2) renderPdf();
  if(ing.step===3) ingestPreview();
}

function stepDati(){
  const src=k=>DEMO.campi[k][2]?`<span class="src" data-src="${k}">pag. ${DEMO.campi[k][2][0].p}</span>`:`<span class="src">${k==="km"?"stimato dalla città, non dal PDF":DEMO.campi[k][0]?"non localizzato":"non presente nel PDF"}</span>`;
  const f=([k,l,type="text",full=false])=>{const v=valoreCampo(k), c=DEMO.campi[k][1], low=c<85, ok=ing.ok.has(k);
    const input=k==="zona"?`<select id="f-${k}"><option value="">Nessuna</option>${ZONE.map(z=>`<option${z.nome===v?" selected":""}>${z.nome}</option>`).join("")}</select>`
      :k==="servizio"?`<select id="f-${k}">${SERVIZI_ING.map(([s,l])=>`<option value="${s}"${v===s?" selected":""}>${l}</option>`).join("")}</select>`
      :k==="nota"?`<textarea id="f-${k}">${esc(v)}</textarea>`:`<input id="f-${k}" type="${type}" value="${esc(v)}">`;
    return `<div class="field${low&&!ok?" low":""}${ok?" verified":""}${full?" full":""}" data-cite="${k}"><label class="fl" for="f-${k}">${l}${OBBLIGATORI.includes(k)?" *":""}</label>${input}
      <div class="conf"><span class="chip ${confCls(c)}">${c}%</span>${low?(ok?'<span class="chip ok">verificato</span>':`<button type="button" class="btn btn-sm" data-act="ing-ok" data-k="${k}">✓ Verificato</button>`):""}<span class="grow"></span>${src(k)}</div></div>`;};
  const base=ing.draft||ing.seed, q=new Map((base?.righe||[]).map(r=>[r[0],r[1]]));
  return `<div class="rev">
    <section class="pdfpane" aria-label="PDF originale">
      <div class="pdfbar">${icon("file",15)}<span class="mono small grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ing.file)}</span><span class="tiny muted" id="pdfInfo"></span></div>
      <div class="pdfview" id="pdfView"><div class="empty">Caricamento del PDF…</div></div>
    </section>
    <div class="revform">
      <p class="small muted">Controlla i dati letti dal PDF. Passa su un campo per vedere da dove è stato preso; clicca un riquadro nel PDF per andare al campo. I campi sotto 85% di confidenza vanno confermati con ✓ o corretti.</p>
      ${DEMO.avvisi.length?`<div class="why"><strong>Segnalazioni dell'estrazione</strong><ul class="avv">${DEMO.avvisi.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`:""}
      <div class="fgrid">${CAMPI.map(f).join("")}</div>
      ${UI.sezione({titolo:"Articoli estratti",corpo:STANDBY_VOL+`<div class="card" style="margin-top:8px">${UI.tabella({colonne:[{t:"Codice",mono:true},{t:"Descrizione"},{t:"Q.tà",num:true},{t:"Conf."}],righe:[
        ...DEMO.righe.map(([c,qq,cf,txt,alt],i)=>({attr:`data-cite="r${i}"`,celle:[esc(c),
          esc(ART[c]?.desc||txt)+(ART[c]?.stima?" "+UI.stato("volume stimato","","Volume e peso stimati dalla descrizione: articolo non ancora in anagrafica"):ART[c]?"":" "+UI.stato("Da censire","warn"))+(alt?" "+UI.stato("Alternativa","info","Riga Alt.: esclusa dal piano finché non metti una quantità"):""),
          `<label class="sr" for="q-${i}">Quantità ${esc(c)}</label><input id="q-${i}" type="number" min="0" value="${q.has(c)?q.get(c):base?0:alt?0:qq}" style="width:84px;text-align:right" data-cod="${esc(c)}">`,
          UI.stato(cf+"%",confCls(cf))]})),
        ...ing.extraRighe.map(r=>({cls:"manual-row",celle:[esc(r.cod),esc(r.desc)+" "+UI.stato("aggiunto a mano","warn"),
          `<label class="sr" for="q-${r.cod}">Quantità ${esc(r.desc)}</label><input id="q-${r.cod}" type="number" min="0" value="${q.has(r.cod)?q.get(r.cod):r.q}" style="width:84px;text-align:right" data-cod="${esc(r.cod)}">`,
          `<button type="button" class="icon-btn" style="width:28px;height:28px" data-act="ing-rm-riga" data-cod="${esc(r.cod)}" aria-label="Togli ${esc(r.desc)}">${icon("x",13)}</button>`]})),
        {cls:"add-row",celle:[{span:2,html:`<label class="sr" for="na-desc">Descrizione nuovo articolo</label><input id="na-desc" placeholder="Articolo non letto dal PDF: descrizione…">`},
          `<label class="sr" for="na-q">Quantità nuovo articolo</label><input id="na-q" type="number" min="1" value="1" style="width:84px;text-align:right">`,
          `<button type="button" class="btn btn-sm" data-act="ing-add-riga">+ Aggiungi</button>`]}]})}</div>`})}
      ${UI.sezione({titolo:"Servizi logistici",corpo:`<div class="card">${UI.tabella({testa:false,colonne:[{},{num:true},{},{}],righe:[
        ...DEMO.servizi.map((sv,i)=>({attr:`data-cite="s${i}"`,celle:[esc(sv.desc),num(sv.q),[sv.pax&&UI.stato(sv.pax+" persone","info"),sv.mezzi&&UI.stato(sv.mezzi+" mezzi","info")].filter(Boolean).join(" "),""]})),
        ...ing.extraServizi.map((sv,i)=>({cls:"manual-row",celle:[esc(sv.desc)+" "+UI.stato("aggiunto a mano","warn"),1,[sv.pax&&UI.stato(sv.pax+" persone","info"),sv.mezzi&&UI.stato(sv.mezzi+" mezzi","info")].filter(Boolean).join(" "),
          `<button type="button" class="icon-btn" style="width:28px;height:28px" data-act="ing-rm-serv" data-i="${i}" aria-label="Togli ${esc(sv.desc)}">${icon("x",13)}</button>`]})),
        ...(tuttiServizi().length?[]:[[{span:4,cls:"muted small",html:"Il PDF non riporta righe di logistica."}]]),
        {cls:"add-row",celle:[UI.selezione({id:"ns-tipo",etichetta:"Tipo di servizio",opzioni:TIPI_SERVIZIO.map(t=>[t,t])}),
          `<label class="sr" for="ns-pax">Persone</label><input id="ns-pax" type="number" min="0" placeholder="persone" style="width:90px">`,
          `<label class="sr" for="ns-mz">Mezzi</label><input id="ns-mz" type="number" min="0" placeholder="mezzi" style="width:80px">`,
          `<button type="button" class="btn btn-sm" data-act="ing-add-serv">+ Aggiungi</button>`]}]})}</div>
        ${paxOfferta()||mezziOfferta()?`<p class="tiny muted" style="margin-top:6px">${paxOfferta()?`La squadra del piano userà ${paxOfferta()} persone. `:""}${mezziOfferta()?`Il piano proporrà ${mezziOfferta()} mezzi.`:""}</p>`:""}`})}
    </div></div>`;
}

/* passaggio tra i passi, con validazione */
async function ingestAvanti(){
  if(ing.step===2){
    const seed=ingestLeggi(), mancano=OBBLIGATORI.filter(k=>!String(seed[k]??"").trim());
    if(mancano.length){ focusCampo(mancano[0]); return toast(`Completa i campi obbligatori: ${mancano.map(k=>CAMPI.find(c=>c[0]===k)[1].toLowerCase()).join(", ")}.`,"warn"); }
    if(new Date(seed.fine)<=new Date(seed.consegna)){ focusCampo("fine"); return toast("Il ritiro deve essere successivo alla consegna.","warn"); }
    const dv=daVerificare(); if(dv.length){ focusCampo(dv[0]); return toast(`Conferma o correggi i campi evidenziati (${dv.length}).`,"warn"); }
    seed.dopo=ing.seed?.dopo||null;
    const cambiato=JSON.stringify(seed)!==JSON.stringify(ing.seed);
    if(cambiato&&ing.plan&&ing.dirty&&!await UI.conferma({titolo:"Ricalcolare il piano?",testo:"Hai cambiato i dati dell'offerta: le modifiche fatte al piano andranno perse.",ok:"Ricalcola"})) return;
    ing.seed=seed; ing.draft=null; if(cambiato||!ing.plan) costruisciPiano();
  }
  ing.step++; ingestRender(); $("ingBody").scrollTop=0;
}
function focusCampo(k){ const el=$("f-"+k); if(!el) return; el.focus(); citeOn(k,true); }
function ingestLeggi(){
  const v=k=>$("f-"+k).value.trim();
  return {numero:v("numero"),resp:v("resp"),cliente:v("cliente"),evento:v("evento"),location:v("location"),km:Math.max(1,+v("km")||1),
    zona:v("zona")||null,referente:v("referente"),servizio:v("servizio"),consegna:v("consegna"),fine:v("fine"),nota:v("nota"),
    pax:paxOfferta(),mezzi:mezziOfferta(),righe:[...document.querySelectorAll("#ingBody [data-cod]")].map(i=>[i.dataset.cod,+i.value||0]).filter(r=>r[1]>0)};
}
function costruisciPiano(){ ing.plan=nuovoOrdine(ing.seed,"tmp"); proponi(ing.plan,undefined,true); ing.dirty=false; }

/* ---------- riepilogo ---------- */
const CRITICI=/tassativ|entro le|piano|ingresso|parchegg|scaric|accesso|montacaric|ztl|area [bc]|permess|da definire|ascensor|scale|cortile|via |orari/i;
function riepilogoHtml(){
  const o=ing.plan, s=ing.seed, e=o.eff, z=ZONA[o.zona];
  state.ordini.push(o); const av=calcolaAvvisi(); state.ordini.pop();
  const warns=av.list.filter(w=>w.oid===o.id||w.keys.some(k=>k.startsWith(o.id+"|")));
  const ts=[...o.tasks].sort((a,b)=>a.inizio-b.inizio);
  /* persone: periodi di impegno per tratta */
  const per=new Map();
  ts.forEach(t=>t.risorse.forEach(n=>{ if(!per.has(n)) per.set(n,{legs:new Map(),pern:false}); const p=per.get(n);
    const g=p.legs.get(t.leg)||{s:t.inizio,e:t.fine}; g.s=new Date(Math.min(g.s,t.inizio)); g.e=new Date(Math.max(g.e,t.fine)); p.legs.set(t.leg,g); if(t.tipo==="PERNOTTAMENTO") p.pern=true; }));
  const conflittoDi=n=>warns.filter(w=>(w.cat==="Sovrapposizione"||w.cat==="Assenza"||w.cat==="Turni")&&w.titolo.startsWith(n));
  const persone=[...per].map(([n,p])=>{const c=conflittoDi(n); return [`<strong>${esc(n)}</strong><div class="tiny muted">${esc((ADD[n]?.ruoli||[]).join("/"))}${ADD[n]?.patenti.length?" · pat. "+ADD[n].patenti.join("/"):""}</div>`,
    [...p.legs].map(([l,g])=>`<div class="small"><span class="muted">${LEG[l]}:</span> <span class="mono">${GG[g.s.getDay()]} ${dm(g.s)} ${hm(g.s)}–${dkey(g.s)===dkey(g.e)?"":dm(g.e)+" "}${hm(g.e)}</span></div>`).join(""),
    (p.pern?UI.stato("pernotta","info")+" ":"")+(c.length?c.map(w=>UI.stato(w.cat.toLowerCase(),sevCls(w.sev),w.dettaglio)).join(" "):UI.stato("libero","ok"))];});
  /* mezzi */
  const mz=["A","B"].flatMap(leg=>legMezzi(o,leg).map(n=>[leg,n]));
  const mezzi=[...new Set(mz.map(x=>x[1]))].map(n=>{const m=MZ[n], legs=mz.filter(x=>x[1]===n).map(x=>LEG[x[0]]), v=z&&violaZTL(m,z);
    const busy=warns.some(w=>w.cat==="Sovrapposizione"&&w.titolo.startsWith(n));
    return [`<strong>${esc(n)}</strong><div class="tiny muted">${esc(m.tipo)} · ${m.vol} m³ · ${num(m.portata,0)} kg</div>`,`<span class="small">${legs.join(", ")}</span>`,
      `<span class="small">pat. ${m.patente} · Euro ${m.euro} · ${num(m.massa)} t · ${num(m.lung)} m</span>`,
      [v&&UI.stato("non ammesso in "+z.nome,"warn",v.join("; ")),busy&&UI.stato("già impegnato","err"),!v&&!busy&&UI.stato("ok","ok")].filter(Boolean).join(" ")];});
  /* percorso */
  const and=legTasks(o,"A"), rit=legTasks(o,"B"), vA=and.find(t=>t.tipo==="VIAGGIO"), vB=rit.find(t=>t.tipo==="VIAGGIO");
  const dest=s.location, enc=encodeURIComponent, mapsUrl=`https://www.google.com/maps/dir/?api=1&origin=${enc(MAGAZZINO)}&destination=${enc(dest)}&travelmode=driving`;
  const frame=`https://www.google.com/maps?saddr=${enc(MAGAZZINO)}&daddr=${enc(dest)}&output=embed`;
  /* criticità di percorso e accesso */
  const crit=[];
  if(z){ crit.push(["warn",`Location in ZTL «${z.nome}» (${z.citta})`,`Fascia ${z.fascia}. Permesso: ${z.permesso}. Fonte: ${z.fonte}.`]);
    mz.forEach(([l,n])=>{const v=violaZTL(MZ[n],z); if(v) crit.push(["err",`${n} non ammesso in ${z.nome}`,v.join("; ")+` (${LEG[l].toLowerCase()})`]);}); }
  mz.filter(([,n])=>MZ[n].massa>7.5||MZ[n].lung>8).forEach(([l,n])=>crit.push(["warn",`Mezzo pesante: ${n}`,`${num(MZ[n].massa)} t, ${num(MZ[n].lung)} m: verifica accesso e manovra alla location.`]));
  if(e.tViaggio>=2) crit.push(["info",`Viaggio lungo: ${dur(e.tViaggio)} per tratta`,`${o.km} km dal magazzino.${o.tasks.some(t=>t.tipo==="PERNOTTAMENTO")?" Previsto pernottamento.":""}`]);
  (s.nota||"").split(/(?<=[.;])\s+/).filter(x=>CRITICI.test(x)).forEach(x=>crit.push(["info","Dall'offerta",x]));
  warns.filter(w=>w.cat==="Orari").forEach(w=>crit.push([sevCls(w.sev),w.titolo,w.dettaglio]));
  if(/da definire/i.test(s.nota||"")||DEMO.campi.consegna[1]<=50) crit.push(["warn","Orario da confermare","L'offerta non indica un orario preciso: il piano usa un orario di default."]);
  const residui=warns.filter(w=>!["Orari","Permesso"].includes(w.cat));
  return `<div class="sum-head"><div class="grow"><div class="eyebrow">${esc(s.numero)} · ${esc(s.resp)}</div><h3 class="sum-title">${esc(s.cliente)}</h3>
      <div class="small muted">${esc(s.evento||"")}${s.evento?" · ":""}${SRV[s.servizio]} · ${esc(s.location)}</div></div>
      <div class="sum-kpi">${UI.kpiRiga([[per.size,"persone"],[new Set(mz.map(x=>x[1])).size,"mezzi"],[o.tasks.length,"micro-task"],[residui.length,"avvisi"]])}</div></div>
    <div class="sum-grid">
      ${UI.pannello({titolo:"Persone coinvolte",corpo:UI.tabella({testa:false,colonne:[{},{},{}],righe:persone,vuoto:"Nessuna persona assegnata"})})}
      ${UI.pannello({titolo:"Mezzi",corpo:UI.tabella({testa:false,colonne:[{},{},{},{}],righe:mezzi,vuoto:o.servizio==="ritiro"?"Nessun mezzo: ritira il cliente.":"Nessun mezzo assegnato"})})}
      ${o.servizio==="ritiro"?"":UI.pannello({titolo:"Percorso",azioni:`<a class="btn btn-sm" href="${mapsUrl}" target="_blank" rel="noopener">Apri in Google Maps ↗</a>`,corpo:`<div class="card-body">${UI.dettagli([
          ["Da",esc(MAGAZZINO)],["A",esc(dest)],["Distanza",`${o.km} km <span class="muted">· ${dur(e.tViaggio)} stimate</span>`],
          vA&&["Andata",`<span class="mono">${GG[vA.inizio.getDay()]} ${dm(vA.inizio)} partenza ${hm(vA.inizio)} → arrivo ${hm(vA.fine)}</span>`],
          vB&&["Ritiro",`<span class="mono">${GG[vB.inizio.getDay()]} ${dm(vB.inizio)} partenza ${hm(vB.inizio)} → arrivo ${hm(vB.fine)}</span>`]])}
          <div class="map" data-src="${esc(frame)}"><button type="button" class="btn btn-sm" data-act="ing-map">Mostra la mappa</button><span class="tiny muted">Carica Google Maps: l'indirizzo della location viene inviato a Google.</span></div></div>`})}
      ${UI.pannello({titolo:"Criticità di percorso e accesso",corpo:`<div class="alerts">${crit.map(([c,t,d])=>UI.voce(c,t,d)).join("")||'<div class="empty">Nessuna criticità rilevata dai dati disponibili.</div>'}
        ${UI.voce("","Cantieri, chiusure, eventi in zona","In arrivo: ricerca automatica sul percorso nei giorni di consegna e ritiro (documento tecnico §9).")}</div>`})}
    </div>
    ${residui.length?UI.pannello({titolo:"Avvisi sul piano",azioni:'<span class="small muted">si possono risolvere anche dopo, dal Gantt</span>',corpo:`<div class="alerts">${UI.avvisi(residui,{clic:false,azione:false})}</div>`}):""}`;
}
const normFile=s=>s.normalize("NFD").replace(/[^a-z0-9]/gi,"").toLowerCase();
async function ingestFile(f){
  const o=OFFERTE.find(x=>normFile(x.file)===normFile(f.name)) || OFFERTE.find(x=>normFile(f.name).includes(normFile(x.numero.split(" ")[0])));
  if(!o) return toast("Questa offerta non è ancora stata estratta: aggiungila a «PDF Offerte» e lancia estrai.py e converti.py.","warn");
  ingestStart(o,f.name,new Uint8Array(await f.arrayBuffer()));
}
async function ingestOfferta(id){
  const o=OFFERTE.find(x=>x.id===id);
  try{ if(!window.OFFERTE_PDF?.[id]) await script(`${window.OFFERTE_DIR}/${id}.js`); }
  catch{ return toast("PDF non trovato in assets/offerte.","warn"); }
  ingestStart(o,o.file,Uint8Array.from(atob(window.OFFERTE_PDF[id]),c=>c.charCodeAt(0)));
}
function ingestStart(o,name,data){DEMO=o; ing.file=name; ing.pdf=data; ing.plan=null; ing.seed=null; ing.draft=null; ing.extraRighe=[]; ing.extraServizi=[]; ing.ok=new Set(); ing.dirty=false; ing.step=1; ingestRender();}
function ingestProgress(){
  let p=0; const msgs=["Intestazione e cliente","Righe articoli","Date, orari e location","Completato"];
  const fast=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const it=setInterval(()=>{
    p=Math.min(100,p+(fast?100:20+Math.random()*16));
    if(!$("pbar")) return clearInterval(it);
    $("pbar").style.width=p+"%"; $("pmsg").textContent=msgs[Math.min(3,Math.floor(p/34))];
    if(p>=100){clearInterval(it); setTimeout(()=>{ing.step=2; ingestRender();},250);}
  },200);
}

/* ---------- PDF originale con le citazioni evidenziate ---------- */
let pdfjsP=null;
/* pdf.js + worker caricati come script: funziona anche aprendo il file da disco (file://), dove i Web Worker cross-origin sono bloccati */
const script=src=>new Promise((ok,ko)=>{const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("script non raggiungibile: "+src)); document.head.append(s);});
const loadPdfjs=()=>pdfjsP??=(async()=>{
  if(!window.pdfjsLib) await script(PDFJS+"pdf.min.js");
  if(!window.pdfjsWorker) await script(PDFJS+"pdf.worker.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  return pdfjsLib;

async function renderPdf(){
  const view=$("pdfView"); if(!view||!ing.pdf) return;
  try{
    const lib=await loadPdfjs(), doc=await lib.getDocument({data:ing.pdf.slice()}).promise;
    if(!$("pdfView")) return;
    view.innerHTML="";
    const cites=citazioni();
    for(let n=1;n<=Math.min(doc.numPages,12);n++){
      const page=await doc.getPage(n), w=Math.max(280,view.clientWidth-24), vp=page.getViewport({scale:w/page.getViewport({scale:1}).width});
      const wrap=document.createElement("div"), cv=document.createElement("canvas"), dpr=window.devicePixelRatio||1;
      wrap.className="pdfpage"; wrap.style.width=vp.width+"px"; wrap.style.height=vp.height+"px";
      cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr); cv.style.width=vp.width+"px"; cv.style.height=vp.height+"px";
      wrap.append(cv); view.append(wrap);
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
      cites.forEach(c=>c.boxes.filter(b=>b.p===n).forEach(b=>{
        const s=vp.width/b.pw, hl=document.createElement("button"); hl.type="button";
        hl.className="hl"+(c.conf<85?" low":""); hl.dataset.hl=c.k; hl.title=`Fonte del campo — pag. ${n}`;
        Object.assign(hl.style,{left:b.x*s-2+"px",top:b.y*s-2+"px",width:b.w*s+4+"px",height:b.h*s+4+"px"});
        wrap.append(hl);
      }));
    }
    $("pdfInfo").textContent=`${cites.length} campi con fonte · ${doc.numPages} pag.`;
  }catch(err){
    view.innerHTML=`<div class="empty">Impossibile mostrare il PDF (${esc(err.message||err)}).</div>`;
  }
}

function glVai(item,evidenzia){ const sc=document.querySelector(".gl-scroll"); if(!item||!sc) return;
  const gh=item.closest(".gl-group")?.querySelector(".gl-gh")?.offsetHeight||0;
  sc.scrollTo({top:sc.scrollTop+item.getBoundingClientRect().top-sc.getBoundingClientRect().top-gh,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  if(evidenzia){ document.querySelectorAll(".gl-item.hot").forEach(x=>x.classList.remove("hot")); item.classList.add("hot"); setTimeout(()=>item.classList.remove("hot"),1600); } }
function glCursore(){ const sc=document.querySelector(".gl-scroll"), gt=document.querySelector(".gt"); if(!sc||!gt) return;
  const items=[...sc.querySelectorAll(".gl-item[data-t]")], top=sc.getBoundingClientRect().top+30, primo=items.find(x=>x.getBoundingClientRect().bottom>top);
  const ultimo=[...items].reverse().find(x=>x.getBoundingClientRect().top<sc.getBoundingClientRect().bottom)||primo; if(!primo) return;
  const d0=+sod(new Date(+primo.dataset.t)), p=t=>Math.max(0,Math.min(100,((t-d0)/H-5)/18*100));
  const a=p(+primo.dataset.t), b=Math.max(a+.8,p(+ultimo.dataset.t)), c=gt.querySelector(".gt-cur"); c.style.left=a+"%"; c.style.width=(b-a)+"%";
  gt.querySelectorAll(".gt-bar").forEach(x=>x.classList.toggle("vis",items.some(i=>i.dataset.k===x.dataset.k&&i.getBoundingClientRect().bottom>top&&i.getBoundingClientRect().top<sc.getBoundingClientRect().bottom)));
}

function hintShow(el){
  const k=el.dataset.hint, testo=AIUTI[k]; if(!testo) return;
  const tip=$("hintTip"); tip.innerHTML=testo; tip.hidden=false;
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=r.left+r.width/2-tw/2, y=r.top-th-8;
  if(y<8) y=r.bottom+8;
  tip.style.left=Math.max(8,Math.min(window.innerWidth-tw-8,x))+"px";
  tip.style.top=y+"px";
}
const hintHide=()=>{const t=$("hintTip"); if(t) t.hidden=true;};
document.addEventListener("mouseover",ev=>{const h=ev.target.closest?.("[data-hint]"); if(h) hintShow(h);});
document.addEventListener("mouseout",ev=>{if(ev.target.closest?.("[data-hint]")) hintHide();});
document.addEventListener("focusin",ev=>{const h=ev.target.closest?.("[data-hint]"); if(h) hintShow(h);});
document.addEventListener("focusout",ev=>{if(ev.target.closest?.("[data-hint]")) hintHide();});
document.addEventListener("scroll",()=>hintHide(),true);

/* ============================================================
   REGISTRO MODIFICHE (annulla / Ctrl+Z)
   Ogni modifica al piano diventa una voce con la copia degli ordini toccati PRIMA della modifica.
   Annullare una voce riporta quegli ordini allo stato precedente e annulla anche tutte le voci successive
   correlate, cioè che toccano gli stessi ordini (a catena). Le voci su altri ordini restano valide.
   ponytail: copia intera degli ordini toccati, ~qualche KB a voce; delta per campo se il registro diventa persistente.
   ============================================================ */
const REG={voci:[],base:new Map(),n:0};
const clonaOrd=o=>structuredClone(o);
const firma=o=>JSON.stringify(o);
function registroInizia(){ REG.base=new Map(state.ordini.map(o=>[o.id,clonaOrd(o)])); }
/* confronta il piano con l'ultima copia: se è cambiato qualcosa, crea una voce. Chiamata da dopoModifica e, come rete, da render */
function registra(msg){
  if(REG.inAnnulla) return;
  const ora=new Map(state.ordini.map(o=>[o.id,o])), ids=new Set([...REG.base.keys(),...ora.keys()]), prima={};
  for(const id of ids){ const a=REG.base.get(id), b=ora.get(id); if(!a||!b||firma(a)!==firma(b)) prima[id]=a||null; }
  const oids=Object.keys(prima); if(!oids.length) return;
  const nomi=oids.map(id=>(ora.get(id)||prima[id])?.numero).filter(Boolean);
  REG.voci.push({n:++REG.n,quando:new Date(),msg:msg||"Modifica al piano",oids,nomi,prima,annullata:false});
  oids.forEach(id=>ora.has(id)?REG.base.set(id,clonaOrd(ora.get(id))):REG.base.delete(id));
}
/* voci che verrebbero annullate insieme alla voce n: lei + le successive che toccano (a catena) gli stessi ordini */
function catena(n){
  const vive=REG.voci.filter(v=>!v.annullata), i=vive.findIndex(v=>v.n===n); if(i<0) return [];
  const tocca=new Set(vive[i].oids), out=[vive[i]];
  for(const v of vive.slice(i+1)) if(v.oids.some(id=>tocca.has(id))){ out.push(v); v.oids.forEach(id=>tocca.add(id)); }
  return out;
}
function annullaVoce(n){
  const c=catena(n); if(!c.length) return;
  const ripristino={}; c.forEach(v=>v.oids.forEach(id=>{ if(!(id in ripristino)) ripristino[id]=v.prima[id]; }));   // la copia più vecchia vince
  for(const [id,snap] of Object.entries(ripristino)){
    const i=state.ordini.findIndex(o=>o.id===id);
    if(snap){ const o=clonaOrd(snap); i>=0?state.ordini[i]=o:state.ordini.push(o); REG.base.set(id,clonaOrd(snap)); }
    else { if(i>=0) state.ordini.splice(i,1); REG.base.delete(id); }   // ordine creato dalla voce annullata: si toglie
  }
  c.forEach(v=>{ v.annullata=true; v.annullataDa=n; });
  if(state.drawer&&!$("drawerBody").querySelector("[data-id]")) closeDrawer();
  REG.inAnnulla=true; try{ render(); if(state.drawer) state.drawer(); } finally{ REG.inAnnulla=false; }
  toast(c.length>1?`Annullate ${c.length} modifiche: «${c[0].msg}» e ${c.length-1} successive correlate.`:`Annullato: «${c[0].msg}».`);
  if($("regDlg")) renderRegistro();
}
async function chiediAnnulla(n){
  const c=catena(n); if(!c.length) return;
  if(c.length>1){
    const ok=await UI.conferma({titolo:`Annullare ${c.length} modifiche?`,ok:"Sì, annulla tutte",pericolo:true,
      testo:`«${c[0].msg}» è seguita da ${c.length-1} modifiche agli stessi ordini, che verranno annullate anche loro: ${c.slice(1).map(v=>`«${v.msg}» (${v.nomi.join(", ")})`).join("; ")}.`});
    if(!ok) return;
  }
  annullaVoce(n);
}
const ultimaViva=oid=>[...REG.voci].reverse().find(v=>!v.annullata&&(!oid||v.oids.includes(oid)));
/* registro: generale (tutte le voci) o filtrato su un ordine */
function renderRegistro(){
  const dl=$("regDlg"); if(!dl) return; const oid=dl.dataset.oid||"";
  const voci=[...REG.voci].reverse().filter(v=>!oid||v.oids.includes(oid));
  dl.querySelector(".dlg-body").innerHTML=voci.length?`<ol class="reg">${voci.map(v=>`<li class="${v.annullata?"annullata":""}">
      <span class="mono small">${hm(v.quando)}</span>
      <div class="grow"><div>${esc(v.msg)}</div><div class="small muted">${esc(v.nomi.join(", "))}${v.annullata?` · annullata${v.annullataDa!==v.n?" insieme a una modifica precedente":""}`:""}</div></div>
      ${v.annullata?"":`<button class="btn btn-sm" data-act="reg-annulla" data-n="${v.n}">Annulla${catena(v.n).length>1?` (+${catena(v.n).length-1})`:""}</button>`}
    </li>`).join("")}</ol>`:'<div class="empty">Nessuna modifica in questa sessione.</div>';
}
function apriRegistro(oid=""){
  $("regDlg")?.remove();
  const d=document.createElement("dialog"); d.className="form"; d.id="regDlg"; d.dataset.oid=oid;
  const o=oid&&ord(oid);
  d.innerHTML=`<div class="dlg-head"><h2 class="grow">Registro modifiche${o?` · ${esc(o.numero)}`:""}</h2></div><div class="dlg-body"></div>
    <div class="dlg-foot"><span class="small muted grow">Annullando una modifica si annullano anche le successive sugli stessi ordini. Ctrl+Z annulla l'ultima.</span><button class="btn" data-act="reg-close">Chiudi</button></div>`;
  document.body.append(d); d.addEventListener("close",()=>d.remove()); renderRegistro(); showDlg(d);
}
document.addEventListener("keydown",ev=>{
  if(!(ev.ctrlKey||ev.metaKey)||ev.key.toLowerCase()!=="z"||ev.shiftKey||ev.target.matches("input,select,textarea")||document.querySelector("dialog[open]:not(#regDlg)")) return;
  const v=ultimaViva(); if(!v) return; ev.preventDefault(); annullaVoce(v.n);
});
registroInizia();
render();
</script>
