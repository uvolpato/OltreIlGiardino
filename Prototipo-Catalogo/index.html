<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Oltre Il Giardino · Catalogo prodotti</title>
<link rel="icon" href="assets/logo-oig.png">
<style>
:root{
  --bg:oklch(97.5% 0.005 145);
  --surface:oklch(100% 0 0);
  --sunken:oklch(96% 0.006 145);
  --fg:oklch(20% 0.015 145);
  --muted:oklch(46% 0.012 145);
  --faint:oklch(62% 0.01 145);
  --border:oklch(91.5% 0.007 145);
  --border-strong:oklch(85% 0.01 145);
  --accent:oklch(52% 0.14 155);
  --accent-ink:oklch(43% 0.12 155);
  --accent-soft:oklch(52% 0.14 155 / .1);
  --on-accent:oklch(99% 0.004 145);
  --hover:oklch(20% 0.015 145 / .045);
  --ok:oklch(46% 0.13 150);
  --warn:oklch(50% 0.13 70);
  --danger:oklch(50% 0.19 27);
  --info:oklch(47% 0.13 250);

  --t-carico:oklch(48% 0.09 255);
  --t-viaggio:oklch(50% 0.09 220);
  --t-consegna:oklch(48% 0.09 190);
  --t-allestimento:oklch(47% 0.12 155);
  --t-disallestimento:oklch(53% 0.12 80);
  --t-ritiro:oklch(51% 0.13 45);
  --t-rientro:oklch(44% 0.04 255);
  --pulse:oklch(78% 0.17 65);
  --t-attesa:oklch(55% 0.03 145);
  --t-pernotta:oklch(42% 0.09 300);
  --t-sopralluogo:oklch(50% 0.1 340);
  --t-altro:oklch(50% 0.02 60);

  --r:8px; --r-lg:12px;
  --font-display:'Iowan Old Style','Charter',Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --lw:256px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{margin:0; line-height:1.2; font-weight:600}
h1{font-family:var(--font-display); font-size:22px; letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13.5px}
p{margin:0}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
[hidden]{display:none!important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.row{display:flex; align-items:center; gap:8px}
.grow{flex:1; min-width:0}
.wrap{flex-wrap:wrap}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
.sidebar{background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{display:flex; align-items:center; gap:12px; padding:18px 18px 16px; border-bottom:1px solid var(--border)}
.brand img{height:30px; width:auto}
.brand strong{display:block; font-family:var(--font-display); font-size:15px}
.brand small{display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.nav{padding:10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto}
.nav button{display:flex; align-items:center; gap:10px; min-height:40px; padding:8px 10px; border:0; border-radius:var(--r); background:none; cursor:pointer; text-align:left; font-size:13.5px; font-weight:500; transition:background 140ms}
.nav button svg{color:var(--muted); flex:none}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.nav button[aria-current="page"] svg{color:var(--accent-ink)}
.nav .count{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:oklch(50% 0.19 27 / .12); color:var(--danger)}
.health{margin:10px; padding:14px; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--sunken); display:grid; gap:8px}
.health .row{justify-content:space-between; font-size:12.5px}
.health b{font-family:var(--font-mono); font-size:13px}
.side-foot{padding:12px 18px 16px; font-size:11px; color:var(--faint); line-height:1.45}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:20; background:oklch(97.5% 0.005 145 / .9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.topbar .title{flex:1 1 240px; min-width:0}
.topbar .title p{font-size:12.5px; color:var(--muted); margin-top:3px}
.datenav{display:flex; align-items:center; gap:4px}
.datenav .label{min-width:210px; text-align:center; font-weight:600; font-size:13.5px}
.datenav .label::first-letter{text-transform:uppercase}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:36px; padding:7px 14px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); cursor:pointer; font-size:13px; font-weight:500; white-space:nowrap; transition:background 140ms, border-color 140ms}
.btn:hover{background:var(--sunken); border-color:var(--border-strong)}
.btn-primary{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--on-accent)}
.btn-primary:hover{background:oklch(38% 0.11 155); border-color:oklch(38% 0.11 155)}
.btn-ghost{border-color:transparent; background:none; color:var(--muted)}
.btn-ghost:hover{color:var(--fg)}
.btn-sm{min-height:30px; padding:4px 10px; font-size:12.5px}
.icon-btn{position:relative; display:inline-grid; place-items:center; width:36px; height:36px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); color:var(--muted); cursor:pointer; transition:background 140ms, color 140ms}
.icon-btn:hover{background:var(--sunken); color:var(--fg)}
.icon-btn .badge{position:absolute; top:-6px; right:-6px; min-width:18px; padding:1px 5px; border-radius:999px; background:var(--danger); color:#fff; font:700 10px/1.4 var(--font-mono)}
.seg{display:inline-flex; padding:3px; gap:2px; border:1px solid var(--border); border-radius:999px; background:var(--surface)}
.seg button{border:0; background:none; padding:5px 12px; min-height:28px; border-radius:999px; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); transition:background 140ms,color 140ms}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--surface)}
input,select,textarea{width:100%; min-height:36px; padding:7px 10px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); font-size:13px; transition:border-color 140ms}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent-soft); border-color:var(--accent)}
textarea{min-height:64px; resize:vertical}
label.fl{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px}

.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; background:var(--hover); color:var(--muted)}
.chip.ok{background:oklch(46% 0.13 150 / .12); color:var(--ok)}
.chip.warn{background:oklch(50% 0.13 70 / .13); color:var(--warn)}
.chip.err{background:oklch(50% 0.19 27 / .11); color:var(--danger)}
.chip.info{background:oklch(47% 0.13 250 / .1); color:var(--info)}
.dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)} .dot.info{background:var(--info)}
.tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600}
.tag i{width:10px; height:10px; border-radius:3px; background:var(--c)}

/* ---------- surfaces ---------- */
.view{padding:24px 28px 56px; display:flex; flex-direction:column; gap:16px; animation:in 220ms var(--ease) both}
@keyframes in{from{opacity:0; transform:translateY(4px)}}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); min-width:0}
.card-head{padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:56px}
.card-body{padding:16px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px}
.kpi .n{font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:-.04em; line-height:1.1}
.kpi .l{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:6px; align-items:center}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11.5px; font-weight:600; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--border); background:var(--sunken); white-space:nowrap; position:sticky; top:0; z-index:1}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer; transition:background 120ms}
tr.click:hover{background:var(--hover)}
.num{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.table-box{overflow:auto}
.tabbar{display:flex; gap:2px; padding:0 12px; border-bottom:1px solid var(--border)}
.tabbar button{border:0; background:none; padding:12px 10px 10px; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500; border-bottom:2px solid transparent; transition:color 140ms}
.tabbar button:hover{color:var(--fg)}
.tabbar button[aria-selected="true"]{color:var(--fg); border-bottom-color:var(--accent)}
.empty{padding:36px 20px; text-align:center; color:var(--muted); font-size:13px}
.meter{width:72px; height:6px; border-radius:999px; background:var(--sunken); overflow:hidden; display:inline-block; vertical-align:middle}
.meter b{display:block; height:100%; background:var(--accent)}
.meter.hi b{background:var(--warn)}

/* ---------- gantt ---------- */
.planner{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
@media (max-width:1240px){.planner{grid-template-columns:minmax(0,1fr)}}
.gscroll{overflow:auto; max-height:calc(100vh - 250px); scrollbar-width:thin}
.gantt{position:relative; width:calc(var(--lw) + var(--w)); min-width:100%}
.g-head,.g-row{display:grid; grid-template-columns:var(--lw) var(--w)}
.g-head{position:sticky; top:0; z-index:8; background:var(--surface)}
.g-corner{position:sticky; left:0; z-index:2; background:var(--sunken); border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:0 14px; display:flex; align-items:center}
.g-scale{position:relative; height:66px; background:var(--sunken); border-bottom:1px solid var(--border)}
.g-scale .mb{position:absolute; top:0; height:22px; display:flex; align-items:center; justify-content:center; overflow:hidden; white-space:nowrap;
  font-size:11px; font-weight:600; letter-spacing:.02em; color:oklch(32% 0.09 var(--h)); background:oklch(91% 0.055 var(--h)); border-right:1px solid var(--surface); box-shadow:inset 0 -1px 0 oklch(80% 0.07 var(--h))}
.g-scale .tk{position:absolute; top:22px; bottom:0; border-left:1px solid var(--border); padding:6px 0 0 6px; font-family:var(--font-mono); font-size:11px; color:var(--muted); white-space:nowrap}
.g-scale .tk b{display:block; font-family:var(--font-sans); font-size:12.5px; color:var(--fg); font-weight:600}
.g-scale .tk.today b{color:var(--accent-ink)}
.g-scale .tk.m1{border-left:2px solid var(--border-strong)}
.g-scale .tk.minor{top:50px; padding-top:0; color:var(--faint); font-size:9.5px; border-left-color:transparent}
.g-overlay{position:absolute; top:66px; bottom:0; left:var(--lw); width:var(--w); pointer-events:none}
.g-overlay i{position:absolute; top:0; bottom:0; border-left:1px solid var(--border)}
.g-overlay i.hr{border-left:1px dashed oklch(91.5% 0.007 145 / .7)}
.zoomer{align-items:center}
.sortsel{width:auto; min-height:30px; padding:3px 8px; font-size:12.5px}
.zoomer button{width:28px; padding:0; font-size:16px; line-height:1}
.zoomer span{min-width:48px; text-align:center; font-size:12px; color:var(--muted)}
.g-overlay i.shade{border:0; background:oklch(20% 0.015 145 / .028)}
.g-overlay i.today{border:0; background:var(--accent-soft)}
.g-now{position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--danger); z-index:3}
.g-now::before{content:''; position:absolute; top:-1px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--danger)}
.g-section{position:sticky; left:0; padding:14px 14px 6px; width:var(--lw)}
.g-row{position:relative}
.g-label{position:sticky; left:0; z-index:4; background:var(--surface); border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 12px 8px 14px; display:flex; align-items:center; gap:8px; min-width:0}
.g-label .t{min-width:0; flex:1}
.g-label .l1{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-label .l2{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-row.child .g-label{padding-left:40px; background:var(--sunken)}
.g-row.child .g-label .l1{font-weight:500}
.g-track{position:relative; border-bottom:1px solid var(--border); min-height:44px}
.g-empty{position:sticky; left:calc(var(--lw) + 16px); display:inline-block; padding:34px 0; font-size:13px; color:var(--muted)}
.g-row.drop .g-track{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent)}
.chev{display:grid; place-items:center; width:24px; height:24px; border:0; border-radius:6px; background:none; color:var(--muted); cursor:pointer; flex:none; transition:transform 160ms var(--ease), background 140ms}
.chev:hover{background:var(--hover); color:var(--fg)}
.chev[aria-expanded="true"]{transform:rotate(90deg)}
.bar{position:absolute; z-index:2; display:flex; align-items:center; padding:0 7px; border:0; border-radius:5px; background:var(--c); color:#fff; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; box-shadow:inset 0 -1px 0 oklch(0% 0 0 / .14); transition:filter 140ms, transform 140ms}
.bar:hover{filter:brightness(1.1); z-index:5}
.bar[draggable="true"]{cursor:grab}
.bar.dragging{opacity:.35}
.bar.slim{padding:0; justify-content:center; border-radius:min(5px,40%)}
/* barra troppo stretta per il testo: tre puntini indicano che c'è un'etichetta (nel tooltip e nel dettaglio) */
.bar .more{display:flex; gap:2px}
.bar .more i{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.9}
.bar.occ{background:repeating-linear-gradient(-45deg,var(--c) 0 5px,oklch(from var(--c) calc(l + .14) c h) 5px 10px)}
.bar.manual::after{content:""; position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background:#fff}
/* bordo di conflitto interno: non invade le barre vicine */
/* conflitto: la barra pulsa lentamente verso il rosso (niente bordi), lo stesso ritmo per tutte */
.bar.is-conflict::before,.legend .pulse::before{content:""; position:absolute; inset:0; border-radius:inherit; background:var(--pulse); opacity:0; pointer-events:none; animation:conflitto 2.4s ease-in-out infinite}
@keyframes conflitto{0%,100%{opacity:0} 50%{opacity:.85}}
/* la cella della griglia (ora o giorno, secondo lo zoom) che contiene il conflitto pulsa in controfase e più tenue */
.cellpulse{position:absolute; top:0; bottom:0; z-index:0; background:var(--pulse); opacity:0; pointer-events:none; animation:conflitto-cella 2.4s ease-in-out -1.2s infinite}
@keyframes conflitto-cella{0%,100%{opacity:0} 50%{opacity:.22}}
/* barre sottili: tacche rosse sopra e sotto, stessa larghezza, il colore del task resta visibile */
.clash{position:absolute; top:3px; bottom:3px; z-index:1; border-radius:4px; background:repeating-linear-gradient(-45deg, oklch(50% 0.19 27 / .18) 0 5px, transparent 5px 10px)}
.off{position:absolute; top:4px; bottom:4px; z-index:1; border-radius:5px; background:repeating-linear-gradient(-45deg, oklch(20% 0.015 145 / .07) 0 6px, transparent 6px 12px); border:1px dashed var(--border-strong); font-size:11px; color:var(--muted); display:flex; align-items:center; padding:0 8px; overflow:hidden; white-space:nowrap}
/* Spazio + trascina = sposta il diagramma */
body.space-pan .gscroll, body.space-pan .gscroll *{cursor:grab !important}
body.space-pan .gscroll .bar{pointer-events:none}
body.panning .gscroll, body.panning .gscroll *{cursor:grabbing !important; user-select:none}
/* pianificazione a tutta altezza: scorrono solo le righe del Gantt, legenda fissa in fondo */
@media (min-width:1241px){
  .main{height:100vh}
  .view{flex:1; min-height:0; overflow:auto}
  .view.fit{overflow:hidden; padding-bottom:20px}
  .view.fit .planner{flex:1; min-height:0; align-items:stretch}
  .view.fit .planner > .card{display:flex; flex-direction:column; min-height:0}
  .view.fit .gscroll,.view.fit .alerts-scroll{flex:1; min-height:0; max-height:none}
}
.legend{flex:none; display:flex; gap:6px 16px; flex-wrap:wrap; padding:12px 16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted)}

/* ---------- avvisi ---------- */
.alerts{display:flex; flex-direction:column}
.alert{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; padding:12px 16px; border:0; border-bottom:1px solid var(--border); background:none; text-align:left; cursor:pointer; transition:background 120ms}
.alert:hover{background:var(--hover)}
.alert:last-child{border-bottom:0}
.alert .dot{margin-top:6px}
.alert .a-t{font-size:13px; font-weight:600}
.alert .a-d{grid-column:2; font-size:12px; color:var(--muted)}
.alert .a-f{grid-column:2; font-size:12px; color:var(--accent-ink)}
.alerts-scroll{max-height:calc(100vh - 250px); overflow:auto}

/* ---------- foglio del giorno ---------- */
.sheet-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.sheet-head h2{font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-.01em}
.sheet-head h2::first-letter{text-transform:uppercase}
/* foglio del giorno a tutta altezza: lista principale che scorre, colonna laterale fissa */
.giorno{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; min-height:0}
.gl{display:flex; flex-direction:column; min-height:0}
.gl .tabbar .chip{margin-left:4px}
.gl-filtri{border-bottom:1px solid var(--border)}
.gl-scroll{flex:1; min-height:0; overflow:auto}
.gt{position:relative; padding:8px 16px 10px; border-bottom:1px solid var(--border); background:var(--surface); user-select:none; cursor:col-resize}
.gt-scale{position:relative; height:14px; margin-bottom:4px}
.gt-scale span{position:absolute; transform:translateX(-50%); font-family:var(--font-mono); font-size:9.5px; color:var(--faint)}
.gt-track{position:relative; height:calc(var(--lanes) * 9px + 8px); min-height:24px; border-radius:6px; background:var(--sunken)}
.gt-f{position:absolute; top:0; bottom:0; border-left:1px dashed var(--border-strong)}
.gt-bar{position:absolute; height:6px; padding:0; border:0; border-radius:3px; background:var(--c); opacity:.45; cursor:pointer; transition:opacity 140ms, transform 140ms}
.gt-bar.vis{opacity:1}
.gt-bar.w{box-shadow:0 0 0 1.5px var(--pulse)}
.gt-bar:hover{transform:scaleY(1.6); opacity:1}
.gt-now{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--danger)}
.gt-cur{position:absolute; top:-3px; bottom:-3px; border:1.5px solid var(--accent); border-radius:5px; background:var(--accent-soft); pointer-events:none; transition:left 120ms, width 120ms}
.gl-item.hot .gl-main,.gl-item.hov .gl-main{background:var(--accent-soft)}
.gl-item.hot{animation:hot 1.6s ease-out}
@keyframes hot{0%{box-shadow:inset 3px 0 0 var(--accent)}100%{box-shadow:inset 3px 0 0 transparent}}
.gl-group + .gl-group{border-top:1px solid var(--border)}
.gl-gh{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:7px 16px; background:var(--sunken); border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.gl-item{border-bottom:1px solid var(--border)}
.gl-item:last-child{border-bottom:0}
.gl-item.has-w{box-shadow:inset 3px 0 0 var(--pulse)}

/* ---------- drawer & dialog ---------- */
.scrim{position:fixed; inset:0; z-index:40; background:oklch(20% 0.015 145 / .3); opacity:0; pointer-events:none; transition:opacity 200ms}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:50; width:min(540px,100vw); background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(100%); visibility:hidden; transition:transform 240ms var(--ease), visibility 0s 240ms}
.drawer.open{transform:none; visibility:visible; transition:transform 240ms var(--ease)}
.drawer-head{padding:18px 20px 14px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start}
.drawer-head h2{font-family:var(--font-display); font-size:20px}
.drawer-body{padding:18px 20px 32px; overflow:auto; display:flex; flex-direction:column; gap:22px}
.sec > .eyebrow{margin-bottom:8px}
.sec-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; min-height:30px}
.ui-head{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-lg); background:var(--sunken)}
.ui-head > i{width:6px; align-self:stretch; border-radius:3px; background:var(--c)}
.ui-head-t{font-family:var(--font-mono); font-size:14px; font-weight:600}
.drawer-body > *{flex-shrink:0}
.seq{display:flex; gap:2px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
.seq-i{flex:1 0 82px; display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:0; padding:6px 6px 5px; border:1px solid var(--border); border-top:4px solid var(--c); border-radius:6px; background:var(--surface); text-align:left; cursor:pointer; position:relative; transition:background 140ms, border-color 140ms}
.seq-i:hover{background:var(--sunken)}
.seq-i.on{background:var(--accent-soft); border-color:var(--accent); border-top-color:var(--c); box-shadow:0 0 0 1px var(--accent)}
.seq-i.conf::after{content:""; position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--pulse)}
.seq-i > i{display:none}
.seq-n,.seq-d{display:block; width:100%; text-align:left}
.seq-n{max-width:100%; font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seq-d{font-size:10.5px; color:var(--muted)}
.fold{border:1px solid var(--border); border-radius:var(--r); background:var(--surface)}
.fold > summary{display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; list-style:none; font-size:12.5px; font-weight:600; color:var(--muted)}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary svg{transition:transform 160ms var(--ease)}
.fold[open] > summary svg{transform:rotate(90deg)}
.fold-body{padding:0 12px 12px; display:grid; gap:10px}
.sec .fold{margin-top:10px}
dialog.confirm{width:min(440px,94vw)}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff}
.btn-danger:hover{background:oklch(44% 0.18 27); border-color:oklch(44% 0.18 27)}
.comp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:16px; align-items:start}

.kv{display:grid; grid-template-columns:120px 1fr; gap:7px 14px; margin:0; font-size:13px}

.kv dd{margin:0; font-weight:500; min-width:0}
.why{font-size:12px; color:var(--muted); background:var(--sunken); border-radius:var(--r); padding:8px 10px; margin-top:8px}
.people{display:flex; flex-direction:column; gap:6px; margin-bottom:10px}
.person{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 12px; border:1px solid var(--border); border-radius:var(--r)}
.person.bad{border-color:oklch(50% 0.19 27 / .4); background:oklch(50% 0.19 27 / .04)}
.steps{display:flex; flex-direction:column}
.stepi{display:grid; grid-template-columns:12px 1fr auto; gap:10px; align-items:center; padding:7px 8px; border:0; background:none; text-align:left; border-radius:6px; cursor:pointer; font-size:12.5px}
.stepi:hover{background:var(--hover)}
.stepi[aria-current="true"]{background:var(--accent-soft)}
.stepi i{width:10px; height:10px; border-radius:3px; background:var(--c)}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}

.stats b{display:block; font-family:var(--font-mono); font-size:17px; letter-spacing:-.03em}
.stats span{font-size:11.5px; color:var(--muted)}

dialog{border:1px solid var(--border); border-radius:var(--r-lg); padding:0; width:min(760px,96vw); max-height:92vh; background:var(--surface); color:var(--fg)}

@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.99)}}
.dlg-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start}

.stepper span.done{background:oklch(46% 0.13 150 / .12); color:var(--ok)}
.drop{display:grid; place-items:center; gap:6px; padding:40px 20px; border:1.5px dashed var(--border-strong); border-radius:var(--r-lg); background:var(--sunken); text-align:center; cursor:pointer; transition:border-color 140ms, background 140ms}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.progress{height:6px; border-radius:999px; background:var(--sunken); overflow:hidden}

.fgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 14px}

.conf{font-size:11px; font-weight:600; margin-top:4px; display:flex; gap:6px; align-items:center}
.field.low input,.field.low select{border-color:oklch(50% 0.13 70 / .6); background:oklch(50% 0.13 70 / .05)}
.preview{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}

.preview span{font-size:11.5px; color:var(--muted)}

.toasts{position:fixed; bottom:20px; right:20px; z-index:70; display:flex; flex-direction:column; gap:8px; max-width:360px}
.toast{background:var(--fg); color:var(--surface); border-radius:var(--r); padding:11px 14px; font-size:13px; border-left:3px solid var(--accent); animation:in 180ms var(--ease) both; transition:opacity 200ms}
/* dialog: una sola area di scorrimento */
dialog[open]{overflow:hidden}

.hl.low{background:oklch(80% 0.13 60 / .3); box-shadow:inset 0 0 0 1px var(--warn)}

.dt-filtri{padding:12px 14px; border-bottom:1px solid var(--border)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; padding:14px}
.pc{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--surface); padding:0; text-align:left; cursor:pointer; overflow:hidden; transition:border-color 140ms, box-shadow 140ms}
.pc:hover{border-color:var(--accent); box-shadow:0 4px 14px oklch(0% 0 0 / .07)}
.pc-b{padding:10px 12px 12px; display:grid; gap:6px}
.pc-t{font-size:13px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em}
.bar-c{height:4px; border-radius:2px; background:var(--sunken); overflow:hidden}
.bar-c b{display:block; height:100%; background:var(--accent)}
.dt-piede{display:flex; align-items:center; gap:12px; padding:8px 14px; border-top:1px solid var(--border); font-size:12px; color:var(--muted)}
.dt-pag{margin-left:auto; display:flex; gap:2px}
.dt-pag button{min-width:28px; height:28px; border:1px solid transparent; border-radius:6px; background:none; cursor:pointer; font-size:12px}
.dt-pag button.on{border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.dt-pag button:disabled{opacity:.35}
/* segnaposto foto */
.ph{position:relative; aspect-ratio:4/3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:radial-gradient(circle at 50% 42%, var(--ph) 0 28%, color-mix(in oklch, var(--ph) 22%, var(--sunken)) 29%); color:oklch(25% 0 0 / .65); text-align:center}
.ph span{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; background:oklch(100% 0 0 / .75); padding:1px 6px; border-radius:4px; margin-top:58%}
.ph small{font-size:10px}
.ph.has-img{background:#f6f6f4}
.ph.has-img img{width:100%; height:100%; object-fit:contain}
.ph.big{width:200px; flex:none; border-radius:var(--r-lg); overflow:hidden}
.ph.sm{width:120px; border-radius:var(--r)}
.ph.xs{width:52px; flex:none; border-radius:6px}
.ph.xs span,.ph.xs small,.ph.sm small{display:none}
/* scheda */
.sch-top{display:flex; gap:16px; align-items:flex-start}
.sch-check{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:8px; font-size:12px; color:var(--muted)}
.sch-check .ok{color:var(--ok)}
.sec-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.var{display:flex; flex-wrap:wrap; gap:6px}
.vb{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 6px; border:1px solid var(--border); border-radius:999px; background:var(--surface); cursor:pointer; font-size:12px}
.vb.on{border-color:var(--accent); background:var(--accent-soft)}
.tagset{display:flex; flex-wrap:wrap; gap:5px}
.tg{padding:3px 10px; border:1px solid var(--border); border-radius:999px; background:var(--surface); font-size:12px; cursor:pointer}
.tg.on{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--on-accent)}
.tg-l{margin:10px 0 6px}
.fgrid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fgrid.one{grid-template-columns:1fr}
.addc{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.addc select{width:auto}
.addc input#nc-desc{flex:1; min-width:200px}
.fotos{display:flex; flex-wrap:wrap; gap:10px}
.fotos figure{margin:0; width:120px; display:grid; gap:3px}
.fotos img{width:120px; height:90px; object-fit:contain; background:#f6f6f4; border-radius:var(--r); border:1px solid var(--border)}
.fotos figure.main img{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.fotos figcaption{overflow-wrap:anywhere}
.fold{border:1px solid var(--border); border-radius:var(--r); background:var(--surface)}
.fold > summary{display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; list-style:none; font-size:12.5px; font-weight:600; color:var(--muted)}
.fold > summary::-webkit-details-marker{display:none}
.fold[open] > summary svg{transform:rotate(90deg)}
.fold-body{padding:0 12px 12px; display:grid; gap:8px}
.standby{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px dashed oklch(47% 0.13 250 / .45); border-radius:var(--r); background:oklch(47% 0.13 250 / .05); font-size:12.5px; color:var(--muted)}
.standby strong{color:var(--fg)}
dialog.confirm{width:min(440px,94vw)}
/* telefono */
.cens{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; align-items:start}
.phone{width:380px; height:760px; border-radius:46px; background:#151515; padding:14px; box-shadow:0 20px 50px oklch(0% 0 0 / .25); position:relative}
.phone-notch{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:24px; background:#151515; border-radius:0 0 14px 14px; z-index:2}
.phone-scr{height:100%; border-radius:34px; background:var(--bg); overflow:auto; display:flex; flex-direction:column}
.m-head{position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:8px; padding:36px 16px 12px; background:var(--surface); border-bottom:1px solid var(--border); font-size:16px}
.m-back{border:0; background:none; font-size:26px; line-height:1; cursor:pointer; color:var(--accent-ink); padding:0 6px 0 0}
.m-body{padding:16px; display:grid; gap:12px}
.m-opt{display:grid; gap:2px; padding:16px; border:1px solid var(--border); border-radius:16px; background:var(--surface); text-align:left; cursor:pointer}
.m-opt:hover{border-color:var(--accent)}
.m-coda{text-align:center}
.m-shot{display:grid; justify-items:center; gap:6px; padding:34px 12px; border:2px dashed var(--border-strong); border-radius:18px; background:var(--surface); color:var(--accent-ink); cursor:pointer}
.m-thumbs{display:flex; flex-wrap:wrap; gap:8px}
.m-th{position:relative}
.m-th img{width:96px; height:96px; object-fit:cover; border-radius:12px}
.m-th button{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:0; background:var(--fg); color:#fff; cursor:pointer}
.m-next{width:100%; min-height:46px; font-size:15px}
.m-list,.m-sim{display:grid; gap:6px}
.m-it{display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--border); border-radius:12px; background:var(--surface); text-align:left; cursor:pointer}
.m-it > span{display:grid; gap:2px; min-width:0}
.m-it strong{font-size:13px}
.m-imgs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.m-imgs figure{margin:0; display:grid; gap:2px; text-align:center}
.m-imgs img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; background:#eee}
.m-wait{justify-items:center; text-align:center; padding-top:120px}
.spin{width:44px; height:44px; border-radius:50%; border:4px solid var(--border); border-top-color:var(--accent); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.m-ok{width:72px; height:72px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-ink)}
.steps-l{padding-left:18px; display:grid; gap:6px; margin:8px 0 14px}
/* revisione, prompt, import, api */
.rev-list{display:grid; gap:12px}
.rev-it{display:flex; gap:14px; padding:12px; align-items:flex-start}
.rev-it .ph{width:140px; flex:none; border-radius:var(--r); overflow:hidden}
.rev-act{display:grid; gap:6px}
.ptwo{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; align-items:start}
.plist{display:grid}
.pitem{padding:12px 16px; border-bottom:1px solid var(--border); display:grid; gap:6px}
.imp{display:grid; gap:8px}
.codes{display:flex; flex-wrap:wrap; gap:4px 10px}
.json{margin:0; padding:14px 16px; font-family:var(--font-mono); font-size:12px; background:var(--sunken); overflow:auto; max-height:420px; white-space:pre}
@media (max-width:1100px){ .cens,.ptwo{grid-template-columns:1fr} .fgrid.g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* su un telefono vero il censimento occupa tutto lo schermo */
@media (max-width:640px){
  .cens-note{display:none} .phone{width:100%; height:auto; min-height:calc(100vh - 140px); padding:0; border-radius:0; background:none; box-shadow:none}
  .phone-notch{display:none} .phone-scr{border-radius:0} .m-head{padding-top:12px}
  .sch-top{flex-direction:column} .ph.big{width:100%} .ruoli{grid-template-columns:1fr}
}
</style>

<body>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <div class="grow"><div class="eyebrow" id="drawerKicker"></div><h2 id="drawerTitle"></h2></div>
    <button class="icon-btn" data-act="close" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="assets/articoli.js"></script>
<script>
"use strict";
/* ============================================================
   OLTRE IL GIARDINO · CATALOGO — prototipo dell'anagrafica articoli
    Dati: file articoli (2.194 articoli) convertito da Catalogo/converti.js.
   AI simulata: Nano Banana (foto di presentazione) e LLM (descrizione, temi) sono imitati nel browser;
   i colori della foto invece sono calcolati davvero (k-means sui pixel).
   Le modifiche restano solo in questo browser (localStorage).
   ============================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(n,d=1)=>(+n).toLocaleString("it-IT",{maximumFractionDigits:d});
const pad=n=>String(n).padStart(2,"0");
const oggi=()=>{const d=new Date(); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const ICON={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',check:'<path d="m5 12 4 4 10-10"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  upload:'<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>',api:'<path d="M8 6 3 12l5 6M16 6l5 6-5 6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',chev:'<path d="m9 18 6-6-6-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  text:'<path d="M4 6h16M4 12h10M4 18h7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'};
const icon=(n,s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- tabelle ---------- */
const CAT=window.CAT||{articoli:[],colori:{},colfam:{},materiali:{},matfam:{},classi:[],anomalie:{}};
const RGB={"00":"#e9eef0","01":"#ffffff","02":"#fffff0","03":"#fdf3d0","04":"#e6f2f5","05":"#faf3e0","10":"#f2d43c","11":"#d4a017","12":"#bfd641","13":"#dfff00","14":"#cc7722","15":"#ffbf00",
 "20":"#f28c28","21":"#fa8072","22":"#f5a04a","23":"#9a463d","30":"#c62828","31":"#c41e3a","32":"#6d071a","33":"#ff7f50","40":"#7b3fa0","41":"#c8a2c8","42":"#e0218a","43":"#f4a6c0","44":"#e8c4c4","45":"#f7d6dc","46":"#a99bd8",
 "50":"#1c2541","52":"#1f4e9c","53":"#30b5b0","54":"#7ec8e3","55":"#7fd1c1","60":"#2e8b3e","61":"#1b5e63","62":"#6b7f2a","63":"#9caf88","64":"#6fc3b0","65":"#39ff14","66":"#b0ff1a","67":"#8db600","68":"#0b4d2c",
 "70":"#6b4226","71":"#8b7d6b","72":"#e8dcc0","73":"#d9c7a7","74":"#c2b280","75":"#8b5a2b","76":"#4e2e1e","77":"#7a5230","80":"#8c8c8c","81":"#383e42","82":"#a89f91","83":"#c8c8c8","90":"#1a1a1a",
 "91":"#c9a227","92":"#c0c0c0","93":"#5a5a5a","94":"#8c4a2f","95":"#c8a97e","96":"#b0a0c0","97":"#b76e79","98":"#b5a642","99":"#b87333"};
const FAMCOL={bianco:"#ffffff",giallo:"#f2d43c",arancione:"#f28c28",rosso:"#c62828",viola:"#7b3fa0",blu:"#1f4e9c",verde:"#2e8b3e",marrone:"#6b4226",grigio:"#8c8c8c",nero:"#1a1a1a",liberi:"#c9a227",incolore:"#e9eef0"};
const famColore=cc=>{if(!cc) return ""; const n=+cc, k=Object.keys(CAT.colfam).sort().reverse().find(x=>+x<=n); return k?CAT.colfam[k]:"";};
const nomeColore=cc=>CAT.colori[cc]||"";
const nomeMateriale=pr=>CAT.materiali[pr]||(()=>{const k=Object.keys(CAT.matfam).sort().reverse().find(x=>+x<=+pr); return k?CAT.matfam[k]:"";})();
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)), rgb2hex=c=>"#"+c.map(x=>pad(Math.round(x).toString(16))).join("");
const vicino=rgb=>Object.entries(RGB).filter(([k])=>CAT.colori[k]).map(([k,h])=>[k,hex2rgb(h).reduce((s,v,i)=>s+(v-rgb[i])**2,0)]).sort((a,b)=>a[1]-b[1])[0][0];
const CODICI1={},CODICI2={}; CAT.classi.forEach(([c1,n1,c2,n2])=>{CODICI1[n1]=c1; CODICI2[n1+"|"+n2]=c2;});
const CLASSI1=[...new Set(CAT.classi.map(x=>x[1]))];
const classi2=k1=>[...new Set(CAT.classi.filter(x=>x[1]===k1).map(x=>x[3]))], classi3=(k1,k2)=>CAT.classi.filter(x=>x[1]===k1&&x[3]===k2).map(x=>x[5]);
const FUNZIONI=["Seduta","Appoggio / tavolo","Bar e catering","Accoglienza","Illuminazione","Decorazione e scenografia","Separazione spazi","Copertura","Contenitore / espositore","Pedane e palchi","Tessili","Mise en place","Climatizzazione"];
const STILI=["Minimal","Industrial","Shabby chic","Boho","Vintage","Rustico","Luxury","Tropicale","Nordico","Mediterraneo","Contemporaneo","Pop"];
const TEMI=["Matrimonio","Gala","Aziendale / convention","Fiera e stand","Lancio prodotto","Festa privata","Natalizio","Estivo / beach","Garden party","Cerimonia","Evento culturale","Street food"];
const ATTR=["Impilabile","Smontabile","Pieghevole","Per esterni","Resiste alla pioggia","Richiede corrente"];
const RUOLI={parte:"Parte",anima:"Anima",rivestimento:"Rivestimento",struttura:"Struttura"};

/* ---------- stato, persistenza ---------- */
const LS="serra-catalogo-v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||{};}catch{return {};}};
const DB=Object.assign({ov:{},nuovi:[],prompt:[]},load());
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB));}catch{}};
const state={view:"catalogo",ruolo:DB.ruolo||null,dt:{},sel:null,variante:null,mob:{step:0},vista:"griglia",pag:0};
const dtStato=id=>state.dt[id]??={q:"",seg:{}};

/* articoli: dati origine + modifiche locali + nuovi censiti */
const ARTICOLI=()=>[...CAT.articoli,...DB.nuovi];
const art=c=>{const a=CAT.articoli.find(x=>x.c===c)||DB.nuovi.find(x=>x.c===c); return a?{...a,...(DB.ov[c]||{})}:null;};
const setArt=(c,patch,nota)=>{const prev=DB.ov[c]||{}; DB.ov[c]={...prev,...patch,storico:[...(prev.storico||[]),{q:oggi(),chi:RUOLO_N[state.ruolo]||"—",n:nota||Object.keys(patch).join(", ")}]}; save();};
const gruppi=()=>{const m=new Map(); ARTICOLI().forEach(a0=>{const a={...a0,...(DB.ov[a0.c]||{})}; if(!m.has(a.b)) m.set(a.b,[]); m.get(a.b).push(a);}); return [...m.values()];};

/* completezza della scheda (§6 del PRD) */
const CHECK=[["foto","Foto principale",a=>a.foto?.length||a.fotoNuove?.length],["desc","Descrizione estesa",a=>(a.e||"").length>20],
  ["dim","Dimensioni strutturate",a=>a.L||a.D],["log","Volume e peso da imballato",a=>a.vol&&a.peso],["rgb","Colori RGB",a=>a.rgb?.length],
  ["temi","Almeno un tema",a=>a.temi?.length],["funz","Funzione",a=>a.funz?.length]];
const compl=a=>CHECK.filter(([,,f])=>f(a)).length/CHECK.length;
const statoArt=a=>a.stato==="revisione"?["Da revisionare","warn"]:a.stato==="pubblicato"?["Pubblicato","ok"]:compl(a)===1?["Completo","info"]:["Da completare",""];

/* ---------- componenti (stesso linguaggio del prototipo Logistica) ---------- */
const UI={
  stato:(t,tono="",tit="")=>`<span class="chip ${tono}"${tit?` title="${esc(tit)}"`:""}>${esc(t)}</span>`,
  kpi:(n,l,s)=>`<div class="kpi"><div class="n">${esc(n)}</div><div class="l">${esc(l)}${s?" "+UI.stato(s[0],s[1]):""}</div></div>`,
  pannello:({titolo,azioni="",corpo,testata="",piede=""})=>`<section class="card">${testata}${titolo||azioni?`<div class="card-head"><h2 class="grow">${titolo||""}</h2>${azioni}</div>`:""}${corpo}${piede?`<div class="card-body small muted" style="border-top:1px solid var(--border)">${piede}</div>`:""}</section>`,
  sezione:({titolo,azioni="",corpo,nota=""})=>`<section class="sec"><div class="sec-head"><div class="eyebrow grow">${titolo}</div>${azioni}</div>${nota?`<p class="tiny muted" style="margin:-4px 0 8px">${nota}</p>`:""}${corpo}</section>`,
  dettagli:v=>`<dl class="kv">${v.filter(Boolean).map(([k,x])=>`<dt>${esc(k)}</dt><dd>${x}</dd>`).join("")}</dl>`,
  piegabile:({titolo,corpo,aperto=false,n=""})=>`<details class="fold"${aperto?" open":""}><summary><span class="grow">${titolo}</span>${n!==""?`<span class="chip">${n}</span>`:""}${icon("chev",14)}</summary><div class="fold-body">${corpo}</div></details>`,
  schede:(k,voci)=>`<div class="tabbar" role="tablist">${voci.map(([v,l])=>`<button role="tab" data-act="tab" data-k="${k}" data-v="${v}" aria-selected="${state[k]===v}">${l}</button>`).join("")}</div>`,
  tabella:({colonne,righe,vuoto="Nessun dato"})=>`<div class="table-box"><table><thead><tr>${colonne.map(c=>`<th${c.num?' class="num"':""}>${esc(c.t)}</th>`).join("")}</tr></thead><tbody>${righe.length?righe.map(r=>{const R=Array.isArray(r)?{celle:r}:r; return `<tr${R.act?` class="click" ${R.act} tabindex="0"`:""}>${R.celle.map((v,i)=>`<td${colonne[i]?.num?' class="num"':colonne[i]?.mono?' class="mono"':""}>${v}</td>`).join("")}</tr>`;}).join(""):`<tr><td colspan="${colonne.length}" class="empty">${esc(vuoto)}</td></tr>`}</tbody></table></div>`,
  campo:({id,et,v="",tipo="text",attr="",pieno=false})=>`<div${pieno?' class="full"':""}><label class="fl" for="${id}">${esc(et)}</label>${tipo==="textarea"?`<textarea id="${id}" ${attr}>${esc(v)}</textarea>`:`<input id="${id}" type="${tipo}" value="${esc(v)}" ${attr}>`}</div>`,
  sel:({id,et,op,attr="",v=""})=>`<div><label class="fl" for="${id}">${esc(et)}</label><select id="${id}" ${attr}>${op.map(o=>{const [val,l]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}"${val===v?" selected":""}>${esc(l)}</option>`;}).join("")}</select></div>`,
  /* gettoni selezionabili per le tassonomie */
  tags:(campo,voci,sel=[],c)=>`<div class="tagset">${voci.map(x=>`<button type="button" class="tg${sel.includes(x)?" on":""}" data-act="tag" data-f="${campo}" data-v="${esc(x)}" data-c="${esc(c)}" aria-pressed="${sel.includes(x)}">${esc(x)}</button>`).join("")}</div>`,
  colore:(hex,lab="",big=false)=>`<span class="sw${big?" big":""}" style="--sw:${hex}" title="${esc(lab||hex)}"></span>`,
  filtri:({id,cerca,seg=[]})=>{const st=dtStato(id); return `<div class="filtri">${cerca?`<label class="sr" for="q-${id}">Cerca</label><input id="q-${id}" type="search" placeholder="${esc(cerca)}" value="${esc(st.q)}" data-q="${id}">`:""}
    ${seg.map(g=>`<div class="seg seg-sm" role="group" aria-label="${esc(g.n)}">${g.v.map(([v,l,n])=>`<button data-act="seg" data-id="${id}" data-g="${g.n}" data-v="${esc(v)}" aria-pressed="${(st.seg[g.n]||"")===v}">${l}${n!=null?` <span class="seg-n">${n}</span>`:""}</button>`).join("")}</div>`).join("")}</div>`;},

/* ---------- CATALOGO ---------- */
function filtraGruppi(){
  const st=dtStato("cat"), q=st.q.toLowerCase().trim(), s=st.seg;
  return gruppi().filter(g=>{const a=g[0];
    if(q&&!g.some(x=>[x.c,x.d,x.t,x.e,x.k1,x.k2,x.k3,x.f,nomeColore(x.cc),(x.temi||[]).join(" "),(x.stili||[]).join(" ")].join(" ").toLowerCase().includes(q))) return false;
    if(s.k1&&a.k1!==s.k1) return false;
    if(s.st&&!g.some(x=>statoArt(x)[0]===s.st)) return false;
    if(s.col&&!g.some(x=>famColore(x.cc)===s.col)) return false;
    return true;});
}

  const vis=list.slice(state.pag*per,(state.pag+1)*per), cnt=f=>tutti.filter(f).length;

    <div class="seg seg-sm k1" role="group" aria-label="Classe">${[["","Tutte le classi"],...CLASSI1.map(k=>[k,k.toLowerCase()])].map(([v,l])=>`<button data-act="seg" data-id="cat" data-g="k1" data-v="${esc(v)}" aria-pressed="${(st.seg.k1||"")===v}">${esc(l)}${v?` <span class="seg-n">${cnt(g=>g[0].k1===v)}</span>`:""}</button>`).join("")}</div>
    <div class="row wrap colfil"><span class="tiny muted">Colore</span>${Object.entries(FAMCOL).map(([f,h])=>`<button class="swb${st.seg.col===f?" on":""}" data-act="seg" data-id="cat" data-g="col" data-v="${st.seg.col===f?"":f}" title="${f}">${UI.colore(h,f)}</button>`).join("")}</div></div>`;
  const card=g=>{const a=g.find(x=>x.c===state.variante&&g.includes(x))||g[0], [s,t]=statoArt(a), c=compl(a);
    return `<button class="pc" data-act="apri" data-c="${esc(a.c)}">${ph(a)}<div class="pc-b"><div class="mono tiny muted">${esc(a.b)}</div><div class="pc-t">${esc(a.t||a.d)}</div>

const KW=[[/pallet|legno|rustic|botte|cassett/i,"Rustico"],[/ferro|metall|industr|acciaio|corten/i,"Industrial"],[/velluto|oro|ottone|crist|specchi/i,"Luxury"],[/bamb|rattan|vimini|midollino|juta|paglia/i,"Boho"],[/tropic|palm|jungle|mare|righe/i,"Tropicale"],[/vintage|retr|anni/i,"Vintage"],[/bianc|minimal|plexi|metacril/i,"Minimal"],[/shabby|provenz|decap/i,"Shabby chic"]];
const FUNZ_K1={SEDUTE:["Seduta"],TAVOLI:["Appoggio / tavolo"],BANCONI:["Bar e catering"],LUCI:["Illuminazione"],"MISE EN PLACE":["Mise en place"],COPERTURE:["Copertura"],TESSUTI:["Tessili"],CUSCINI:["Tessili","Seduta"],"VASI E PIANTE":["Decorazione e scenografia"],"PAVIMENTI E TAPPETI":["Pedane e palchi","Decorazione e scenografia"],ACCESSORI:["Accoglienza"],MOBILI:["Contenitore / espositore"],BAMBINI:["Decorazione e scenografia"]};
function aiProponi(a,nota=""){
  const testo=[a.t,a.d,a.e,nota,nomeColore(a.cc),nomeMateriale(a.mat||"")].join(" ");
  const stili=[...new Set(KW.filter(([r])=>r.test(testo)).map(x=>x[1]))]; if(!stili.length) stili.push("Contemporaneo");
  const temi=new Set(); if(stili.includes("Luxury")) temi.add("Gala").add("Matrimonio"); if(stili.includes("Rustico")) temi.add("Garden party").add("Matrimonio");
  if(stili.some(s=>["Tropicale","Boho"].includes(s))) temi.add("Estivo / beach"); if(/ross|oro|verde bott/i.test(nomeColore(a.cc))) temi.add("Natalizio"); temi.add("Aziendale / convention");
  const attr=[]; if(/sedia|sgabello|bicchier|piatt|calic/i.test(testo)) attr.push("Impilabile"); if(/ester|giardin|outdoor|polipropil|ombrell/i.test(testo)) attr.push("Per esterni"); if(/lampad|luce|led|frigo/i.test(testo)) attr.push("Richiede corrente");
  const mis=a.L?`Misure ${a.L}×${a.P}${a.H?"×"+a.H:""} cm.`:a.D?`Diametro ${a.D} cm${a.H?", altezza "+a.H+" cm":""}.`:"";
  const e=`${a.t||a.d}${a.mat?" in "+nomeMateriale(a.mat).toLowerCase():""}${a.cc?", colore "+nomeColore(a.cc).toLowerCase():""}. ${a.e&&a.e.length>20?a.e.replace(/\s+$/,"")+" ":""}${mis} ${nota?"Note del censitore: "+nota+". ":""}Adatto ad allestimenti in stile ${stili.join(", ").toLowerCase()}, in particolare per ${[...temi].slice(0,3).join(", ").toLowerCase()}.`.replace(/\s+/g," ").trim();
  return {e,stili,temi:[...temi],funz:FUNZ_K1[a.k1]||[],attr};
}
/* colori reali dalla foto: k-means sui pixel centrali, si scarta il cluster dello sfondo (bordi) */
function coloriDaImmagine(img){
  const N=64, cv=document.createElement("canvas"); cv.width=cv.height=N; const x=cv.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data, px=[], bordo=[];
  for(let y=0;y<N;y++) for(let i=0;i<N;i++){const k=(y*N+i)*4, p=[d[k],d[k+1],d[k+2]]; (y<3||y>N-4||i<3||i>N-4?bordo:px).push(p);}
  const K=5; let c=Array.from({length:K},(_,i)=>px[Math.floor(i*px.length/K)]); let lab=[];
  for(let it=0;it<10;it++){ lab=px.map(p=>c.reduce((b,q,j)=>{const dd=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2; return dd<b[1]?[j,dd]:b;},[0,1e9])[0]);
    c=c.map((q,j)=>{const m=px.filter((_,i)=>lab[i]===j); return m.length?[0,1,2].map(t=>m.reduce((s,p)=>s+p[t],0)/m.length):q;}); }
  const bg=[0,1,2].map(t=>bordo.reduce((s,p)=>s+p[t],0)/bordo.length);
  const cl=c.map((q,j)=>({q,n:lab.filter(l=>l===j).length})).filter(o=>Math.hypot(...o.q.map((v,i)=>v-bg[i]))>40);
  const tot=cl.reduce((s,o)=>s+o.n,0)||1;
  return cl.sort((a,b)=>b.n-a.n).slice(0,3).map(o=>({hex:rgb2hex(o.q),rgb:o.q.map(Math.round),pct:Math.round(o.n/tot*100)}));
}
/* "Nano Banana" simulato: oggetto centrato su sfondo pulito con ombra, secondo il prompt */
function presentazione(img,prompt){
  const S=640, cv=document.createElement("canvas"); cv.width=cv.height=S; const x=cv.getContext("2d");
  const amb=/giardin|ambient/i.test(prompt), grigio=/grigio|ombra/i.test(prompt);
  const g=x.createLinearGradient(0,0,0,S); if(amb){g.addColorStop(0,"#dfe9d6");g.addColorStop(1,"#9fb98a");} else if(grigio){g.addColorStop(0,"#f4f4f2");g.addColorStop(1,"#dcdcd8");} else {g.addColorStop(0,"#fff");g.addColorStop(1,"#f6f6f6");}
  x.fillStyle=g; x.fillRect(0,0,S,S);
  const r=Math.min(S*.78/img.width,S*.78/img.height), w=img.width*r, h=img.height*r;
  x.save(); x.shadowColor="rgba(0,0,0,.22)"; x.shadowBlur=30; x.shadowOffsetY=16; x.drawImage(img,(S-w)/2,(S-h)/2-10,w,h); x.restore();
  x.fillStyle="rgba(0,0,0,.45)"; x.font="12px system-ui"; x.fillText("simulazione Nano Banana",12,S-12);
  return cv.toDataURL("image/jpeg",.85);
}

function fotoEsempio(){const cv=document.createElement("canvas"); cv.width=640; cv.height=480; const x=cv.getContext("2d");
  x.fillStyle="#9a9a96"; x.fillRect(0,0,640,480); x.fillStyle="#7d7c78"; x.fillRect(0,330,640,150);
  x.fillStyle="#d4a017"; x.beginPath(); x.ellipse(320,250,150,110,0,0,Math.PI*2); x.fill();
  x.fillStyle="#b88a10"; x.beginPath(); x.ellipse(320,180,140,45,0,0,Math.PI*2); x.fill();
  x.strokeStyle="#7a5a08"; x.lineWidth=4; for(let i=-2;i<=2;i++){x.beginPath(); x.moveTo(320+i*55,170); x.quadraticCurveTo(320+i*62,260,320+i*50,350); x.stroke();}
  return cv.toDataURL("image/jpeg",.9);}

    <div class="tiny muted" style="margin-top:6px">${esc(a.storico?.at(-1)?.chi||"")} · ${esc(a.storico?.at(-1)?.q||"")} · ${esc(a.storico?.at(-1)?.n||"")}</div></div>
    <div class="rev-act"><button class="btn btn-sm" data-act="apri" data-c="${esc(a.c)}">Apri</button>${state.ruolo==="curatore"?`<button class="btn btn-sm btn-primary" data-act="approva" data-c="${esc(a.c)}">Approva</button><button class="btn btn-sm btn-ghost" data-act="scarta" data-c="${esc(a.c)}">Rimanda</button>`:""}</div></article>`).join("")}</div>`;
}

/* ---------- IMPORT ---------- */
function viewImport(){
  const A=CAT.anomalie, g=gruppi(), multi=g.filter(x=>x.length>1).length, dimOk=CAT.articoli.filter(a=>a.L||a.D).length;
  const blocco=(k,t,d,azione)=>{const l=A[k]||[]; return UI.piegabile({titolo:`${t}`,n:l.length,corpo:`<p class="small">${d}</p><p class="small"><strong>Azione:</strong> ${azione}</p><div class="codes">${l.slice(0,120).map(c=>`<button class="link mono tiny" data-act="apri" data-c="${esc(c)}">${esc(c)}</button>`).join(" ")}${l.length>120?` <span class="tiny muted">… e altri ${l.length-120}</span>`:""}</div>`});};
  return `<section class="kpis">${UI.kpi(num(CAT.articoli.length,0),"articoli importati")}${UI.kpi(num(multi,0),"modelli con varianti di colore")}${UI.kpi(Math.round(dimOk/CAT.articoli.length*100)+"%","dimensioni leggibili")}${UI.kpi(Object.values(A).reduce((s,l)=>s+l.length,0),"anomalie",["da sistemare","warn"])}</section>
    ${UI.pannello({titolo:"Dal file al catalogo",corpo:`<div class="card-body">${UI.dettagli([["File","<span class='mono'>Articoli_13_10_25_rev2_mod.xlsx</span>"],["Codice","spazi rimossi; dal codice si ricavano classe, sottoclasse, <strong>materiale</strong> e <strong>colore</strong>"],
      ["Varianti","stesso codice prima di «-CC» → stesso modello; «-CC» è la variante di colore"],["Dimensioni","testo libero convertito in L/P/H/Ø dove possibile, il resto va misurato"],["Foto","solo i nomi file: la cartella immagini va caricata"],
      ["Nuovi campi","volume e peso, impilabilità, tempi, componenti, colori RGB, funzione, stili, temi: vuoti per tutti, da completare"]])}</div>`})}
    ${UI.pannello({titolo:"Anomalie trovate",corpo:`<div class="card-body imp">
      ${blocco("duplicati","Codici duplicati","Lo stesso codice compare su più righe.","decidere quale riga tenere o assegnare un nuovo codice colore.")}
      ${blocco("fuori_schema","Codici fuori schema","Non rispettano XXFFFprprg-CC.","ricodificare.")}
      ${blocco("breve_lunga","Descrizioni brevi oltre 40 caratteri","Il tracciato ERP ammette 40 caratteri.","accorciare: il resto va nel titolo o nella descrizione estesa.")}
      ${blocco("dimensioni","Dimensioni non leggibili","Testo non interpretabile come misure.","misurare o correggere il testo.")}
      ${blocco("coperture","Coperture e fodere","Articoli che sono il rivestimento di un altro (anima + rivestimento).","collegarli come componente «rivestimento» dell'articolo principale.")}</div>`})}`;
}

/* ---------- API ---------- */
function viewApi(){
  const a=art(state.sel||"SEPOU83006-11")||CAT.articoli[0], ex={codice:a.c,modello:a.b,nome:a.t||a.d,descrizione:a.e,classificazione:[a.k1,a.k2,a.k3],colore:{codice:a.cc,nome:nomeColore(a.cc),rgb:a.rgb||[]},materiale:a.mat?{codice:a.mat,nome:nomeMateriale(a.mat)}:null,
    dimensioni_cm:{L:a.L,P:a.P,H:a.H,D:a.D},logistica:{volume_m3:a.vol??null,peso_kg:a.peso??null,pezzi_per_pila:a.pila??null},funzione:a.funz||[],stili:a.stili||[],temi:a.temi||[],componenti:a.comp||[],
    varianti:(gruppi().find(g=>g.some(x=>x.c===a.c))||[]).map(x=>x.c),foto:(a.foto||[]).map(f=>"https://…/foto/"+f),stato:statoArt(a)[0]};
  return `<div class="ptwo">${UI.pannello({titolo:"API REST (sola lettura)",corpo:UI.tabella({colonne:[{t:"Metodo"},{t:"Percorso",mono:true},{t:"Cosa restituisce"}],righe:[
      ["GET","/articoli","elenco con filtri: testo, classe, funzione, stile, tema, colore vicino a un RGB, stato, aggiornati dopo il…"],["GET","/articoli/{codice}","scheda completa con varianti, componenti, foto, misure"],
      ["GET","/articoli/{codice}/foto","foto originali e di presentazione"],["GET","/modelli/{codice}","modello con tutte le varianti di colore"],["GET","/tassonomie","classi, colori, materiali, funzioni, stili, temi"],["POST","webhook","articolo.pubblicato / articolo.modificato"]].map(r=>[UI.stato(r[0],r[0]==="GET"?"ok":"info"),esc(r[1]),`<span class="small">${esc(r[2])}</span>`])}),
      piede:"Escono solo gli articoli pubblicati. Chiavi per sistema (ERP, sito, logistica), registro degli accessi."})}
    ${UI.pannello({titolo:"Server MCP per gli agenti AI",corpo:UI.tabella({colonne:[{t:"Strumento",mono:true},{t:"Uso"}],righe:[["cerca_articoli","ricerca libera con filtri"],["dettaglio_articolo","scheda di un codice"],["articoli_per_tema","es. «matrimonio rustico all'aperto»"],["articoli_per_colore","vicini a un RGB o a un codice colore"],["composizione","componenti e configurazioni di un articolo"]].map(r=>[r[0],r[1]])})})}</div>
    ${UI.pannello({titolo:`Esempio: GET /articoli/${a.c}`,azioni:'<span class="small muted">apri un articolo dal catalogo per cambiarlo</span>',corpo:`<pre class="json">${esc(JSON.stringify(ex,null,2))}</pre>`})}`;
}

/* ---------- eventi ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return; const v=b.dataset.v, c=b.dataset.c, m=M();
  switch(b.dataset.act){
    case "ruolo": state.ruolo=DB.ruolo=v; save(); state.view=VISIBILI[v][0]; render(); break;
    case "esci": state.ruolo=null; DB.ruolo=null; save(); closeDrawer(); render(); break;
    case "reset": if(await UI.conferma({titolo:"Azzerare le modifiche?",testo:"Si torna ai dati originali: articoli censiti, foto e modifiche fatte in questo browser vanno persi.",ok:"Azzera"})){ try{localStorage.removeItem(LS);}catch{} location.reload(); } break;
    case "view": state.view=v; closeDrawer(); if(v==="censimento"&&m.step===5) state.mob={step:0}; render(); break;
    case "tab": state[b.dataset.k]=v; render(); break;
    case "seg": { const st=dtStato(b.dataset.id); st.seg[b.dataset.g]=st.seg[b.dataset.g]===v?"":v; state.pag=0; render(); break; }
    case "vista": state.vista=v; render(); break;
    case "pag": state.pag=+v; render(); document.querySelector(".view").scrollTop=0; break;
    case "apri": state.sel=c; drawer(); break;
    case "close": closeDrawer(); break;
    case "tag": { const a=art(c), f=b.dataset.f, cur=a[f]||[]; setArt(c,{[f]:cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]},`${f}: ${v}`); drawer(); break; }
    case "ai": { const a=art(c), p=aiProponi(a); setArt(c,{e:p.e,stili:p.stili,temi:p.temi,funz:p.funz,attr:[...new Set([...(a.attr||[]),...p.attr])],ai:true},"proposta AI (simulata)"); toast("Proposta AI applicata: controlla e invia in revisione"); render(); break; }
    case "invia": setArt(c,{stato:"revisione"},"inviato in revisione"); toast("Inviato in revisione"); render(); break;
    case "approva": setArt(c,{stato:"pubblicato",ai:false},"approvato e pubblicato"); toast("Pubblicato: ora è visibile via API"); render(); break;
    case "scarta": setArt(c,{stato:""},"rimandato al censitore"); render(); break;
    case "usa-vol": setArt(c,{vol:+v},"volume dalle dimensioni"); drawer(); break;
    case "add-comp": { const d=$("nc-desc").value.trim(); if(!d) return toast("Scrivi la descrizione o scegli un articolo","warn");
      const cod=d.split(" · ")[0], ka=art(cod), a=art(c); setArt(c,{comp:[...(a.comp||[]),{ruolo:$("nc-ruolo").value,q:+$("nc-q").value||1,...(ka?{cod}:{desc:d})}]},"componente aggiunto"); drawer(); break; }
    case "rm-comp": { const a=art(c); setArt(c,{comp:a.comp.filter((_,i)=>i!==+b.dataset.i)},"componente tolto"); drawer(); break; }
    case "foto-main": { const a=art(c); setArt(c,{fotoNuove:a.fotoNuove.map((x,i)=>({...x,main:i===+b.dataset.i}))},"foto principale"); drawer(); render(); break; }
    case "foto-da": closeDrawer(); state.view="censimento"; state.mob={step:1,mode:"completa",target:c}; render(); break;
    case "add-prompt": { const n=$("np-n").value.trim(), t=$("np-t").value.trim(); if(!n||!t) return toast("Nome e testo sono obbligatori","warn"); DB.prompt.push({n,t,autore:RUOLO_N[state.ruolo]}); save(); toast("Prompt salvato"); render(); break; }
    case "rm-prompt": DB.prompt.splice(+b.dataset.i,1); save(); render(); break;
    /* telefono */
    case "m-mode": Object.assign(m,{mode:v,step:1,target:null,foto:[],nota:"",pid:0,ptesto:null}); rm(); break;
    case "m-back": if(m.step===1&&m.target&&m.mode!=="nuovo"&&!state.fromDrawer) m.target=null; else m.step=Math.max(0,m.step-1); rm(); break;
    case "m-target": m.target=c; rm(); break;
    case "m-demo": (m.foto=m.foto||[]).push(fotoEsempio()); if(!m.nota&&m.mode==="nuovo") m.nota="pouf velluto senape a spicchi"; rm(); break;
    case "m-rmfoto": m.foto.splice(+b.dataset.i,1); rm(); break;
    case "m-step": m.step=+v; rm(); break;
    case "m-elabora": elabora(); break;
    case "m-simile": Object.assign(m,{mode:"completa",target:c}); m.step=3; elabora(); break;
    case "m-invia": inviaCensimento(); break;
    case "m-apri": state.sel=m.nuovo; drawer(); break;
    case "m-reset": state.mob={step:0}; rm(); break;
  }
});
document.addEventListener("change",async ev=>{
  const el=ev.target, m=M();
  if(el.dataset.f&&el.dataset.c){ const k=el.dataset.f, val=el.type==="number"?(el.value===""?null:+el.value):el.value;
    const patch={[k]:val}; if(k==="k1"){patch.k2=classi2(val)[0]; patch.k3=classi3(val,patch.k2)[0];} if(k==="k2") patch.k3=classi3(art(el.dataset.c).k1,val)[0];
    setArt(el.dataset.c,patch,`${k} modificato`); if(["k1","k2","cc"].includes(k)) drawer(); render(); }
  if(el.id==="m-file"&&el.files.length){ m.foto=[...(m.foto||[]),...await Promise.all([...el.files].map(leggiFile))]; rm(); }
  if(el.dataset.mp){ m.pid=+el.value; m.ptesto=null; rm(); }
  if(el.dataset.mr==="k1"){ m.res.k1=el.value; m.res.k2=classi2(el.value)[0]; rm(); }
});
document.addEventListener("input",ev=>{
  const el=ev.target, m=M();
  if(el.dataset.q){ dtStato(el.dataset.q).q=el.value; state.pag=0; const p=el.selectionStart; render(); const q=$("q-"+el.dataset.q); q.focus(); q.setSelectionRange(p,p); }
  if(el.dataset.mq){ m.q=el.value; const p=el.selectionStart; rm(); const q=$("m-q"); q.focus(); q.setSelectionRange(p,p); }
  if(el.dataset.mn) m.nota=el.value;
  if(el.dataset.mpt) m.ptesto=el.value;
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeDrawer(); if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("tr[data-act]")){ev.preventDefault(); ev.target.click();} });
function closeDrawer(){ state.sel=null; $("drawer")?.classList.remove("open"); $("scrim")?.classList.remove("open"); }
render();

</script>
