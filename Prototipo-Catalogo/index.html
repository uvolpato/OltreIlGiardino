<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Oltre Il Giardino · Catalogo prodotti</title>
<link rel="icon" href="assets/logo-oig.png">
<style>
:root{
  --bg:oklch(97.5% 0.005 145);
  --surface:oklch(100% 0 0);
  --sunken:oklch(96% 0.006 145);
  --fg:oklch(20% 0.015 145);
  --muted:oklch(46% 0.012 145);
  --faint:oklch(62% 0.01 145);
  --border:oklch(91.5% 0.007 145);
  --border-strong:oklch(85% 0.01 145);
  --accent:oklch(52% 0.14 155);
  --accent-ink:oklch(43% 0.12 155);
  --accent-soft:oklch(52% 0.14 155 / .1);
  --on-accent:oklch(99% 0.004 145);
  --hover:oklch(20% 0.015 145 / .045);
  --ok:oklch(46% 0.13 150);
  --warn:oklch(50% 0.13 70);
  --danger:oklch(50% 0.19 27);
  --info:oklch(47% 0.13 250);

  --t-carico:oklch(48% 0.09 255);
  --t-viaggio:oklch(50% 0.09 220);
  --t-consegna:oklch(48% 0.09 190);
  --t-allestimento:oklch(47% 0.12 155);
  --t-disallestimento:oklch(53% 0.12 80);
  --t-ritiro:oklch(51% 0.13 45);
  --t-rientro:oklch(44% 0.04 255);
  --pulse:oklch(78% 0.17 65);
  --t-attesa:oklch(55% 0.03 145);
  --t-pernotta:oklch(42% 0.09 300);
  --t-sopralluogo:oklch(50% 0.1 340);
  --t-altro:oklch(50% 0.02 60);

  --r:8px; --r-lg:12px;
  --font-display:'Iowan Old Style','Charter',Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --lw:256px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{margin:0; line-height:1.2; font-weight:600}
h1{font-family:var(--font-display); font-size:22px; letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13.5px}
p{margin:0}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
[hidden]{display:none!important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.row{display:flex; align-items:center; gap:8px}
.grow{flex:1; min-width:0}
.wrap{flex-wrap:wrap}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
.sidebar{background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{display:flex; align-items:center; gap:12px; padding:18px 18px 16px; border-bottom:1px solid var(--border)}
.brand img{height:30px; width:auto}
.brand strong{display:block; font-family:var(--font-display); font-size:15px}
.brand small{display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.nav{padding:10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto}
.nav button{display:flex; align-items:center; gap:10px; min-height:40px; padding:8px 10px; border:0; border-radius:var(--r); background:none; cursor:pointer; text-align:left; font-size:13.5px; font-weight:500; transition:background 140ms}
.nav button svg{color:var(--muted); flex:none}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.nav button[aria-current="page"] svg{color:var(--accent-ink)}
.nav .count{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:oklch(50% 0.19 27 / .12); color:var(--danger)}
.health{margin:10px; padding:14px; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--sunken); display:grid; gap:8px}
.health .row{justify-content:space-between; font-size:12.5px}
.health b{font-family:var(--font-mono); font-size:13px}
.side-docs{display:block; margin:0 10px; padding:8px; border-radius:var(--r); font-size:12.5px; font-weight:600; color:var(--accent-ink); text-decoration:none}
.side-docs:hover{background:var(--hover); text-decoration:underline}
.side-docs::after{content:" ↗"; color:var(--faint)}
.side-foot{padding:12px 18px 16px; font-size:11px; color:var(--faint); line-height:1.45}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:20; background:oklch(97.5% 0.005 145 / .9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.topbar .title{flex:1 1 240px; min-width:0}
.topbar .title p{font-size:12.5px; color:var(--muted); margin-top:3px}
.datenav{display:flex; align-items:center; gap:4px}
.datenav .label{min-width:210px; text-align:center; font-weight:600; font-size:13.5px}
.datenav .label::first-letter{text-transform:uppercase}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:36px; padding:7px 14px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); cursor:pointer; font-size:13px; font-weight:500; white-space:nowrap; transition:background 140ms, border-color 140ms}
.btn:hover{background:var(--sunken); border-color:var(--border-strong)}
.btn-primary{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--on-accent)}
.btn-primary:hover{background:oklch(38% 0.11 155); border-color:oklch(38% 0.11 155)}
.btn-ghost{border-color:transparent; background:none; color:var(--muted)}
.btn-ghost:hover{color:var(--fg)}
.btn-sm{min-height:30px; padding:4px 10px; font-size:12.5px}
.icon-btn{position:relative; display:inline-grid; place-items:center; width:36px; height:36px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); color:var(--muted); cursor:pointer; transition:background 140ms, color 140ms}
.icon-btn:hover{background:var(--sunken); color:var(--fg)}
.icon-btn .badge{position:absolute; top:-6px; right:-6px; min-width:18px; padding:1px 5px; border-radius:999px; background:var(--danger); color:#fff; font:700 10px/1.4 var(--font-mono)}
.seg{display:inline-flex; padding:3px; gap:2px; border:1px solid var(--border); border-radius:999px; background:var(--surface)}
.seg button{border:0; background:none; padding:5px 12px; min-height:28px; border-radius:999px; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); transition:background 140ms,color 140ms}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--surface)}
input,select,textarea{width:100%; min-height:36px; padding:7px 10px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); font-size:13px; transition:border-color 140ms}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent-soft); border-color:var(--accent)}
textarea{min-height:64px; resize:vertical}
label.fl{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px}

.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; background:var(--hover); color:var(--muted)}
.chip.ok{background:oklch(46% 0.13 150 / .12); color:var(--ok)}
.chip.warn{background:oklch(50% 0.13 70 / .13); color:var(--warn)}
.chip.err{background:oklch(50% 0.19 27 / .11); color:var(--danger)}
.chip.info{background:oklch(47% 0.13 250 / .1); color:var(--info)}
.dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)} .dot.info{background:var(--info)}
.tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600}
.tag i{width:10px; height:10px; border-radius:3px; background:var(--c)}

/* ---------- surfaces ---------- */
.view{padding:24px 28px 56px; display:flex; flex-direction:column; gap:16px; animation:in 220ms var(--ease) both}
@keyframes in{from{opacity:0; transform:translateY(4px)}}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); min-width:0}
.card-head{padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:56px}
.card-body{padding:16px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px}
.kpi .n{font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:-.04em; line-height:1.1}
.kpi .l{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:6px; align-items:center}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11.5px; font-weight:600; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--border); background:var(--sunken); white-space:nowrap; position:sticky; top:0; z-index:1}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer; transition:background 120ms}
tr.click:hover{background:var(--hover)}
.num{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.table-box{overflow:auto}
.tabbar{display:flex; gap:2px; padding:0 12px; border-bottom:1px solid var(--border)}
.tabbar button{border:0; background:none; padding:12px 10px 10px; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500; border-bottom:2px solid transparent; transition:color 140ms}
.tabbar button:hover{color:var(--fg)}
.tabbar button[aria-selected="true"]{color:var(--fg); border-bottom-color:var(--accent)}
/* registro modifiche */
.reg{list-style:none; margin:0; padding:0; display:grid}
.reg li{display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border)}
.reg li.annullata{opacity:.55} .reg li.annullata .grow>div:first-child{text-decoration:line-through}
.empty{padding:36px 20px; text-align:center; color:var(--muted); font-size:13px}
.meter{width:72px; height:6px; border-radius:999px; background:var(--sunken); overflow:hidden; display:inline-block; vertical-align:middle}
.meter b{display:block; height:100%; background:var(--accent)}
.meter.hi b{background:var(--warn)}

/* ---------- gantt ---------- */
.planner{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
@media (max-width:1240px){.planner{grid-template-columns:minmax(0,1fr)}}
.gscroll{overflow:auto; max-height:calc(100vh - 250px); scrollbar-width:thin}
.gantt{position:relative; width:calc(var(--lw) + var(--w)); min-width:100%}
.g-head,.g-row{display:grid; grid-template-columns:var(--lw) var(--w)}
.g-head{position:sticky; top:0; z-index:8; background:var(--surface)}
.g-corner{position:sticky; left:0; z-index:2; background:var(--sunken); border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:0 14px; display:flex; align-items:center}
.g-scale{position:relative; height:66px; background:var(--sunken); border-bottom:1px solid var(--border)}
.g-mbar{display:flex; height:22px; width:100%}
.mbseg{flex:0 0 auto; height:22px; position:relative; display:flex; align-items:center; background:oklch(91% 0.055 var(--h)); border-right:1px solid var(--surface); box-shadow:inset 0 -1px 0 oklch(80% 0.07 var(--h))}
.mb-lab{position:sticky; left:var(--lw); padding:0 10px; font-size:11px; font-weight:600; letter-spacing:.02em; color:oklch(32% 0.09 var(--h)); white-space:nowrap}
.g-scale .tk{position:absolute; top:22px; bottom:0; border-left:1px solid var(--border); padding:6px 0 0 6px; font-family:var(--font-mono); font-size:11px; color:var(--muted); white-space:nowrap}
.g-scale .tk b{display:block; font-family:var(--font-sans); font-size:12.5px; color:var(--fg); font-weight:600}
.g-scale .tk.today b{color:var(--accent-ink)}
.g-scale .tk.m1{border-left:2px solid var(--border-strong)}
.g-scale .tk.minor{top:50px; padding-top:0; color:var(--faint); font-size:9.5px; border-left-color:transparent}
.g-overlay{position:absolute; top:66px; bottom:0; left:var(--lw); width:var(--w); pointer-events:none}
.g-overlay i{position:absolute; top:0; bottom:0; border-left:1px solid var(--border)}
.g-overlay i.hr{border-left:1px dashed oklch(91.5% 0.007 145 / .7)}
.zoomer{align-items:center}
.sortsel{width:auto; min-height:30px; padding:3px 8px; font-size:12.5px}
.zoomer button{width:28px; padding:0; font-size:16px; line-height:1}
.zoomer span{min-width:48px; text-align:center; font-size:12px; color:var(--muted)}
.g-overlay i.shade{border:0; background:oklch(20% 0.015 145 / .028)}
.g-overlay i.today{border:0; background:var(--accent-soft)}
.g-now{position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--danger); z-index:3}
.g-now::before{content:''; position:absolute; top:-1px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--danger)}
.g-section{position:sticky; left:0; padding:14px 14px 6px; width:var(--lw)}
.g-row{position:relative}
.g-label{position:sticky; left:0; z-index:4; background:var(--surface); border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 12px 8px 14px; display:flex; align-items:center; gap:8px; min-width:0}
.g-label .t{min-width:0; flex:1}
.g-label .l1{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-label .l2{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-row.child .g-label{padding-left:40px; background:var(--sunken)}
.g-row.child .g-label .l1{font-weight:500}
.g-track{position:relative; border-bottom:1px solid var(--border); min-height:44px}
.g-empty{position:sticky; left:calc(var(--lw) + 16px); display:inline-block; padding:34px 0; font-size:13px; color:var(--muted)}
.g-row.drop .g-track{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent)}
.chev{display:grid; place-items:center; width:24px; height:24px; border:0; border-radius:6px; background:none; color:var(--muted); cursor:pointer; flex:none; transition:transform 160ms var(--ease), background 140ms}
.chev:hover{background:var(--hover); color:var(--fg)}
.chev[aria-expanded="true"]{transform:rotate(90deg)}
.bar{position:absolute; z-index:2; display:flex; align-items:center; padding:0 7px; border:0; border-radius:5px; background:var(--c); color:#fff; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; box-shadow:inset 0 -1px 0 oklch(0% 0 0 / .14); transition:filter 140ms, transform 140ms}
.bar:hover{filter:brightness(1.1); z-index:5}
.bar[draggable="true"]{cursor:grab}
.bar.dragging{opacity:.35}
.bar.slim{padding:0; justify-content:center; border-radius:min(5px,40%)}
/* barra troppo stretta per il testo: tre puntini indicano che c'è un'etichetta (nel tooltip e nel dettaglio) */
.bar .more{display:flex; gap:2px}
.bar .more i{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.9}
.bar.occ{background:repeating-linear-gradient(-45deg,var(--c) 0 5px,oklch(from var(--c) calc(l + .14) c h) 5px 10px)}
.bar.manual::after{content:""; position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background:#fff}
/* bordo di conflitto interno: non invade le barre vicine */
/* conflitto: la barra pulsa lentamente verso il rosso (niente bordi), lo stesso ritmo per tutte */
.bar.is-conflict::before,.legend .pulse::before{content:""; position:absolute; inset:0; border-radius:inherit; background:var(--pulse); opacity:0; pointer-events:none; animation:conflitto 2.4s ease-in-out infinite}
@keyframes conflitto{0%,100%{opacity:0} 50%{opacity:.85}}
/* la cella della griglia (ora o giorno, secondo lo zoom) che contiene il conflitto pulsa in controfase e più tenue */
.cellpulse{position:absolute; top:0; bottom:0; z-index:0; background:var(--pulse); opacity:0; pointer-events:none; animation:conflitto-cella 2.4s ease-in-out -1.2s infinite}
@keyframes conflitto-cella{0%,100%{opacity:0} 50%{opacity:.22}}
/* barre sottili: tacche rosse sopra e sotto, stessa larghezza, il colore del task resta visibile */
.clash{position:absolute; top:3px; bottom:3px; z-index:1; border-radius:4px; background:repeating-linear-gradient(-45deg, oklch(50% 0.19 27 / .18) 0 5px, transparent 5px 10px)}
.off{position:absolute; top:4px; bottom:4px; z-index:1; border-radius:5px; background:repeating-linear-gradient(-45deg, oklch(20% 0.015 145 / .07) 0 6px, transparent 6px 12px); border:1px dashed var(--border-strong); font-size:11px; color:var(--muted); display:flex; align-items:center; padding:0 8px; overflow:hidden; white-space:nowrap}
/* Spazio + trascina = sposta il diagramma */
body.space-pan .gscroll, body.space-pan .gscroll *{cursor:grab !important}
body.space-pan .gscroll .bar{pointer-events:none}
body.panning .gscroll, body.panning .gscroll *{cursor:grabbing !important; user-select:none}
/* pianificazione a tutta altezza: scorrono solo le righe del Gantt, legenda fissa in fondo */
@media (min-width:1241px){
  .main{height:100vh}
  .view{flex:1; min-height:0; overflow:auto}
  .view.fit{overflow:hidden; padding-bottom:20px}
  .view.fit .planner{flex:1; min-height:0; align-items:stretch}
  .view.fit .planner > .card{display:flex; flex-direction:column; min-height:0}
  .view.fit .gscroll,.view.fit .alerts-scroll{flex:1; min-height:0; max-height:none}
  /* vista con una sola card che contiene un datatable (sopra possono esserci kpi o note): la card riempie lo spazio,
     scorrono solo le righe con l'intestazione sticky. Viste con più card scorrono come pagina. */
  .view:has(> .card > .table-box):not(:has(> .card ~ .card)){overflow:hidden; padding-bottom:20px}
  .view:has(> .card > .table-box):not(:has(> .card ~ .card)) > *{flex:none}
  .view:has(> .card > .table-box):not(:has(> .card ~ .card)) > .card{flex:1; min-height:0; display:flex; flex-direction:column}
  .view:has(> .card > .table-box):not(:has(> .card ~ .card)) > .card > *{flex:none}
  .view:has(> .card > .table-box):not(:has(> .card ~ .card)) > .card > .table-box{flex:1 1 0; min-height:120px; overflow:auto}
}
.legend{flex:none; display:flex; gap:6px 16px; flex-wrap:wrap; padding:12px 16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted)}

/* ---------- avvisi ---------- */
.alerts{display:flex; flex-direction:column}
.alert{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; padding:12px 16px; border:0; border-bottom:1px solid var(--border); background:none; text-align:left; cursor:pointer; transition:background 120ms}
.alert:hover{background:var(--hover)}
.alert:last-child{border-bottom:0}
.alert.prom{cursor:default}
.alert.prom.done .a-t{text-decoration:line-through; color:var(--muted)}
.pmark{position:absolute; top:50%; width:13px; height:13px; margin:-7px 0 0 -7px; padding:0; transform:rotate(45deg); border:2px solid var(--surface); border-radius:3px; background:var(--info); cursor:pointer; z-index:3}
.pmark.err{background:var(--danger)} .pmark.warn{background:var(--warn)} .pmark.ok{background:var(--faint)}
.pmark:hover,.pmark:focus-visible{outline:2px solid var(--fg); outline-offset:1px}
.chip.err{background:var(--danger); color:#fff}
.alert .dot{margin-top:6px}
.alert .a-t{font-size:13px; font-weight:600}
.alert .a-d{grid-column:2; font-size:12px; color:var(--muted)}
.alert .a-f{grid-column:2; font-size:12px; color:var(--accent-ink)}
.alerts-scroll{max-height:calc(100vh - 250px); overflow:auto}

/* ---------- foglio del giorno ---------- */
.sheet-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.sheet-head h2{font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-.01em}
.sheet-head h2::first-letter{text-transform:uppercase}
/* foglio del giorno a tutta altezza: lista principale che scorre, colonna laterale fissa */
.giorno{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; min-height:0}
.gl{display:flex; flex-direction:column; min-height:0}
.gl .tabbar .chip{margin-left:4px}
.gl-filtri{border-bottom:1px solid var(--border)}
.gl-scroll{flex:1; min-height:0; overflow:auto}
.gt{position:relative; padding:8px 16px 10px; border-bottom:1px solid var(--border); background:var(--surface); user-select:none; cursor:col-resize}
.gt-scale{position:relative; height:14px; margin-bottom:4px}
.gt-scale span{position:absolute; transform:translateX(-50%); font-family:var(--font-mono); font-size:9.5px; color:var(--faint)}
.gt-track{position:relative; height:calc(var(--lanes) * 9px + 8px); min-height:24px; border-radius:6px; background:var(--sunken)}
.gt-f{position:absolute; top:0; bottom:0; border-left:1px dashed var(--border-strong)}
.gt-bar{position:absolute; height:6px; padding:0; border:0; border-radius:3px; background:var(--c); opacity:.45; cursor:pointer; transition:opacity 140ms, transform 140ms}
.gt-bar.vis{opacity:1}
.gt-bar.w{box-shadow:0 0 0 1.5px var(--pulse)}
.gt-bar:hover{transform:scaleY(1.6); opacity:1}
.gt-now{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--danger)}
.gt-cur{position:absolute; top:-3px; bottom:-3px; border:1.5px solid var(--accent); border-radius:5px; background:var(--accent-soft); pointer-events:none; transition:left 120ms, width 120ms}
.gl-item.hot .gl-main,.gl-item.hov .gl-main{background:var(--accent-soft)}
.gl-item.hot{animation:hot 1.6s ease-out}
@keyframes hot{0%{box-shadow:inset 3px 0 0 var(--accent)}100%{box-shadow:inset 3px 0 0 transparent}}
.gl-group + .gl-group{border-top:1px solid var(--border)}
.gl-gh{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:7px 16px; background:var(--sunken); border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.gl-item{border-bottom:1px solid var(--border)}
.gl-item:last-child{border-bottom:0}
.gl-item.has-w{box-shadow:inset 3px 0 0 var(--pulse)}
.gl-main{width:100%; display:grid; grid-template-columns:96px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 16px; border:0; background:none; text-align:left; cursor:pointer; transition:background 120ms}
.gl-main:hover{background:var(--hover)}
.gl-item.open .gl-main{background:var(--accent-soft)}
.gl-ora{font-size:13px; font-weight:600; display:flex; flex-direction:column; line-height:1.25}
.gl-ora .muted{font-weight:400; font-size:11.5px}
.gl-body{display:flex; flex-direction:column; gap:2px; min-width:0}
.gl-l1{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gl-l2{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gl-side{display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.gl-more{padding:4px 16px 14px 124px; background:var(--accent-soft)}
.gs-row{display:grid; grid-template-columns:170px minmax(0,1fr); gap:12px; padding:9px 16px; border-bottom:1px solid var(--border); align-items:center}
.gs-who{display:flex; flex-direction:column}
.gs-seq{display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; font-size:12.5px}
.gs-step{display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 6px; border-radius:999px; background:var(--sunken)}
.gs-step i{width:8px; height:8px; border-radius:2px; background:var(--c)}
.gs-arr{color:var(--faint)}
.gside{min-height:0; overflow:auto}
.crew-v{grid-template-columns:1fr!important}
.crew-v > div{border-right:0!important; border-bottom:1px solid var(--border)}
.crew-v > div:last-child{border-bottom:0}
.kpi-btn{text-align:left; cursor:pointer; font:inherit; color:inherit; transition:border-color 140ms, background 140ms}
.kpi-btn:hover{border-color:var(--accent); background:var(--accent-soft)}
.print-only{display:none}
@media (min-width:1241px){ .view.fit .giorno{flex:1; grid-template-rows:minmax(0,1fr)} .view.fit .gl,.view.fit .gside{min-height:0; overflow:hidden} .view.fit .gside{overflow:auto} }
@media (max-width:1240px){ .giorno{grid-template-columns:1fr} .gl-scroll{max-height:none} .gl-more{padding-left:16px} }
@media print{ .giorno,.kpis{display:none!important} .print-only{display:block} }
.crew{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0}
.crew > div{padding:14px 16px; border-right:1px solid var(--border)}
.crew > div:last-child{border-right:0}
.crew ul{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; font-size:13px}
.crew li{display:flex; gap:10px}
.crew .h{font-family:var(--font-mono); font-weight:600; min-width:48px; white-space:nowrap; flex:none}
.sheet td{font-size:12.5px}
.sheet td.who{min-width:150px}
td.mono{white-space:nowrap}
.sheet .need,.mag-sheet .need{color:var(--danger); font-weight:600}
/* report cartacei di magazzino */
.print-only{display:none}
.mag-list{display:grid; gap:14px}
.mag-sheet{padding:16px 18px; display:grid; gap:12px}
.mag-h{display:flex; align-items:flex-start; gap:12px}
.mag-h h3{margin:2px 0 0; font-size:16px}
.mag-h .mono{font-size:18px; font-weight:700}
.mag-info{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:6px 18px; margin:0}
.mag-info dt{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.mag-info dd{margin:0; font-size:13px}
.mag-t{width:100%; border-collapse:collapse; font-size:13px}
.mag-t th,.mag-t td{border:1px solid var(--border); padding:6px 8px; text-align:left}
.mag-t th{background:var(--sunken); font-size:11.5px}
.mag-t .num{text-align:right; font-family:var(--font-mono)}
.mag-t .pen{width:90px} .mag-t .pen.c{text-align:center; font-size:16px; color:var(--muted)}
.mag-firma{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); padding-top:6px}

/* ---------- drawer & dialog (pannello dettaglio centrato) ---------- */
.scrim{position:fixed; inset:0; z-index:40; background:oklch(15% 0.02 145 / .45); opacity:0; pointer-events:none; transition:opacity 200ms}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; inset:0; z-index:50; width:min(1320px,calc(100vw - 48px)); height:calc(100vh - 48px); margin:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:0 24px 80px oklch(0% 0 0 / .18); display:flex; flex-direction:column; overflow:hidden; transform:scale(.97); opacity:0; visibility:hidden; transition:transform 220ms var(--ease), opacity 180ms ease, visibility 0s 220ms}
.drawer.open{transform:none; opacity:1; visibility:visible; transition:transform 220ms var(--ease), opacity 180ms ease}
.drawer-head{padding:18px 22px 14px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:flex-start; flex-shrink:0}
.drawer-head h2{font-family:var(--font-display); font-size:22px; line-height:1.25}
.drawer-head .eyebrow{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px}
.drawer-body{padding:0; overflow:auto; display:flex; flex-direction:column; flex:1; min-height:0}
.drawer-body > .detail-layout{flex:1}
.drawer-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; align-items:center; flex-shrink:0; background:var(--sunken)}
.drawer-foot .btn{min-height:36px}
.detail-layout{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:22px; padding:22px; align-content:start}
.detail-full{grid-column:1/-1; display:flex; flex-direction:column; gap:16px}
.detail-main,.detail-side{display:flex; flex-direction:column; gap:18px}
.detail-section{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:12px}
.detail-section > .eyebrow{margin:0}
.detail-section > .sec-head{margin:0}
.drawer .people{margin:0}
.drawer .seq{padding-bottom:6px}
.drawer .seq-i{flex-basis:110px}
@media (max-width:1024px){
  .drawer{width:100vw; height:100vh; max-height:none; border-radius:0; margin:0; inset:0}
  .detail-layout{grid-template-columns:1fr; padding:16px; gap:16px}
  .drawer-foot{position:sticky; bottom:0}
}
.sec > .eyebrow{margin-bottom:8px}
.sec-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; min-height:30px}
.ui-head{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-lg); background:var(--sunken)}
.ui-head > i{width:6px; align-self:stretch; border-radius:3px; background:var(--c)}
.ui-head-t{font-family:var(--font-mono); font-size:14px; font-weight:600}
.drawer-body > *{flex-shrink:0}
.seq{display:flex; gap:2px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
.seq-i{flex:1 0 82px; display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:0; padding:6px 6px 5px; border:1px solid var(--border); border-top:4px solid var(--c); border-radius:6px; background:var(--surface); text-align:left; cursor:pointer; position:relative; transition:background 140ms, border-color 140ms}
.seq-i:hover{background:var(--sunken)}
.seq-i.on{background:var(--accent-soft); border-color:var(--accent); border-top-color:var(--c); box-shadow:0 0 0 1px var(--accent)}
.seq-i.conf::after{content:""; position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--pulse)}
.seq-i > i{display:none}
.seq-n,.seq-d{display:block; width:100%; text-align:left}
.seq-n{max-width:100%; font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seq-d{font-size:10.5px; color:var(--muted)}
.fold{border:1px solid var(--border); border-radius:var(--r); background:var(--surface)}
.fold > summary{display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; list-style:none; font-size:12.5px; font-weight:600; color:var(--muted)}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary svg{transition:transform 160ms var(--ease)}
.fold[open] > summary svg{transform:rotate(90deg)}
.fold-body{padding:0 12px 12px; display:grid; gap:10px}
.sec .fold{margin-top:10px}
dialog.confirm{width:min(440px,94vw)}
/* dialog di inserimento/modifica dati (anagrafiche, stima): larghezza moderata, non "wide" */
dialog.form{width:min(760px,94vw); max-height:92vh}
dialog.form .dlg-body{padding:20px 24px}
dialog.form .fgrid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 18px}
dialog.form .fgrid .full{grid-column:1/-1}
/* etichette di ambito per i pannelli di dettaglio: ordine (fisso) vs tratta vs task */
.scope{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:1px solid transparent; white-space:nowrap}
.scope.ordine{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft)}
.scope.tratta{color:var(--ok); border-color:var(--ok); background:oklch(46% 0.13 150 / .1)}
.scope.task,.scope.piano{color:var(--info); border-color:var(--info); background:oklch(47% 0.13 250 / .1)}
.scope.avvisi{color:var(--warn); border-color:var(--warn); background:oklch(50% 0.13 70 / .1)}
.det-panel{overflow:hidden}
.det-panel.det-ordine{border-left:3px solid var(--accent)}
.det-panel.det-tratta{border-left:3px solid var(--ok)}
.det-panel.det-task,.det-panel.det-piano{border-left:3px solid var(--info)}
.det-panel.det-avvisi{border-left:3px solid var(--warn)}
.det-panel .card-head{gap:10px}
.det-panel .card-head h2{font-size:14px}
/* multi-selezione a checkbox (ruoli, patenti, certificazioni) */
.chipgroup{display:flex; flex-wrap:wrap; gap:8px}
.chk{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:var(--surface); cursor:pointer; font-size:13px; transition:border-color 140ms, background 140ms}
.chk:hover{border-color:var(--accent)}
.chk input{width:auto; min-height:0; accent-color:var(--accent)}
.chk:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
/* editor assenze/ferie nei moduli */
/* elenchi ad altezza fissa (~3 righe, poi scroll): il dialog non cambia dimensione aggiungendo righe */
.ass-list{display:flex; flex-direction:column; gap:8px; height:158px; overflow:auto; padding-right:4px; scrollbar-width:thin}
.ae-pane[data-pane="arch"] .ass-list{height:380px}
.ass-row{border:1px solid var(--border); border-radius:var(--r); padding:6px 8px 6px 10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; background:var(--surface)}
.ass-row.bad{border-color:var(--danger)}
.ass-row.hot{animation:hot 1.6s ease-out}
.ass-row select{width:auto; min-height:32px}
.ass-row input{min-height:32px; padding:4px 8px; font-size:12.5px; width:auto; min-width:118px}
.ass-dur{min-width:64px; text-align:right; font-family:var(--font-mono); font-size:11.5px; color:var(--muted)}
.ass-msg{flex-basis:100%; font-size:12px}
.ass-msg:empty{display:none}
.t-warn{color:var(--warn)}
/* dialog addetto: schede + disponibilità */
dialog.form.ae{width:min(980px,94vw)}
.ae .tabbar{padding:0 16px}
/* schede nei dialog: tutte nella stessa cella della griglia, quindi il dialog è alto quanto la scheda più grande
   e non cambia dimensione passando da una scheda all'altra (le nascoste restano in layout ma invisibili) */
.panes{display:grid}
.panes>*{grid-area:1/1; min-width:0; display:block}
/* data-off (non hidden: [hidden] è display:none globale) */
.panes>[data-off]{visibility:hidden}
.tab-n{margin-left:6px; padding:0 6px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); font:700 10px/1.6 var(--font-mono)}
.tab-n[hidden]{display:none}
.tab-n.warn{background:oklch(50% 0.13 70 / .14); color:var(--warn)}
.stars{display:inline-flex; flex-direction:row-reverse; justify-content:flex-end; gap:2px}
.stars label{position:relative; padding:2px; font-size:24px; line-height:1; color:var(--border-strong); cursor:pointer; border-radius:4px}
.stars input{position:absolute; opacity:0; width:1px; height:1px}
.stars label:has(input:checked),.stars label:has(input:checked)~label{color:oklch(74% 0.15 80)}
.stars label:has(input:focus-visible){outline:2px solid var(--accent)}
.ae-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ae-bar b{min-width:130px; text-align:center; font-size:14px}
.ae-tl{--lw:150px; border:1px solid var(--border); border-radius:var(--r); overflow:hidden}
.ae-tl .gscroll{height:228px}
.ae-me .g-track{cursor:crosshair; user-select:none; touch-action:none}
.ae-sel{position:absolute; top:4px; bottom:4px; z-index:3; display:flex; align-items:center; padding:0 6px; border:1.5px dashed var(--accent); border-radius:5px; background:var(--accent-soft); color:var(--accent-ink); font-size:11px; white-space:nowrap; pointer-events:none}
.ae-sel[hidden]{display:none}
.off[data-act]{cursor:pointer}
.off[data-act]:hover{color:var(--danger); border-color:var(--danger)}
/* griglia delle tabelle di lookup */
.lk-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
@media (max-width:1024px){.lk-grid{grid-template-columns:1fr}}
/* ---------- aiuti contestuali (tooltip) ---------- */
.hint{display:inline-grid; place-items:center; width:20px; height:20px; padding:0; border:1px solid var(--border); border-radius:50%; background:var(--sunken); color:var(--muted); cursor:help; font-size:11px; line-height:1; flex:none; transition:border-color 140ms, color 140ms, background 140ms}
.hint:hover,.hint:focus-visible{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); outline:none}
.hint-tip{position:fixed; z-index:90; max-width:320px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r); background:var(--fg); color:var(--surface); box-shadow:0 12px 32px oklch(0% 0 0 / .22); font-size:12.5px; line-height:1.45}
.hint-tip b{color:var(--accent)}
.hint-tip[hidden]{display:none}


.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff}
.btn-danger:hover{background:oklch(44% 0.18 27); border-color:oklch(44% 0.18 27)}
.comp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:16px; align-items:start}
.comp .card-head h2{font-size:13.5px}
.mt-leg{border:1px solid var(--border); border-radius:var(--r); padding:10px 12px; display:grid; gap:6px}
.mt-leg + .mt-leg{margin-top:10px}
.mt-dopo{padding:8px 10px; border-radius:var(--r); background:var(--sunken)}
.mt-dopo select{margin-top:2px}
.mt-row{display:grid; grid-template-columns:10px minmax(0,1fr) 168px 64px auto; gap:6px; align-items:center}
.mt-row > i{width:10px; height:22px; border-radius:3px; background:var(--c)}
.mt-row > i.occ{background:repeating-linear-gradient(-45deg,var(--c) 0 3px,transparent 3px 6px)}
.mt-row input{min-height:30px; padding:3px 6px; font-size:12px}
.mt-row.manual .mt-name::after{content:" ✎"; color:var(--warn)}
.mt-name{border:0; background:none; padding:0; text-align:left; font-size:12.5px; color:var(--fg); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mt-name:hover{color:var(--accent-ink); text-decoration:underline}
.mt-btns{display:flex; gap:2px}
.mt-btns .icon-btn{width:26px; height:26px; font-size:12px}
.mt-btns .icon-btn:disabled{opacity:.35; cursor:default}
.mt-add{min-height:30px; font-size:12px; padding:3px 8px}
.kv{display:grid; grid-template-columns:120px 1fr; gap:7px 14px; margin:0; font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-weight:500; min-width:0}
.why{font-size:12px; color:var(--muted); background:var(--sunken); border-radius:var(--r); padding:8px 10px; margin-top:8px}
.people{display:flex; flex-direction:column; gap:6px; margin-bottom:10px}
.person{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 12px; border:1px solid var(--border); border-radius:var(--r)}
.person.bad{border-color:oklch(50% 0.19 27 / .4); background:oklch(50% 0.19 27 / .04)}
.steps{display:flex; flex-direction:column}
.stepi{display:grid; grid-template-columns:12px 1fr auto; gap:10px; align-items:center; padding:7px 8px; border:0; background:none; text-align:left; border-radius:6px; cursor:pointer; font-size:12.5px}
.stepi:hover{background:var(--hover)}
.stepi[aria-current="true"]{background:var(--accent-soft)}
.stepi i{width:10px; height:10px; border-radius:3px; background:var(--c)}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.stats > div{background:var(--sunken); border-radius:var(--r); padding:10px 12px}
.stats b{display:block; font-family:var(--font-mono); font-size:17px; letter-spacing:-.03em}
.stats span{font-size:11.5px; color:var(--muted)}

dialog{border:1px solid var(--border); border-radius:var(--r-lg); padding:0; width:min(760px,96vw); max-height:92vh; background:var(--surface); color:var(--fg)}
dialog::backdrop{background:oklch(20% 0.015 145 / .38)}
dialog[open]{display:flex; flex-direction:column; animation:pop 200ms var(--ease)}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.99)}}
.dlg-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start}
.dlg-head h2{font-family:var(--font-display); font-size:20px}
.dlg-body{padding:20px; overflow:auto; display:flex; flex-direction:column; gap:16px}
.dlg-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; align-items:center}
.stepper{display:flex; gap:6px}
.stepper span{font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--sunken); color:var(--muted)}
.stepper span.on{background:var(--fg); color:var(--surface)}
.stepper span.done{background:oklch(46% 0.13 150 / .12); color:var(--ok)}
.drop{display:grid; place-items:center; gap:6px; padding:40px 20px; border:1.5px dashed var(--border-strong); border-radius:var(--r-lg); background:var(--sunken); text-align:center; cursor:pointer; transition:border-color 140ms, background 140ms}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.progress{height:6px; border-radius:999px; background:var(--sunken); overflow:hidden}
.progress b{display:block; height:100%; width:0; background:var(--accent); transition:width 260ms linear}
.fgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.conf{font-size:11px; font-weight:600; margin-top:4px; display:flex; gap:6px; align-items:center}
.field.low input,.field.low select{border-color:oklch(50% 0.13 70 / .6); background:oklch(50% 0.13 70 / .05)}
.preview{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}

}

<script>
"use strict";
/* ---- libreria componenti copiata dal prototipo Logistica da Catalogo/build.py: non modificare qui ---- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const showDlg=d=>{if(typeof d.showModal==="function")d.showModal();else d.setAttribute("open","open");};
const closeDlg=d=>{if(!d)return; if(typeof d.close==="function")d.close();else{d.removeAttribute("open"); d.dispatchEvent(new Event("close",{bubbles:false}));}};
const ICON={
  sheet:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>',
  gantt:'<path d="M4 6h8M7 12h10M10 18h7"/><path d="M3 3v18"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/>'
};
const icon=(n,s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const UI={
  /* stato: chip colorata. tono: ok | warn | err | info | (neutro) */
  stato:(testo,tono="",titolo="")=>`<span class="chip ${tono}"${titolo?` title="${esc(titolo)}"`:""}>${esc(testo)}</span>`,
  contatore:(n,tono="")=>n?`<span class="chip ${tono}">${n}</span>`:"",
  /* aiuto contestuale: icona «?» che mostra il testo da AIUTI[chiave] */
  hint:k=>`<button type="button" class="hint" data-hint="${esc(k)}" aria-label="Aiuto su questa sezione">?</button>`,
  /* sezione del pannello laterale: etichetta, azioni a destra, corpo */
  sezione:({titolo,azioni="",corpo,id="",aiuto})=>`<section class="sec"${id?` id="${id}"`:""}>${titolo||azioni?`<div class="sec-head"><div class="eyebrow grow">${titolo||""}${aiuto?` ${UI.hint(aiuto)}`:""}</div>${azioni}</div>`:""}${corpo}</section>`,
  /* pannello: card con intestazione */
  /* pannello: card con intestazione (titolo/azioni) o testata libera (es. schede), corpo e piede facoltativo */
  pannello:({titolo,azioni="",testata="",corpo,piede="",classe="",aiuto})=>`<section class="card ${classe}">${testata}${titolo||azioni?`<div class="card-head"><h2 class="grow">${titolo||""}${aiuto?` ${UI.hint(aiuto)}`:""}</h2>${azioni}</div>`:""}${corpo}${piede?`<div class="card-body small muted" style="border-top:1px solid var(--border)">${piede}</div>`:""}</section>`,
  /* schede: tab che cambiano state[chiave] */
  schede:(chiave,voci)=>`<div class="tabbar" role="tablist">${voci.map(([k,l])=>`<button role="tab" data-act="tab" data-k="${chiave}" data-v="${k}" aria-selected="${state[chiave]===k}">${l}</button>`).join("")}</div>`,
  /* misura: barra di riempimento con valore */
  misura:(v,max,unita="")=>`<span class="meter${v/max>.85?" hi":""}"><b style="width:${Math.min(100,v/max*100)}%"></b></span> <span class="mono small">${num(v,0)}${unita?" "+unita:""}</span>`,
  /* elenco: blocco con titolo e coppie [sinistra, destra] */
  elenco:(titolo,voci,vuoto="Nessuno")=>`<div><div class="eyebrow">${esc(titolo)}</div><ul>${voci.map(([a,b])=>`<li>${a}<span>${b}</span></li>`).join("")||`<li class="muted">${esc(vuoto)}</li>`}</ul></div>`,
  /* tipoTask: etichetta colorata di un tipo di micro-task */
  /* gettone: persona o mezzo compatto con ✕ (anteprima del piano) */
  gettone:(testo,rimuovi,problema=false)=>`<span class="pchip${problema?" bad":""}">${esc(testo)}<button type="button" ${rimuovi} aria-label="Togli ${esc(testo)}">${icon("x",12)}</button></span>`,
  tipoTask:tipo=>`<span class="tag" style="--c:var(${TIPI[tipo].c})"><i></i>${TIPI[tipo].l}</span>`,
  /* voce: riga punto + titolo + testo, senza azione (criticità, note) */
  voce:(tono,titolo,testo)=>`<div class="alert" style="cursor:default"><i class="dot ${tono}"></i><span class="a-t">${esc(titolo)}</span><span class="a-d">${esc(testo)}</span></div>`,
  /* blocco piegabile (chiuso di default) */
  piegabile:({titolo,corpo,aperto=false,conteggio=""})=>`<details class="fold"${aperto?" open":""}><summary><span class="grow">${titolo}</span>${conteggio!==""?`<span class="chip">${conteggio}</span>`:""}${icon("chev",14)}</summary><div class="fold-body">${corpo}</div></details>`,
  /* testata del pannello laterale: tipo colorato, titolo, sottotitolo, stati */
  intestazione:({colore,titolo,sotto="",stati=""})=>`<div class="ui-head"${colore?` style="--c:var(${colore})"`:""}>${colore?"<i></i>":""}<div class="grow"><div class="ui-head-t">${esc(titolo)}</div>${sotto?`<div class="small muted">${sotto}</div>`:""}</div>${stati}</div>`,
  kpi:(n,etichetta,stato)=>`<div class="kpi"><div class="n">${esc(n)}</div><div class="l">${esc(etichetta)}${stato?` ${UI.stato(stato[0],stato[1])}`:""}</div></div>`,
  kpiRiga:voci=>`<div class="stats">${voci.map(([n,l])=>`<div><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>`,
  /* dettagli: coppie etichetta → valore (valore già in HTML) */
  dettagli:voci=>`<dl class="kv">${voci.filter(Boolean).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`,
  /* tabella: colonne [{t:"Titolo", num:true}], righe = array di celle HTML */
  /* tabella: colonne [{t, num, mono, cls}]; righe = array di celle HTML oppure {celle, act} per righe cliccabili; senza colonne/titoli: solo corpo */
  tabella:({colonne,righe,vuoto="Nessun dato.",classe="",testa=true})=>{
    const cl=c=>[c?.num&&"num",c?.mono&&"mono",c?.cls].filter(Boolean).join(" ");
    const td=(v,i)=>v&&typeof v==="object"?`<td colspan="${v.span}"${v.cls?` class="${v.cls}"`:""}>${v.html}</td>`:`<td${cl(colonne[i])?` class="${cl(colonne[i])}"`:""}>${v}</td>`;
    const tr=r=>{const R=Array.isArray(r)?{celle:r}:r, cls=[R.act&&"click",R.cls].filter(Boolean).join(" ");
      return `<tr${cls?` class="${cls}"`:""}${R.act?` ${R.act} tabindex="0"`:""}${R.attr?` ${R.attr}`:""}>${R.celle.map(td).join("")}</tr>`;};
    return `<div class="table-box"><table class="${classe}">${testa?`<thead><tr>${colonne.map(c=>`<th${c.num?' class="num"':""}>${esc(c.t)}</th>`).join("")}</tr></thead>`:""}<tbody>${righe.length?righe.map(tr).join(""):`<tr><td colspan="${colonne.length}" class="empty">${esc(vuoto)}</td></tr>`}</tbody></table></div>`;},
  /* sequenza: mini-timeline orizzontale dei micro-task, il corrente evidenziato; ogni tappa apre il suo task */
  sequenza:(tasks,corrente)=>`<div class="seq" role="list">${tasks.map(x=>`<button class="seq-i${x.id===corrente?" on":""}${state.av.conflitti.has(x.id)?" conf":""}" role="listitem" data-act="task" data-id="${x.id}" style="--c:var(${TIPI[x.tipo].c})" title="${esc(tl(x)+" — "+rng(x))}" aria-current="${x.id===corrente}">
      <i></i><span class="seq-n">${esc(tsh(x))}</span><span class="seq-d mono">${GG[x.inizio.getDay()]} ${hm(x.inizio)}</span></button>`).join("")}</div>`,
  /* risorsa: riga persona o mezzo con stati e azione per toglierla */
  risorsa:({nome,sotto="",stati=[],problema=false,rimuovi})=>`<div class="person${problema?" bad":""}"><div class="grow"><strong>${esc(nome)}</strong> <span class="small muted">${esc(sotto)}</span></div>${stati.join(" ")}${rimuovi?`<button class="icon-btn" style="width:30px;height:30px" ${rimuovi} aria-label="Togli ${esc(nome)}">${icon("x",14)}</button>`:""}</div>`,
  /* avviso: punto colorato, titolo, dettaglio, azione suggerita; cliccabile se ha indice */
  avviso:(w,{clic=true,azione=true}={})=>{const i=state.av?.list.indexOf(w);
    return `<${clic&&i>=0?`button class="alert" data-act="warn" data-i="${i}"`:'div class="alert" style="cursor:default"'}><i class="dot ${sevCls(w.sev)}"></i><span class="a-t">${esc(w.titolo)}</span><span class="a-d">${esc(w.dettaglio)}</span>${azione&&w.azione?`<span class="a-f">${esc(w.azione)}</span>`:""}</${clic&&i>=0?"button":"div"}>`;},
  avvisi:(list,opz={})=>list.length?list.map(w=>UI.avviso(w,opz)).join(""):`<div class="empty">${esc(opz.vuoto||"Nessun avviso: risorse, capacità e accessi sono coerenti.")}</div>`,
  /* binario: stepper; i passi già fatti sono cliccabili se si passa act */
  binario:(passi,corrente,act)=>`<div class="stepper">${passi.map((s,i)=>i<corrente&&act&&i>=2?`<button type="button" class="done" data-act="${act}" data-v="${i}">${i+1} · ${s}</button>`:`<span class="${i===corrente?"on":i<corrente?"done":""}">${i+1} · ${s}</span>`).join("")}</div>`,
  inArrivo:(titolo,testo)=>`<div class="standby"><span class="chip info">In arrivo</span><span><strong>${esc(titolo)}</strong> ${esc(testo)}</span></div>`,
  nota:testo=>`<p class="why">${testo}</p>`,
  /* campo modulo con etichetta */
  campo:({id,etichetta,valore="",tipo="text",attr="",pieno=false})=>`<div${pieno?' class="full"':""}><label class="fl" for="${id}">${esc(etichetta)}</label>${tipo==="textarea"?`<textarea id="${id}" ${attr}>${esc(valore)}</textarea>`:`<input id="${id}" type="${tipo}" value="${esc(valore)}" ${attr}>`}</div>`,
  selezione:({id,etichetta,opzioni,attr="",nascosta=true})=>`<div>${etichetta?`<label class="${nascosta?"sr":"fl"}" for="${id}">${esc(etichetta)}</label>`:""}<select id="${id}" ${attr}>${opzioni.map(([v,l,sel])=>`<option value="${esc(v)}"${sel?" selected":""}>${esc(l)}</option>`).join("")}</select></div>`,
  /* conferma: dialog che sostituisce confirm(); restituisce una Promise<boolean> */
  conferma:({titolo,testo,ok="Conferma",pericolo=false})=>new Promise(res=>{
    const d=document.createElement("dialog"); d.className="confirm";
    d.innerHTML=`<div class="dlg-head"><h2 class="grow">${esc(titolo)}</h2></div><div class="dlg-body"><p>${esc(testo)}</p></div>
      <div class="dlg-foot"><button class="btn" value="no">Annulla</button><button class="btn ${pericolo?"btn-danger":"btn-primary"}" value="si">${esc(ok)}</button></div>`;
    document.body.append(d);
    d.querySelectorAll(".dlg-foot button").forEach(b=>b.onclick=()=>{d.returnValue=b.value; closeDlg(d);});
    d.addEventListener("close",()=>{res(d.returnValue==="si"); d.remove();});
    showDlg(d);
    d.querySelector(".dlg-foot .btn:last-child").focus();
  })
};
const dtStato=id=>state.dt[id]??={ord:null,pag:0,q:"",seg:{}};
const DT_TIPI={
  testo:{v:x=>String(x??"").toLocaleLowerCase("it"),f:x=>esc(x??"—")},
  numero:{v:x=>+x||0,f:x=>num(+x||0),num:true},
  data:{v:x=>x?+new Date(x):0,f:x=>x?`${GG[new Date(x).getDay()]} ${dm(new Date(x))} ${hm(new Date(x))}`:"—",mono:true},
  ora:{v:x=>x?+new Date(x):0,f:x=>x?hm(new Date(x)):"—",mono:true},
  stato:{v:x=>String(x??""),f:x=>esc(x??"")}
};
Object.assign(UI,{
  /* datatable: ordinamento cliccando l'intestazione, paginazione, conteggio, totali, stato vuoto */
  datatable:({id,colonne,righe,perPagina=25,vuoto="Nessun elemento",suggerimento="",riga,classe="",ordIniziale=null})=>{
    const st=dtStato(id); if(!st.ord&&ordIniziale) st.ord={...ordIniziale};
    const cols=colonne.map(c=>({...c,_t:DT_TIPI[c.tipo||"testo"],_v:c.valore||(r=>r[c.key])}));
    let lista=righe;
    if(st.ord){ const c=cols.find(x=>x.key===st.ord.key); if(c){ const val=c.ordina||(r=>c._t.v(c._v(r)));
      lista=[...righe].sort((a,b)=>{const x=val(a),y=val(b), r=typeof x==="string"?x.localeCompare(y,"it",{numeric:true}):x-y; return st.ord.dir==="desc"?-r:r;}); } }
    const n=lista.length, pagine=perPagina?Math.max(1,Math.ceil(n/perPagina)):1; st.pag=Math.min(st.pag,pagine-1);
    const vis=perPagina?lista.slice(st.pag*perPagina,(st.pag+1)*perPagina):lista;
    const cl=c=>[(c.num??c._t.num)&&"num",(c.mono??c._t.mono)&&"mono",c.cls].filter(Boolean).join(" ");
    const th=c=>{const att=!!st.ord && st.ord.key===c.key, dir=att?st.ord.dir:"";
      return c.sort===false||!c.key?`<th${cl(c)?` class="${cl(c)}"`:""}>${esc(c.t)}</th>`
        :`<th class="${cl(c)}" aria-sort="${att?(dir==="asc"?"ascending":"descending"):"none"}"><button type="button" class="dt-sort" data-act="dt-sort" data-dt="${id}" data-k="${c.key}">${esc(c.t)}<span class="dt-ico">${att?(dir==="asc"?"▲":"▼"):"↕"}</span></button></th>`;};
    const td=(c,r,i)=>`<td${cl(c)?` class="${cl(c)}"`:""}>${c.cella?c.cella(r):(Array.isArray(r)&&r[i]!==undefined?r[i]:r.celle?.[i]!==undefined?r.celle[i]:c._t.f(c._v(r)))}</td>`;
    const tr=(r)=>{const x=riga?riga(r):{}; return `<tr${x.act?` class="click${x.cls?" "+x.cls:""}" ${x.act} tabindex="0"`:x.cls?` class="${x.cls}"`:""}>${cols.map((c,i)=>td(c,r,i)).join("")}</tr>`;};
    const tot=cols.some(c=>c.totale)?`<tfoot><tr>${cols.map((c,i)=>`<td${cl(c)?` class="${cl(c)}"`:""}>${c.totale?num(lista.reduce((s,r)=>s+(+c._v(r)||0),0)):i===0?"Totale":""}</td>`).join("")}</tr></tfoot>`:"";
    const nav=pagine>1?`<nav class="dt-pag" aria-label="Pagine">${[["‹",st.pag-1,st.pag===0,"Pagina precedente"],...Array.from({length:pagine},(_,i)=>[i+1,i,false,"Pagina "+(i+1)]),["›",st.pag+1,st.pag===pagine-1,"Pagina successiva"]]
      .map(([t,p,dis,tit])=>`<button type="button" data-act="dt-pag" data-dt="${id}" data-p="${p}"${dis?" disabled":""}${p===st.pag&&typeof t==="number"?' aria-current="page" class="on"':""} title="${tit}">${t}</button>`).join("")}</nav>`:"";
    return `<div class="table-box"><table class="dt ${classe}"><thead><tr>${cols.map(th).join("")}</tr></thead><tbody>${vis.length?vis.map(tr).join("")
      :`<tr><td colspan="${cols.length}"><div class="empty"><strong>${esc(vuoto)}</strong>${suggerimento?`<div class="small">${esc(suggerimento)}</div>`:""}</div></td></tr>`}</tbody>${tot}</table></div>
      ${n?`<div class="dt-piede"><span>${pagine>1?`${st.pag*perPagina+1}–${Math.min(n,(st.pag+1)*perPagina)} di `:""}${n} ${n===1?"elemento":"elementi"}</span>${nav}</div>`:""}`;
  },
  /* filtri: ricerca + gruppi di segmenti con conteggio. segmenti: [{nome, etichetta, voci:[[valore, etichetta, n]]}] ("" = tutti) */
  filtri:({id,cerca="",segmenti=[]})=>{const st=dtStato(id), attivi=(st.q?1:0)+Object.values(st.seg).filter(Boolean).length;

      ${segmenti.map(g=>`<div class="seg seg-sm" role="group" aria-label="${esc(g.etichetta)}">${g.voci.map(([v,l,n])=>`<button data-act="dt-seg" data-dt="${id}" data-g="${g.nome}" data-v="${esc(v)}" aria-pressed="${(st.seg[g.nome]||"")===v}">${esc(l)}${n!=null?` <span class="seg-n">${n}</span>`:""}</button>`).join("")}</div>`).join("")}
      ${attivi?`<button class="btn btn-sm btn-ghost" data-act="dt-reset" data-dt="${id}">Togli i filtri</button>`:""}</div>`;},
  /* applica ricerca e segmenti di un filtro a un elenco. testo: r=>stringa ricercabile; campi: {nome: r=>valore} */
  filtra:(id,righe,testo,campi={})=>{const st=dtStato(id), q=st.q.toLocaleLowerCase("it").trim();

  /* conteggio per segmento, sul set già filtrato dalla ricerca e dagli altri gruppi */
  conta:(id,righe,testo,campi,gruppo,valore)=>{const st=dtStato(id), salv=st.seg[gruppo]; st.seg[gruppo]="";

/* salva una modifica; se tocca campi comuni e l'articolo ha varianti, chiede se applicarla anche a quelle.

/* le richieste vanno in coda: un campo può generare due «change» (modifica e uscita), e la seconda
   trova i valori già allineati e non chiede più nulla */
let _codaProp=Promise.resolve();
const salvaCampo=(...arg)=>(_codaProp=_codaProp.then(()=>_salvaCampo(...arg)).catch(()=>{}));
async function _salvaCampo(c,patch,nota,perAltri=()=>patch){
  const prima=art(c); if(Object.keys(patch).every(k=>uguale(prima[k],patch[k]))) return;
  setArt(c,patch,nota);
  const comuni=Object.keys(patch).filter(k=>COMUNE[k]), altre=varianti(c).filter(x=>comuni.some(k=>!uguale(x[k],perAltri(x)[k])));
  if(!comuni.length||!altre.length) return dopo("Scheda aggiornata");
  let scelta=PROP[c];
  if(!scelta){ render();
    const r=await scegli({titolo:"Applicare anche alle altre varianti?",ricorda:"Ricorda la scelta finché la scheda è aperta",
      testo:`Hai cambiato <strong>${esc(comuni.map(k=>COMUNE[k]).join(", "))}</strong>. ${altre.length===1?"Un'altra variante ha":`${altre.length} altre varianti hanno`} un valore diverso: ${altre.map(x=>`<span class="mono">${esc(x.c)}</span>`).join(", ")}.`,
      scelte:[["uno","Solo questa variante"],["tutti",`Anche alle altre ${altre.length}`,"btn-primary"]]});
    scelta=r.v; if(r.ricorda) PROP[c]=scelta; }
  if(scelta==="tutti"){ altre.forEach(x=>setArt(x.c,perAltri(x),`${nota} (propagato da ${c})`)); dopo(`Aggiornate anche ${altre.length} varianti`); }
  else dopo("Scheda aggiornata");
}

      <section><b class="small">Articoli che ricevono · ${dest.length}</b>

const compl=a=>CHECK.filter(([,,f])=>f(a)).length/CHECK.length;
const statoArt=a=>a.stato==="revisione"?["Da revisionare","warn"]:a.stato==="pubblicato"?["Pubblicato","ok"]:compl(a)===1?["Completo","info"]:["Da completare",""];

/* ---------- ricerca e selezione comune (articoli, fornitori, …) ----------
   cerca({titolo, voci:[{id,titolo,sotto,sw,gruppo}], gruppi:[[val,etichetta]], nuovo:q=>etichetta|null})
   → Promise<{id}|{nuovo:q}|null>. Un clic (o Invio sul primo risultato) sceglie e chiude. */
function cerca({titolo,voci,gruppi=[],nuovo=null,segnaposto="Cerca…"}){
  return new Promise(res=>{
    const st={q:"",g:gruppi[0]?.[0]??""}, d=document.createElement("dialog"); d.className="form pick";
    const trova=()=>{const q=st.q.toLowerCase().trim(); return voci.filter(v=>(!st.g||v.gruppo===st.g)&&(!q||(v.titolo+" "+v.sotto+" "+v.id).toLowerCase().includes(q))).slice(0,60);};
    const lista=()=>{const r=trova(), n=nuovo&&st.q.trim()&&nuovo(st.q.trim());
      d.querySelector(".pick-l").innerHTML=r.map(v=>`<button class="prop-r" data-id="${esc(v.id)}">${v.sw?sw(v.sw):""}<span class="grow"><strong>${esc(v.titolo)}</strong> <span class="small muted">${esc(v.sotto||"")}</span></span>${icon("chev",14)}</button>`).join("")
        +(n?`<button class="prop-r pick-new" data-nuovo="1"><span class="grow"><strong>+ ${esc(n)}</strong></span></button>`:"")
        +(!r.length&&!n?'<p class="small muted" style="padding:8px">Nessun risultato.</p>':"");
      d.querySelector(".pick-n").textContent=`${r.length}${r.length===60?"+":""} risultati`;};
    d.innerHTML=`<div class="dlg-head"><h2 class="grow">${esc(titolo)}</h2></div><div class="dlg-body">
      <div class="row wrap"><input type="search" class="grow pick-q" placeholder="${esc(segnaposto)}" aria-label="Cerca">${gruppi.length?`<div class="seg seg-sm" role="group">${gruppi.map(([v,l])=>`<button type="button" data-g="${esc(v)}" aria-pressed="${v===st.g}">${esc(l)}</button>`).join("")}</div>`:""}</div>
      <div class="prop-l pick-l" role="listbox"></div></div>
      <div class="dlg-foot"><span class="small muted grow pick-n"></span><button class="btn" data-x="1">Annulla</button></div>`;
    let esito=null;
    d.addEventListener("click",ev=>{const b=ev.target.closest("button"); if(!b) return;
      if(b.dataset.g!==undefined){ st.g=b.dataset.g; d.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.g===st.g)); return lista(); }
      if(b.dataset.id){ esito={id:b.dataset.id}; closeDlg(d); } if(b.dataset.nuovo){ esito={nuovo:st.q.trim()}; closeDlg(d); } if(b.dataset.x) closeDlg(d); });
    d.addEventListener("input",ev=>{ st.q=ev.target.value; lista(); });
    d.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.matches(".pick-q")){ ev.preventDefault(); d.querySelector(".pick-l button")?.click(); } });
    d.addEventListener("close",()=>{ d.remove(); res(esito); });
    document.body.append(d); lista(); showDlg(d); d.querySelector(".pick-q").focus();
  });
}

/* ---------- duplica articolo ----------
   Le varianti si aggregano per «modello» = codice senza «-CC» (es. SEDIV13001-01 e SEDIV13001-80).
   - come variante: stesso modello, nuovo codice colore → SEDIV13001-CC
   - come articolo a sé: nuovo progressivo nella stessa classe/sottoclasse/materiale → SEDIV13NNN-CC
   Si copia tutto tranne codice, colore, foto, colori RGB, giacenza, costi, stato e storico. */
const NON_COPIARE=["c","b","cc","foto","fotoNuove","rgb","giacenza","giacenzaIl","costi","stato","storico","dup","ai","nuovo"];
function nuovoModello(a){ const pre=a.b.slice(0,7);
  if(!/^[A-Z]{5}\d{2}$/.test(pre)) return a.b+"B";   // ponytail: codice fuori schema → suffisso B, da ricodificare
  const usati=ARTICOLI().filter(x=>x.b.startsWith(pre)).map(x=>+x.b.slice(7,10)||0);
  return pre+String(Math.max(0,...usati)+1).padStart(3,"0"); }
function dialogDuplica(c){
  const a=art(c), usati=new Set(ARTICOLI().filter(x=>x.b===a.b).map(x=>x.cc)), liberi=Object.entries(CAT.colori).filter(([k])=>!usati.has(k));
  const d=document.createElement("dialog"); d.className="form"; d.id="dupDlg";
  const anteprima=()=>{ const comeVar=d.querySelector('[name="dup-modo"]:checked').value==="variante", cc=$("dup-cc").value;
    $("dup-cod").textContent=`${comeVar?a.b:nuovoModello(a)}-${cc}`;
    $("dup-nota").textContent=comeVar?`Sarà la variante ${nomeColore(cc)} di «${a.t||a.d}»: si raggrupperà con le altre ${usati.size} varianti.`:"Sarà un modello nuovo, con le sue varianti: non si raggruppa con l'originale."; };
  d.innerHTML=`<div class="dlg-head"><h2 class="grow">Duplica · ${esc(a.t||a.d)}</h2></div><div class="dlg-body"><div class="fgrid">
      <div class="full"><span class="fl">Il duplicato diventa</span><div class="chipgroup" role="radiogroup">
        <label class="chk"><input type="radio" name="dup-modo" value="variante" checked>Una variante di colore dello stesso modello</label>
        <label class="chk"><input type="radio" name="dup-modo" value="nuovo">Un articolo a sé (modello nuovo)</label></div></div>
      <div><label class="fl" for="dup-cc">Colore (scala aziendale)</label><select id="dup-cc">${(liberi.length?liberi:Object.entries(CAT.colori)).map(([k,n])=>`<option value="${k}">${k} ${esc(n)}</option>`).join("")}</select></div>
      <div><span class="fl">Codice proposto</span><p class="mono" id="dup-cod" style="margin:8px 0 0"></p></div>
      ${UI.campo({id:"dup-t",etichetta:"Nome",valore:a.t||a.d,pieno:true})}</div>
      <p class="small muted" id="dup-nota"></p>
      ${UI.nota("Si copiano descrizioni, classe, misure, uso, prezzi, fornitori e composizione. Non si copiano foto, colori RGB, giacenza, costi e storico.")}</div>
    <div class="dlg-foot"><button class="btn" data-act="dlg-close">Annulla</button><button class="btn btn-primary" data-act="dup-ok" data-c="${esc(c)}">Crea duplicato</button></div>`;
  d.addEventListener("change",anteprima);
  document.body.append(d); d.addEventListener("close",()=>d.remove()); showDlg(d); anteprima();
}
function creaDuplicato(c){
  const a=art(c), comeVar=document.querySelector('[name="dup-modo"]:checked').value==="variante", cc=$("dup-cc").value;
  const b=comeVar?a.b:nuovoModello(a), cod=`${b}-${cc}`, t=$("dup-t").value.trim()||a.t||a.d;
  if(art(cod)) return toast(`Il codice ${cod} esiste già: scegli un altro colore`,"warn");
  const copia=structuredClone(Object.fromEntries(Object.entries(a).filter(([k])=>!NON_COPIARE.includes(k))));
  DB.nuovi.push({...copia,c:cod,b,cc,t,d:t.slice(0,40),nuovo:true,storico:[{q:oggi(),chi:RUOLO_N[state.ruolo],n:`duplicato da ${c} come ${comeVar?"variante":"articolo a sé"}`}]}); save();
  closeDlg($("dupDlg")); apri(cod); toast(`Creato ${cod}: completa foto e descrizione`);
}

/* un campo che perde il focus mentre la pagina si ridisegna genera un «change» e un secondo render annidato:
   lo si rimanda a dopo il primo */
let _rendering=false, _ancora=false;
function render(){
  if(_rendering){ _ancora=true; return; }
  _rendering=true; try{ disegna(); } finally{ _rendering=false; if(_ancora){ _ancora=false; render(); } }
}
function disegna(){
  document.body.classList.toggle("no-auth",!state.ruolo);
  if(!state.ruolo){ $("login").innerHTML=viewAccesso(); return; }
  $("login").innerHTML="";
  const vis=VISIBILI[state.ruolo]; if(!vis.includes(state.view)) state.view=vis[0];
  const tutti=ARTICOLI().map(conOv), nRev=tutti.filter(a=>a.stato==="revisione").length, nOk=tutti.filter(a=>a.stato==="pubblicato").length, nCompl=tutti.filter(a=>compl(a)===1).length;

    <div class="row"><span class="row"><i class="dot info"></i>Schede complete</span><b>${num(nCompl,0)}</b></div>

  if(state.drawer) state.drawer();
}

      {key:"st",t:"Stato",tipo:"stato",valore:({g})=>statoArt(g[0])[0],cella:({g})=>UI.stato(...statoArt(g[0]))}]})
    :griglia(list);

/* griglia a schede: stessa paginazione e stesso piede della datatable (stato in dtStato("cat")) */
function griglia(list){
  const st=dtStato("cat"), per=48, pagine=Math.max(1,Math.ceil(list.length/per)); st.pag=Math.min(st.pag,pagine-1);
  const vis=list.slice(st.pag*per,(st.pag+1)*per);
  const card=g=>{const a=g[0], [s,t]=statoArt(a), c=compl(a);
    return `<button class="pc" data-act="apri" data-c="${esc(a.c)}">${ph(a)}<div class="pc-b"><div class="mono tiny muted">${esc(a.b)}</div><div class="pc-t">${esc(a.t||a.d)}</div>
      <div class="row wrap" style="gap:4px">${g.slice(0,8).map(x=>sw(RGB[x.cc]||"#ddd",nomeColore(x.cc))).join("")}${g.length>8?`<span class="tiny muted">+${g.length-8}</span>`:""}<span class="grow"></span>${UI.stato(s,t)}</div>
      <span class="meter" title="Scheda completa al ${Math.round(c*100)}%"><b style="width:${c*100}%"></b></span></div></button>`;};
  const nav=pagine>1?`<nav class="dt-pag" aria-label="Pagine">${[["‹",st.pag-1,st.pag===0,"Pagina precedente"],...Array.from({length:pagine},(_,i)=>[i+1,i,false,"Pagina "+(i+1)]).filter(([,i])=>Math.abs(i-st.pag)<4||i===0||i===pagine-1),["›",st.pag+1,st.pag===pagine-1,"Pagina successiva"]]
    .map(([t,p,dis,tit])=>`<button type="button" data-act="dt-pag" data-dt="cat" data-p="${p}"${dis?" disabled":""}${p===st.pag&&typeof t==="number"?' aria-current="page" class="on"':""} title="${tit}">${t}</button>`).join("")}</nav>`:"";
  return vis.length?`<div class="pgrid">${vis.map(card).join("")}</div><div class="dt-piede"><span>${pagine>1?`${st.pag*per+1}–${Math.min(list.length,(st.pag+1)*per)} di `:""}${list.length} ${list.length===1?"elemento":"elementi"}</span>${nav}</div>`
    :`<div class="empty"><strong>Nessun articolo con questi filtri</strong><div class="small">Cambia la ricerca o togli i filtri.</div></div>`;
}

function aiProponi(a,nota=""){

  const temi=new Set(); if(stili.includes("Luxury")) temi.add("Gala").add("Matrimonio"); if(stili.includes("Rustico")) temi.add("Garden party").add("Matrimonio");
  if(stili.some(s=>["Tropicale","Boho"].includes(s))) temi.add("Estivo / beach"); if(/ross|oro|verde bott/i.test(nomeColore(a.cc))) temi.add("Natalizio"); temi.add("Aziendale / convention");

/* colori reali dalla foto: k-means sui pixel centrali, si scarta il cluster dello sfondo (bordi) */
function coloriDaImmagine(img){
  const N=64, cv=document.createElement("canvas"); cv.width=cv.height=N; const x=cv.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data, px=[], bordo=[];
  for(let y=0;y<N;y++) for(let i=0;i<N;i++){const k=(y*N+i)*4, p=[d[k],d[k+1],d[k+2]]; (y<3||y>N-4||i<3||i>N-4?bordo:px).push(p);}
  const K=5; let c=Array.from({length:K},(_,i)=>px[Math.floor(i*px.length/K)]); let lab=[];
  for(let it=0;it<10;it++){ lab=px.map(p=>c.reduce((b,q,j)=>{const dd=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2; return dd<b[1]?[j,dd]:b;},[0,1e9])[0]);
    c=c.map((q,j)=>{const m=px.filter((_,i)=>lab[i]===j); return m.length?[0,1,2].map(t=>m.reduce((s,p)=>s+p[t],0)/m.length):q;}); }
  const bg=[0,1,2].map(t=>bordo.reduce((s,p)=>s+p[t],0)/bordo.length);
  const cl=c.map((q,j)=>({q,n:lab.filter(l=>l===j).length})).filter(o=>Math.hypot(...o.q.map((v,i)=>v-bg[i]))>40);
  const tot=cl.reduce((s,o)=>s+o.n,0)||1;
  return cl.sort((a,b)=>b.n-a.n).slice(0,3).map(o=>({hex:rgb2hex(o.q),rgb:o.q.map(Math.round),pct:Math.round(o.n/tot*100)}));
}
/* "Nano Banana" simulato: oggetto centrato su sfondo pulito con ombra, secondo il prompt */
function presentazione(img,prompt){
  const S=640, cv=document.createElement("canvas"); cv.width=cv.height=S; const x=cv.getContext("2d");
  const amb=/giardin|ambient/i.test(prompt), grigio=/grigio|ombra/i.test(prompt);
  const g=x.createLinearGradient(0,0,0,S); if(amb){g.addColorStop(0,"#dfe9d6");g.addColorStop(1,"#9fb98a");} else if(grigio){g.addColorStop(0,"#f4f4f2");g.addColorStop(1,"#dcdcd8");} else {g.addColorStop(0,"#fff");g.addColorStop(1,"#f6f6f6");}
  x.fillStyle=g; x.fillRect(0,0,S,S);
  const r=Math.min(S*.78/img.width,S*.78/img.height), w=img.width*r, h=img.height*r;
  x.save(); x.shadowColor="rgba(0,0,0,.22)"; x.shadowBlur=30; x.shadowOffsetY=16; x.drawImage(img,(S-w)/2,(S-h)/2-10,w,h); x.restore();
  x.fillStyle="rgba(0,0,0,.45)"; x.font="12px system-ui"; x.fillText("simulazione Nano Banana",12,S-12);
  return cv.toDataURL("image/jpeg",.85);
}

function fotoEsempio(){const cv=document.createElement("canvas"); cv.width=640; cv.height=480; const x=cv.getContext("2d");
  x.fillStyle="#9a9a96"; x.fillRect(0,0,640,480); x.fillStyle="#7d7c78"; x.fillRect(0,330,640,150);
  x.fillStyle="#d4a017"; x.beginPath(); x.ellipse(320,250,150,110,0,0,Math.PI*2); x.fill();
  x.fillStyle="#b88a10"; x.beginPath(); x.ellipse(320,180,140,45,0,0,Math.PI*2); x.fill();
  x.strokeStyle="#7a5a08"; x.lineWidth=4; for(let i=-2;i<=2;i++){x.beginPath(); x.moveTo(320+i*55,170); x.quadraticCurveTo(320+i*62,260,320+i*50,350); x.stroke();}
  return cv.toDataURL("image/jpeg",.9);}

    const tog=l=>el.checked?[...new Set([...(l||[]),el.value])]:(l||[]).filter(x=>x!==el.value);
    return salvaCampo(el.dataset.c,{[f]:tog(cur)},`${COMUNE[f]}: ${el.checked?"+":"−"} ${el.value}`,x=>({[f]:tog(x[f])})); }
  if(el.dataset.cmp&&el.dataset.c){ const a=art(el.dataset.c), i=+el.dataset.i, v=el.dataset.cmp==="q"?Math.max(1,+el.value||1):el.value;
    setArt(el.dataset.c,{comp:a.comp.map((k,j)=>j===i?{...k,[el.dataset.cmp]:v}:k)},`componente: ${el.dataset.cmp==="q"?"quantità":"ruolo"}`); dopo("Componente aggiornato"); }
  if(el.dataset.fd&&el.dataset.c){ const a=art(el.dataset.c), i=+el.dataset.i, k=el.dataset.fd, v=k==="acquisto"?(el.value===""?null:+el.value):el.value.trim();
    if(k==="acquisto"&&v!=null&&v<0) return toast("Il prezzo non può essere negativo","warn");
    setArt(el.dataset.c,{forn:a.forn.map((f,j)=>j===i?{...f,[k]:v}:f)},`fornitore ${a.forn[i].nome}: ${k}`); dopo("Fornitore aggiornato"); }
  if(el.dataset.fp&&el.dataset.c){ const a=art(el.dataset.c); setArt(el.dataset.c,{forn:a.forn.map((f,i)=>({...f,principale:i===+el.dataset.fp}))},"fornitore principale"); dopo("Fornitore principale aggiornato"); }
  if(el.id==="pref-raggr"||el.id==="pref-cat"){ setPref(el.id==="pref-cat"?"categorie":"raggruppa",el.checked); const st=dtStato("cat"); st.pag=0; if(el.id==="pref-cat") st.seg.k2=""; render(); }
  if(el.id==="np-base") $("np-t").value=PROMPT_STD[+el.value].t;
  if(el.id==="m-file"&&el.files.length){ m.foto=[...(m.foto||[]),...await Promise.all([...el.files].map(leggiFile))]; rm(); }
  if(el.dataset.mp){ m.pid=+el.value; m.ptesto=null; rm(); }
  if(el.dataset.mr==="k1"){ m.res.k1=el.value; m.res.k2=classi2(el.value)[0]; rm(); }
});
document.addEventListener("input",ev=>{
  const el=ev.target, m=M();
  if(el.dataset?.dtq){ const id=el.dataset.dtq, st=dtStato(id); st.q=el.value; st.pag=0; const pos=el.selectionStart; render(); const q=$("dtq-"+id); q.focus(); q.setSelectionRange(pos,pos); }
  if(el.dataset.mq){ m.q=el.value; const p=el.selectionStart; rm(); const q=$("m-q"); q.focus(); q.setSelectionRange(p,p); }
  if(el.dataset.mn) m.nota=el.value;
  if(el.dataset.mpt) m.ptesto=el.value;
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&state.drawer&&!document.querySelector("dialog[open]")) closeDrawer();
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("tr[data-act]")){ev.preventDefault(); ev.target.click();}
});
render();
